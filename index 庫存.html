      { id: 49, name: '紙390蓋', spec: '375公克/包', unit: '包', systemStock: 11.0, alertLevel: 1, type: '每周' },

      { id: 67, name: '冰沙粉', spec: '1公斤/包', unit: '包', systemStock: 11.0, alertLevel: 1, type: '每周' }
    ];

    function App() {
      const [items, setItems] = useState(
        initialInventory.map(item => ({ ...item, actualCount: '' }))
      );
      const [activeTab, setActiveTab] = useState('每日');
      const [searchTerm, setSearchTerm] = useState('');
      const [showOrderModal, setShowOrderModal] = useState(false);

      // 處理使用者輸入數量
      const handleCountChange = (id, value) => {
        setItems(items.map(item => {
          if (item.id === id) {
            return { ...item, actualCount: value };
          }
          return item;
        }));
      };

      // 過濾顯示的項目
      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchTab = item.type === activeTab;
          const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
          return matchTab && matchSearch;
        });
      }, [items, activeTab, searchTerm]);

      // 計算需要叫貨的項目（已盤點且數量小於安全庫存）
      const orderList = useMemo(() => {
        return items.filter(item => 
          item.actualCount !== '' && parseFloat(item.actualCount) < item.alertLevel
        );
      }, [items]);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
          {/* 頂部導覽列 */}
          <header className="bg-white shadow-sm sticky top-0 z-10">

              <div className="flex items-center space-x-2 text-green-700">
                <ClipboardList className="w-6 h-6" />
                <h1 className="text-xl font-bold">總店庫存盤點系統</h1>
              </div>
              <button 
                onClick={() => setShowOrderModal(true)}
                className="flex items-center space-x-1 bg-red-50 text-red-600 px-4 py-2 rounded-full font-medium hover:bg-red-100 transition-colors shadow-sm border border-red-200"
              >
                <ShoppingCart className="w-5 h-5" />
                <span className="hidden sm:inline">結算 / 產生叫貨單</span>
                {orderList.length > 0 && (
                  <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">
                    {orderList.length}
                  </span>
                )}
              </button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-6">
            {/* 控制面板 (標籤與搜尋) */}
            <div className="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
              <div className="flex bg-gray-100 p-1 rounded-lg w-full sm:w-auto">
                <button
                  onClick={() => setActiveTab('每日')}
                  className={`flex-1 sm:px-6 py-2 rounded-md font-medium text-sm transition-all ${
                    activeTab === '每日' ? 'bg-white text-green-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                  }`}
                >
                  每日紀錄 ({items.filter(i => i.type === '每日').length})
                </button>
                <button
                  onClick={() => setActiveTab('每周')}
                  className={`flex-1 sm:px-6 py-2 rounded-md font-medium text-sm transition-all ${
                    activeTab === '每周' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                  }`}
                >
                  每周紀錄 ({items.filter(i => i.type === '每周').length})
                </button>
              </div>

              <div className="relative w-full sm:w-64">
                <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" />
                <input
                  type="text"
                  placeholder="搜尋品項..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                />
              </div>
            </div>

            {/* 電腦版表格視圖 (隱藏於手機版) */}
            <div className="hidden md:block bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-gray-50 text-gray-600 border-b border-gray-200 text-sm">
                    <th className="p-4 font-medium">品項名稱</th>
                    <th className="p-4 font-medium">規格</th>
                    <th className="p-4 font-medium">帳面庫存</th>
                    <th className="p-4 font-medium">安全警戒</th>
                    <th className="p-4 font-medium text-center bg-yellow-50">盤點輸入 (剩餘數量)</th>
                    <th className="p-4 font-medium">狀態</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {filteredItems.map(item => {
                    const count = parseFloat(item.actualCount);
                    const isCounted = item.actualCount !== '';
                    const isLowStock = isCounted && count < item.alertLevel;
                    const difference = isCounted ? (count - item.systemStock).toFixed(1) : null;

                    return (
                      <tr key={item.id} className={`hover:bg-gray-50 transition-colors ${isLowStock ? 'bg-red-50/30' : ''}`}>
                        <td className="p-4 font-medium text-gray-800">
                          {item.name}
                        </td>
                        <td className="p-4 text-sm text-gray-500">
                          {item.spec || '-'}
                        </td>
                        <td className="p-4">
                          <span className="text-gray-600">{item.systemStock}</span>
                          <span className="text-xs text-gray-400 ml-1">{item.unit}</span>
                        </td>
                        <td className="p-4">
                          <span className={`px-2 py-1 rounded text-xs font-medium ${item.type === '每日' ? 'bg-green-100 text-green-800' : 'bg-cyan-100 text-cyan-800'}`}>
                            {item.alertLevel} {item.unit}
                          </span>
                        </td>
                        <td className="p-4 bg-yellow-50/50">
                          <div className="flex items-center justify-center space-x-2">
                            <input
                              type="number"
                              step="0.1"
                              min="0"
                              value={item.actualCount}
                              onChange={(e) => handleCountChange(item.id, e.target.value)}
                              className={`w-24 px-3 py-2 border rounded-lg text-center font-bold focus:outline-none focus:ring-2 ${
                                isLowStock 
                                  ? 'border-red-300 focus:ring-red-500 text-red-600 bg-red-50' 
                                  : isCounted 
                                    ? 'border-green-300 focus:ring-green-500 text-green-700 bg-green-50'
                                    : 'border-gray-300 focus:ring-blue-500'
                              }`}
                              placeholder="輸入數量"
                            />
                            <span className="text-gray-500 w-6">{item.unit}</span>
                          </div>
                        </td>
                        <td className="p-4">
                          {isCounted ? (
                            <div className="flex flex-col">
                              {isLowStock ? (
                                <span className="flex items-center text-xs text-red-600 font-medium">
                                  <AlertCircle className="w-3 h-3 mr-1" /> 需叫貨
                                </span>
                              ) : (
                                <span className="flex items-center text-xs text-green-600 font-medium">
                                  <CheckCircle2 className="w-3 h-3 mr-1" /> 庫存足
                                </span>
                              )}
                              <span className={`text-xs mt-1 ${difference > 0 ? 'text-blue-600' : difference < 0 ? 'text-orange-600' : 'text-gray-400'}`}>
                                盤差: {difference > 0 ? '+' : ''}{difference}
                              </span>
                            </div>
                          ) : (
                            <span className="text-xs text-gray-400">尚未盤點</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* 手機版卡片視圖 (隱藏於電腦版) */}
            <div className="md:hidden space-y-4">
              {filteredItems.map(item => {
                const count = parseFloat(item.actualCount);
                const isCounted = item.actualCount !== '';
                const isLowStock = isCounted && count < item.alertLevel;
                const difference = isCounted ? (count - item.systemStock).toFixed(1) : null;

                return (
                  <div key={item.id} className={`bg-white p-4 rounded-xl shadow-sm border-l-4 ${
                    isLowStock ? 'border-red-500' : isCounted ? 'border-green-500' : 'border-gray-200'
                  }`}>
                    <div className="flex justify-between items-start mb-3">
                      <div>
                        <h3 className="font-bold text-gray-800 text-lg">{item.name}</h3>
                        <p className="text-xs text-gray-500 mt-1">規格: {item.spec || '無'} | 單位: {item.unit}</p>
                      </div>
                      <span className={`px-2 py-1 rounded text-xs font-medium ${item.type === '每日' ? 'bg-green-100 text-green-800' : 'bg-cyan-100 text-cyan-800'}`}>
                        安全線: {item.alertLevel}
                      </span>
                    </div>
                    
                    <div className="flex justify-between items-center bg-gray-50 p-3 rounded-lg mt-2">
                      <div className="text-sm">
                        <span className="text-gray-500 block text-xs mb-1">帳面庫存</span>
                        <span className="font-medium text-gray-700">{item.systemStock}</span>
                      </div>
                      
                      <div className="flex items-center space-x-2">
                        <label className="text-xs font-bold text-gray-600">實盤數量:</label>
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          value={item.actualCount}
                          onChange={(e) => handleCountChange(item.id, e.target.value)}
                          className={`w-20 px-2 py-1.5 border rounded-lg text-center font-bold text-lg focus:outline-none focus:ring-2 ${
                            isLowStock 
                              ? 'border-red-300 focus:ring-red-500 text-red-600 bg-red-50' 
                              : isCounted 
                                ? 'border-green-300 focus:ring-green-500 text-green-700 bg-green-50'
                                : 'border-gray-300 focus:ring-blue-500'
                          }`}
                        />
                      </div>
                    </div>

                    {isCounted && (
                      <div className="mt-3 flex justify-between items-center text-sm border-t border-gray-100 pt-2">
                        {isLowStock ? (
                          <span className="flex items-center font-medium text-red-600">
                            <AlertCircle className="w-4 h-4 mr-1" /> 數量不足，需叫貨
                          </span>
                        ) : (
                          <span className="flex items-center font-medium text-green-600">
                            <CheckCircle2 className="w-4 h-4 mr-1" /> 庫存充足
                          </span>
                        )}
                        <span className={`${difference > 0 ? 'text-blue-600' : difference < 0 ? 'text-orange-600' : 'text-gray-400'}`}>
                          盤差: {difference > 0 ? '+' : ''}{difference}
                        </span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {filteredItems.length === 0 && (
              <div className="text-center py-12 text-gray-400">
                <p>找不到符合「{searchTerm}」的品項</p>
              </div>
            )}
          </main>

          {/* 叫貨單/剩餘數量 結算彈出視窗 */}
          {showOrderModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-red-600 text-white p-4 flex justify-between items-center">
                  <h2 className="text-lg font-bold flex items-center">
                    <ShoppingCart className="w-5 h-5 mr-2" />
                    需叫貨清單 (剩餘數量警示)
                  </h2>
                  <button onClick={() => setShowOrderModal(false)} className="text-white hover:bg-red-700 p-1 rounded-full transition-colors">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                
                <div className="p-4 overflow-y-auto flex-1">
                  {orderList.length > 0 ? (
                    <div className="space-y-3">
                      <p className="text-sm text-gray-500 mb-4">以下品項的盤點剩餘數量已低於安全警戒值，請安排叫貨：</p>
                      {orderList.map(item => (
                        <div key={item.id} className="flex justify-between items-center border-b border-gray-100 pb-3">
                          <div>
                            <div className="font-bold text-gray-800">{item.name}</div>
                            <div className="text-xs text-gray-400">{item.spec}</div>
                          </div>
                          <div className="text-right">
                            <div className="text-red-600 font-bold text-lg">
                              剩 {item.actualCount} <span className="text-sm font-normal">{item.unit}</span>
                            </div>
                            <div className="text-xs text-gray-500">
                              (安全警戒: {item.alertLevel})
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-12 flex flex-col items-center">
                      <CheckCircle2 className="w-16 h-16 text-green-400 mb-3" />
                      <p className="text-lg font-bold text-gray-700">庫存都很充足！</p>
                      <p className="text-gray-500 mt-1">目前已盤點的品項都在安全庫存量之上。</p>
                    </div>
                  )}
                </div>

                <div className="p-4 border-t border-gray-100 bg-gray-50 flex gap-3">
                  <button 
                    onClick={() => setShowOrderModal(false)}
                    className="flex-1 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50"
                  >
                    返回繼續盤點
                  </button>
                  {orderList.length > 0 && (
                    <button 
                      onClick={() => {
                        let text = '【叫貨清單】\n';
                        orderList.forEach(i => text += `${i.name}：剩 ${i.actualCount}${i.unit}\n`);
                        alert('以下是清單內容，您可以複製後貼到 LINE：\n\n' + text);
                        setShowOrderModal(false);
                      }}
                      className="flex-1 py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 flex justify-center items-center"
                    >
                      <Save className="w-4 h-4 mr-2" />
                      匯出 / 複製清單
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 將 App 元件渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
