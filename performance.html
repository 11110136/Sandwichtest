<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>員工績效評分系統 | 現代簡約版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 引入 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    body {
      background-image: linear-gradient(to bottom right, rgba(250, 250, 249, 0.95), rgba(245, 245, 244, 0.85)), url('https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: #292524; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px; cursor: pointer; background: #e7e5e4; border-radius: 4px;
    }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 星星評分 */
    .star-rating { display: flex; gap: 6px; }
    .star-btn {
      font-size: 28px; cursor: pointer; color: #d6d3d1;
      transition: color 0.15s, transform 0.1s;
      background: none; border: none; padding: 0;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }

    /* 崗位選擇按鈕 */
    .station-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 10px 8px; border-radius: 12px; border: 1.5px solid #e7e5e4;
      background: white; cursor: pointer; transition: all 0.2s; min-width: 70px;
      font-size: 12px; color: #78716c;
    }
    .station-btn:hover { border-color: #a8a29e; background: #fafaf9; }
    .station-btn.active { border-color: #292524; background: #292524; color: white; }
    .station-btn .station-icon { font-size: 18px; }
  </style>
</head>
<body class="min-h-screen text-slate-800 selection:bg-stone-200">

  <!-- 懸浮全域選單 -->
  <div class="fixed top-4 left-4 z-[999] no-print">
    <button onclick="toggleGlobalMenu()" class="flex items-center justify-center w-10 h-10 md:w-11 md:h-11 bg-white/90 backdrop-blur border border-slate-200 rounded-xl shadow-sm hover:bg-slate-50 hover:shadow-md transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    </button>
    <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-slate-100 overflow-hidden transition-all">
      <a href="index.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 border-b border-slate-50">值班系統</a>
      <a href="cash.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 border-b border-slate-50">每週金庫結算</a>
      <a href="inventory.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-blue-50 border-b border-slate-50">庫存盤點</a>
      <a href="clean.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-green-50 border-b border-slate-50">清潔與排班管理</a>
      <a href="performance.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-purple-50 border-b border-slate-50">績效評估系統</a>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <nav class="bg-white/60 backdrop-blur-xl border-b border-white/40 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 md:px-6 h-16 md:h-20 flex items-center justify-between">
      <div class="flex items-center space-x-2 md:space-x-3 pl-12 md:pl-14">
        <div class="hidden sm:flex w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-tr from-stone-200 to-stone-400 items-center justify-center shadow-inner">
          <i data-lucide="clipboard-list" class="w-4 h-4 md:w-5 md:h-5 text-stone-800"></i>
        </div>
        <h1 class="text-sm md:text-xl font-bold md:font-light tracking-widest text-stone-800 uppercase">Evaluation</h1>
      </div>
      <div class="flex bg-stone-100/80 p-1 rounded-full shadow-inner backdrop-blur-sm border border-white/50 overflow-x-auto hide-scrollbar">
        <button id="tab-evaluate" onclick="switchTab('evaluate')" class="flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all bg-white text-stone-800 shadow-sm">
          <i data-lucide="clipboard-edit" class="w-3 h-3 md:w-4 md:h-4 mr-1 md:mr-2"></i> 店長評分
        </button>
        <button id="tab-cleaning" onclick="switchTab('cleaning')" class="flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700">
          <i data-lucide="sparkles" class="w-3 h-3 md:w-4 md:h-4 mr-1 md:mr-2"></i> 清潔評分
        </button>
        <button id="tab-dashboard" onclick="switchTab('dashboard')" class="flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700">
          <i data-lucide="bar-chart-3" class="w-3 h-3 md:w-4 md:h-4 mr-1 md:mr-2"></i> 今日總覽
        </button>
        <button id="tab-history" onclick="switchTab('history')" class="flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700">
          <i data-lucide="calendar-clock" class="w-3 h-3 md:w-4 md:h-4 mr-1 md:mr-2"></i> 歷史紀錄
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-12">

    <!-- ===== 1. 店長評分 ===== -->
    <div id="section-evaluate" class="block">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8">

        <!-- 左側員工列表 -->
        <div class="md:col-span-4 lg:col-span-3 space-y-2 md:space-y-4">
          <h2 class="text-xs md:text-sm font-semibold text-stone-400 tracking-widest uppercase mb-2 md:mb-4 pl-1">Select Staff</h2>
          <div id="employee-list" class="flex overflow-x-auto md:flex-col gap-2 md:gap-3 pb-3 md:pb-0 hide-scrollbar snap-x"></div>
        </div>

        <!-- 右側評分表單 -->
        <div class="md:col-span-8 lg:col-span-9">
          <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/60 p-5 md:p-10">

            <!-- 頂部：姓名 + 總分 -->
            <div class="flex flex-col sm:flex-row justify-between sm:items-start gap-4 mb-6 md:mb-8 border-b border-stone-100 pb-5 md:pb-6">
              <div class="flex-1">
                <h2 class="text-2xl md:text-3xl font-light text-stone-800 tracking-wide mb-1 md:mb-2 flex items-center gap-2">
                  <span id="current-emp-name" class="font-medium"></span>
                  <span class="text-stone-400 text-lg md:text-2xl">的績效評估</span>
                </h2>
                <p class="text-stone-500 text-xs md:text-sm">請選擇今日工作崗位，再針對各項目給予 1 至 10 分的評價</p>
              </div>
              <div class="text-left sm:text-right bg-stone-50 sm:bg-transparent p-4 sm:p-0 rounded-2xl sm:rounded-none flex-shrink-0">
                <p class="text-[10px] md:text-xs font-semibold text-stone-400 uppercase tracking-widest mb-1">今日總分</p>
                <p id="current-total-score" class="text-3xl md:text-4xl font-light text-stone-800">0.0</p>
              </div>
            </div>

            <!-- 崗位選擇 -->
            <div class="mb-6 md:mb-8">
              <p class="text-xs font-semibold text-stone-400 tracking-widest uppercase mb-3">今日工作崗位</p>
              <div class="flex gap-2 flex-wrap" id="station-selector"></div>
            </div>

            <!-- 評分項目表單 -->
            <div id="criteria-form" class="space-y-4 md:space-y-6"></div>

            <div class="mt-8 md:mt-10 flex justify-end">
              <button onclick="saveData()" class="w-full sm:w-auto flex items-center justify-center px-8 py-3.5 bg-stone-800 hover:bg-stone-900 text-white rounded-xl shadow-lg shadow-stone-800/20 transition-all active:scale-95 font-medium tracking-wide">
                <i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存今日評分
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ===== 2. 清潔評分模組（獨立）===== -->
    <div id="section-cleaning" class="hidden space-y-6 animate-[fadeIn_0.5s_ease-out]">
      <div class="text-center mb-6 md:mb-10">
        <h2 class="text-2xl md:text-3xl font-light text-stone-800 tracking-wide mb-2 md:mb-3">今日例行清潔評分</h2>
        <p class="text-xs md:text-sm text-stone-500">獨立紀錄清潔人員的表現，與工作崗位評分分開計算</p>
      </div>
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/60 p-6 md:p-10 max-w-2xl mx-auto">
        <div class="mb-8">
          <label class="block text-xs font-semibold text-stone-400 tracking-widest uppercase mb-3">今日例行清潔人員</label>
          <div class="flex flex-wrap gap-2" id="cleaning-emp-selector"></div>
        </div>
        <div id="cleaning-selected-list" class="space-y-4"></div>
        <div class="mt-8 flex justify-end">
          <button onclick="saveCleaningData()" class="w-full sm:w-auto flex items-center justify-center px-8 py-3.5 bg-stone-800 hover:bg-stone-900 text-white rounded-xl shadow-lg shadow-stone-800/20 transition-all active:scale-95 font-medium tracking-wide">
            <i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存清潔評分
          </button>
        </div>
      </div>
    </div>

    <!-- ===== 3. 今日總覽 ===== -->
    <div id="section-dashboard" class="hidden space-y-6 md:space-y-8 animate-[fadeIn_0.5s_ease-out]">
      <div class="text-center mb-6 md:mb-10">
        <h2 class="text-2xl md:text-3xl font-light text-stone-800 tracking-wide mb-2 md:mb-3">今日總覽面板</h2>
        <p class="text-xs md:text-sm text-stone-500">檢視所有員工 <span id="dashboard-date" class="font-medium"></span> 的加權總分</p>
      </div>

      <!-- 員工卡片 -->
      <div id="dashboard-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"></div>

      <!-- 詳細表格 -->
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/60 overflow-hidden mt-6 relative">
        <p class="text-xs text-stone-400 text-center py-2 md:hidden">👈 左右滑動查看完整表格 👉</p>
        <div class="overflow-x-auto hide-scrollbar">
          <table class="w-full text-left border-collapse min-w-[700px]">
            <thead><tr id="dashboard-table-head" class="bg-stone-50/50"></tr></thead>
            <tbody id="dashboard-table-body" class="divide-y divide-stone-100/50"></tbody>
          </table>
        </div>
      </div>

      <!-- 清潔評分總覽 -->
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/60 p-6 md:p-8">
        <div class="flex items-center gap-2 mb-5">
          <i data-lucide="sparkles" class="w-5 h-5 text-stone-600"></i>
          <h3 class="font-medium text-stone-800 text-base">今日清潔評分</h3>
        </div>
        <div id="cleaning-summary" class="text-stone-500 text-sm">尚無清潔評分紀錄</div>
      </div>
    </div>

    <!-- ===== 4. 歷史紀錄 ===== -->
    <div id="section-history" class="hidden space-y-6 md:space-y-8 animate-[fadeIn_0.5s_ease-out]">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white/80 p-6 rounded-3xl shadow-sm border border-white/60">
        <div>
          <h2 class="text-xl font-medium text-stone-800">查詢歷史評分</h2>
          <p class="text-sm text-stone-500 mt-1">選擇過去的日期來查看詳細績效</p>
        </div>
        <input type="date" id="history-date-picker" onchange="renderHistoryTable(this.value)"
          class="w-full sm:w-auto bg-stone-50 border border-stone-200 text-stone-800 text-sm rounded-xl focus:ring-stone-400 focus:border-stone-400 block p-2.5 outline-none font-medium cursor-pointer" />
      </div>
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/60 overflow-hidden relative">
        <p class="text-xs text-stone-400 text-center py-2 md:hidden">👈 左右滑動查看完整表格 👉</p>
        <div class="overflow-x-auto hide-scrollbar">
          <table class="w-full text-left border-collapse min-w-[700px]">
            <thead><tr id="history-table-head" class="bg-stone-50/50"></tr></thead>
            <tbody id="history-table-body" class="divide-y divide-stone-100/50"></tbody>
          </table>
        </div>
        <div id="history-empty-state" class="py-20 text-center flex flex-col items-center justify-center">
          <i data-lucide="calendar-search" class="w-12 h-12 text-stone-300 mb-4"></i>
          <p class="text-stone-500 font-medium">請從上方選擇日期</p>
        </div>
      </div>
    </div>

  </main>

  <div id="toast" class="fixed bottom-6 right-6 left-6 md:left-auto bg-stone-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center space-x-3 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50">
    <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400 flex-shrink-0"></i>
    <span id="toast-msg" class="font-medium tracking-wide text-sm">今日評分已成功儲存</span>
  </div>

  <script>
    // =============================================
    // LIFF 與 API 設定
    // =============================================
    const LIFF_ID = '2010172685-ojhA52eN';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxW1YFhFSaKmGFmdsL2bXm3ntApxvprsd7yPskUHLLZ8J2-lCUoX3mZJFHaQnK0bleEBg/exec';

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          showToast(`歡迎登入系統，${profile.displayName}`);
        }
      } catch (error) {
        console.error("LIFF 初始化失敗:", error);
      }
    }

    function toggleGlobalMenu() {
      document.getElementById('global-nav-menu').classList.toggle('hidden');
    }

    // =============================================
    // 員工資料（無年資邏輯）
    // =============================================
    const EMPLOYEES = [
      '俐嬅', '小郭', '菟菟', '林宣', '若菱', '祥瑋', '翠翠', 'Sam', '偲璇'
    ];

    // =============================================
    // 崗位設定
    // =============================================
    const STATIONS = [
      {
        id: 'fryer', name: '油鍋', icon: '🍳',
        criteria: [
          { id: 'speed',     name: '速度',     desc: '讓做餐人員等候的時間長短', weight: 0.30 },
          { id: 'fry',       name: '油炸狀態', desc: '是否過深/過淺、顏色均勻度', weight: 0.25 },
          { id: 'technique', name: '手法',     desc: '三明治剪開深淺、是否筆直居中', weight: 0.25 },
          { id: 'pro',       name: '專業度',   desc: '挑出品質不佳的三明治、油渣集中收集、環境整潔', weight: 0.20 },
        ]
      },
      {
        id: 'sandwich_main', name: '三明治主手', icon: '🥪',
        criteria: [
          { id: 'teamwork', name: '協作',     desc: '是否協同副手作餐、確認應做的餐點數量', weight: 0.25 },
          { id: 'filling',  name: '內餡擺放', desc: '美乃滋無收乾淨、魯蛋及番茄的擺放、火腿花有無散開', weight: 0.30 },
          { id: 'speed',    name: '速度',     desc: '有無配合現場訂單視情況，整併數量出餐', weight: 0.25 },
          { id: 'quality',  name: '品質把關', desc: '確認成品外觀、內餡是否完整正確', weight: 0.20 },
        ]
      },
      {
        id: 'sandwich_sub', name: '三明治副手', icon: '🤝',
        criteria: [
          { id: 'order',   name: '確認訂單', desc: '核對訂單內容出餐，出餐時客人是否方便帶走', weight: 0.25 },
          { id: 'clean',   name: '環境整潔', desc: '工作環境是否隨時保持整潔', weight: 0.25 },
          { id: 'filling', name: '內餡擺放', desc: '美乃滋無收乾淨、魯蛋及番茄的擺放、火腿花有無散開', weight: 0.25 },
          { id: 'speed',   name: '速度配合', desc: '有無配合現場訂單視情況，整併數量出餐', weight: 0.25 },
        ]
      },
      {
        id: 'cashier', name: '結帳', icon: '💰',
        criteria: [
          { id: 'accuracy',  name: '結帳正確性', desc: '結帳清晰、是否有誤差', weight: 0.30 },
          { id: 'stock',     name: '備品補充',   desc: '備品是否即時補充', weight: 0.20 },
          { id: 'service',   name: '服務性',     desc: '態度是否良好且專業，幫助客人疑難排解', weight: 0.25 },
          { id: 'packaging', name: '包裝完整性', desc: '餐點是否擺放平整、內容物及餐具是否正確擺放', weight: 0.25 },
        ]
      },
      {
        id: 'kitchen', name: '廚房', icon: '👨‍🍳',
        criteria: [
          { id: 'efficiency', name: '烹製效率', desc: '食品烹製效率、物料是否先進先出', weight: 0.25 },
          { id: 'detail',     name: '料理細節', desc: '番茄的刀工、茶類奶精是否泡散、綠豆是否煮至柔軟', weight: 0.30 },
          { id: 'clean',      name: '整潔度',   desc: '餐具及鍋碗瓢盆是否整潔、環境的整潔及收納', weight: 0.25 },
          { id: 'speed',      name: '出菜速度', desc: '配合前場需求的出菜節奏', weight: 0.20 },
        ]
      },
    ];

    let currentEvalData = {};
    let historyData = {};
    let cleaningData = {};
    let currentSelectedEmp = EMPLOYEES[0];
    let todayString = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

    // =============================================
    // 初始化
    // =============================================
    function initApp() {
      loadDataFromStorage();
      renderEmployeeList();
      selectEmployee(EMPLOYEES[0]);
      renderCleaningModule();
      document.getElementById('dashboard-date').innerText = `(${todayString})`;
      lucide.createIcons();
    }

    function generateDefaultEval(defaultScore = 5) {
      let data = {};
      EMPLOYEES.forEach(emp => {
        data[emp] = { station: STATIONS[0].id };
        STATIONS.forEach(st => {
          data[emp][st.id] = {};
          st.criteria.forEach(c => { data[emp][st.id][c.id] = { score: defaultScore, note: '' }; });
        });
      });
      return data;
    }

    function generateDefaultCleaning() {
      let d = {};
      EMPLOYEES.forEach(emp => { d[emp] = { selected: false, stars: 0 }; });
      return d;
    }

    function loadDataFromStorage() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v3'));
      if (!storage) {
        let yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        let yd = yesterday.toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
        storage = {
          lastDate: todayString,
          current: generateDefaultEval(5),
          currentCleaning: generateDefaultCleaning(),
          history: {},
          historyCleaning: {}
        };
        storage.history[yd] = generateDefaultEval(8);
        storage.historyCleaning[yd] = generateDefaultCleaning();
      } else if (storage.lastDate !== todayString) {
        storage.history[storage.lastDate] = storage.current;
        storage.historyCleaning[storage.lastDate] = storage.currentCleaning;
        storage.current = generateDefaultEval(5);
        storage.currentCleaning = generateDefaultCleaning();
        storage.lastDate = todayString;
      }
      currentEvalData = storage.current;
      historyData = storage.history;
      cleaningData = storage.currentCleaning || generateDefaultCleaning();
      localStorage.setItem('EvalSystemDB_v3', JSON.stringify(storage));
    }

    // =============================================
    // 分數計算（所有人同標準）
    // =============================================
    function calculateScore(dataObj, empName) {
      const stationId = dataObj[empName]?.station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      let total = 0;
      station.criteria.forEach(c => {
        const d = dataObj[empName][stationId];
        if (d && d[c.id]) total += (d[c.id].score * 10) * c.weight;
      });
      return total.toFixed(1);
    }

    // =============================================
    // 崗位選擇
    // =============================================
    function renderStationSelector() {
      document.getElementById('station-selector').innerHTML = STATIONS.map(st => `
        <button class="station-btn ${currentEvalData[currentSelectedEmp]?.station === st.id ? 'active' : ''}"
          onclick="selectStation('${st.id}')" id="station-btn-${st.id}">
          <span class="station-icon">${st.icon}</span>
          <span>${st.name}</span>
        </button>
      `).join('');
    }

    function selectStation(stationId) {
      currentEvalData[currentSelectedEmp].station = stationId;
      STATIONS.forEach(st => {
        const btn = document.getElementById(`station-btn-${st.id}`);
        if (btn) btn.className = `station-btn ${stationId === st.id ? 'active' : ''}`;
      });
      renderEvaluationForm();
      updateTotal();
    }

    // =============================================
    // 員工列表
    // =============================================
    function renderEmployeeList() {
      document.getElementById('employee-list').innerHTML = EMPLOYEES.map(emp => `
        <button id="btn-emp-${emp}" onclick="selectEmployee('${emp}')"
          class="snap-start flex-shrink-0 flex items-center p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border bg-white/70 text-stone-600 border-white hover:bg-white hover:shadow-sm">
          <div class="flex items-center space-x-2 md:space-x-3">
            <div class="w-8 h-8 rounded-full flex items-center justify-center emp-icon-bg transition-colors bg-stone-100">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <span class="font-medium tracking-wide text-sm md:text-base whitespace-nowrap">${emp}</span>
          </div>
        </button>
      `).join('');
    }

    function selectEmployee(empName) {
      currentSelectedEmp = empName;
      document.getElementById('current-emp-name').innerText = empName;
      EMPLOYEES.forEach(emp => {
        const btn = document.getElementById(`btn-emp-${emp}`);
        if (!btn) return;
        if (emp === empName) {
          btn.className = "snap-start flex-shrink-0 flex items-center p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border bg-stone-800 text-white border-stone-800 shadow-lg shadow-stone-800/20";
          btn.querySelector('.emp-icon-bg').className = "w-8 h-8 rounded-full flex items-center justify-center emp-icon-bg bg-stone-700";
        } else {
          btn.className = "snap-start flex-shrink-0 flex items-center p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border bg-white/70 text-stone-600 border-white hover:bg-white hover:shadow-sm";
          btn.querySelector('.emp-icon-bg').className = "w-8 h-8 rounded-full flex items-center justify-center emp-icon-bg bg-stone-100";
        }
      });
      renderStationSelector();
      renderEvaluationForm();
      updateTotal();
    }

    // =============================================
    // 評分表單
    // =============================================
    function renderEvaluationForm() {
      const stationId = currentEvalData[currentSelectedEmp]?.station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      const empData = currentEvalData[currentSelectedEmp][stationId];

      document.getElementById('criteria-form').innerHTML = station.criteria.map(c => {
        const d = empData?.[c.id] || { score: 5, note: '' };
        return `
          <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 lg:gap-6 p-5 md:p-6 rounded-2xl bg-stone-50/50 border border-stone-100/50 hover:bg-white transition-colors">
            <div class="lg:w-1/3">
              <div class="flex items-center space-x-2 mb-1">
                <h3 class="text-base md:text-lg font-medium text-stone-800">${c.name}</h3>
                <span class="px-2 py-0.5 rounded-full bg-stone-200/50 text-stone-600 text-[10px] font-medium">${Math.round(c.weight * 100)}%</span>
              </div>
              <p class="text-xs md:text-sm text-stone-500">${c.desc}</p>
            </div>
            <div class="lg:w-2/3 space-y-4 mt-2 lg:mt-0">
              <div class="flex items-center space-x-4 md:space-x-6">
                <input type="range" min="1" max="10" value="${d.score}"
                  oninput="updateScore('${stationId}', '${c.id}', this.value)"
                  class="w-full h-2 bg-stone-200 rounded-lg cursor-pointer" />
                <div id="score-display-${c.id}" class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-stone-800 text-white rounded-xl shadow-sm text-lg">${d.score}</div>
              </div>
              <div class="relative">
                <i data-lucide="message-square" class="absolute top-2.5 left-3 w-4 h-4 text-stone-400"></i>
                <input type="text" placeholder="新增備註 (選填)..." value="${d.note}"
                  onchange="updateNote('${stationId}', '${c.id}', this.value)"
                  class="w-full pl-9 pr-4 py-2 bg-white border border-stone-200 rounded-xl text-xs md:text-sm focus:ring-2 focus:ring-stone-400/20 focus:outline-none" />
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function updateScore(stationId, cId, val) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      currentEvalData[currentSelectedEmp][stationId][cId].score = parseInt(val, 10);
      document.getElementById(`score-display-${cId}`).innerText = val;
      updateTotal();
    }
    function updateNote(stationId, cId, val) {
      if (currentEvalData[currentSelectedEmp][stationId]) {
        currentEvalData[currentSelectedEmp][stationId][cId].note = val;
      }
    }
    function updateTotal() {
      document.getElementById('current-total-score').innerText = calculateScore(currentEvalData, currentSelectedEmp);
    }

    // =============================================
    // 儲存績效（含 API 同步）
    // =============================================
    async function saveData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v3')) || {};
      storage.current = currentEvalData;
      localStorage.setItem('EvalSystemDB_v3', JSON.stringify(storage));

      const records = EMPLOYEES.map(emp => {
        const stationId = currentEvalData[emp]?.station || STATIONS[0].id;
        const stationName = STATIONS.find(s => s.id === stationId)?.name || stationId;
        return { name: emp, station: stationName, score: calculateScore(currentEvalData, emp) };
      });

      const payload = { type: 'evaluation', date: todayString, records };

      try {
        showToast('正在同步至 Google 試算表...');
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        showToast(result.status === 'success' ? '今日評分已成功儲存並同步至雲端' : '雲端同步失敗，但已存在本機');
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
        console.error('API Error:', error);
      }
    }

    // =============================================
    // 清潔評分模組（獨立）
    // =============================================
    function renderCleaningModule() {
      const sel = document.getElementById('cleaning-emp-selector');
      sel.innerHTML = EMPLOYEES.map(emp => {
        const isSelected = cleaningData[emp]?.selected;
        return `
          <button id="clean-sel-${emp}" onclick="toggleCleaningEmp('${emp}')"
            class="px-3 py-1.5 rounded-full text-sm border transition-all ${isSelected
              ? 'bg-stone-800 text-white border-stone-800'
              : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">
            ${emp}
          </button>
        `;
      }).join('');
      renderCleaningSelectedList();
    }

    function toggleCleaningEmp(empName) {
      cleaningData[empName].selected = !cleaningData[empName].selected;
      if (!cleaningData[empName].selected) cleaningData[empName].stars = 0;
      renderCleaningModule();
    }

    function renderCleaningSelectedList() {
      const selectedEmps = EMPLOYEES.filter(e => cleaningData[e]?.selected);
      const container = document.getElementById('cleaning-selected-list');
      if (selectedEmps.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-400 text-sm py-8">請從上方選擇今日例行清潔人員</p>`;
        return;
      }
      container.innerHTML = selectedEmps.map(emp => {
        const stars = cleaningData[emp].stars || 0;
        return `
          <div class="flex items-center justify-between p-4 rounded-2xl bg-stone-50/50 border border-stone-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-stone-200 flex items-center justify-center text-stone-700 font-medium text-sm">${emp.charAt(0)}</div>
              <span class="font-medium text-stone-800">${emp}</span>
            </div>
            <div class="star-rating" id="stars-${emp}">
              ${[1,2,3,4,5].map(n => `
                <button class="star-btn ${n <= stars ? 'active' : ''}" onclick="setStars('${emp}', ${n})" title="${n}星">★</button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function setStars(empName, n) {
      cleaningData[empName].stars = n;
      const container = document.getElementById(`stars-${empName}`);
      if (container) {
        container.querySelectorAll('.star-btn').forEach((btn, i) => btn.classList.toggle('active', i < n));
      }
    }

    async function saveCleaningData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v3')) || {};
      storage.currentCleaning = cleaningData;
      localStorage.setItem('EvalSystemDB_v3', JSON.stringify(storage));

      const records = EMPLOYEES.filter(e => cleaningData[e]?.selected)
        .map(emp => ({ name: emp, stars: cleaningData[emp].stars || 0 }));

      if (records.length === 0) { showToast('本機儲存成功 (無人參與清潔)'); return; }

      const payload = { type: 'cleaning', date: todayString, records };

      try {
        showToast('正在同步至 Google 試算表...');
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        showToast(result.status === 'success' ? '清潔評分已成功儲存並同步至雲端' : '雲端同步失敗，但已存在本機');
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
        console.error('API Error:', error);
      }
    }

    // =============================================
    // 總覽
    // =============================================
    function buildTableHTML(dataSource, theadId, tbodyId) {
      document.getElementById(theadId).innerHTML = `
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-medium text-stone-500 uppercase tracking-wider whitespace-nowrap">員工姓名</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-medium text-stone-500 whitespace-nowrap">今日崗位</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-bold text-stone-800 whitespace-nowrap text-right">加權總分</th>
      `;
      document.getElementById(tbodyId).innerHTML = EMPLOYEES.map(emp => {
        const stationId = dataSource[emp]?.station || STATIONS[0].id;
        const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
        const score = calculateScore(dataSource, emp);
        const s = parseFloat(score);
        const scoreColor = s >= 80 ? 'text-emerald-600' : s < 60 ? 'text-red-400' : 'text-stone-800';
        return `
          <tr class="hover:bg-stone-50/30">
            <td class="py-4 px-4 md:py-5 md:px-6 text-sm md:text-base font-medium text-stone-800 whitespace-nowrap">${emp}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-sm text-stone-500 whitespace-nowrap">${station.icon} ${station.name}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-right font-medium text-lg md:text-xl ${scoreColor}">${score}</td>
          </tr>
        `;
      }).join('');
    }

    function renderDashboard() {
      document.getElementById('dashboard-cards').innerHTML = EMPLOYEES.map(emp => {
        const score = calculateScore(currentEvalData, emp);
        const s = parseFloat(score);
        const scoreColor = s >= 80 ? 'text-emerald-600' : s < 60 ? 'text-red-400' : 'text-stone-800';
        return `
          <div class="bg-white/80 backdrop-blur-xl border border-white/60 p-4 md:p-6 rounded-3xl shadow-sm text-center hover:shadow-md transition-all">
            <div class="w-12 h-12 md:w-14 md:h-14 mx-auto rounded-full bg-stone-50 border border-stone-100 flex items-center justify-center mb-2 shadow-sm">
              <i data-lucide="user" class="w-5 h-5 text-stone-600"></i>
            </div>
            <h3 class="text-lg font-medium text-stone-800">${emp}</h3>
            <div class="text-3xl md:text-4xl font-light mt-2 ${scoreColor}">${score}</div>
          </div>
        `;
      }).join('');

      buildTableHTML(currentEvalData, 'dashboard-table-head', 'dashboard-table-body');

      const cleaningSelected = EMPLOYEES.filter(e => cleaningData[e]?.selected);
      const cleanSummaryEl = document.getElementById('cleaning-summary');
      if (cleaningSelected.length === 0) {
        cleanSummaryEl.innerHTML = '<p class="text-stone-400 text-sm">今日尚無清潔評分紀錄</p>';
      } else {
        cleanSummaryEl.innerHTML = `<div class="flex flex-wrap gap-3">${cleaningSelected.map(emp => {
          const stars = cleaningData[emp].stars || 0;
          return `
            <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-stone-50 border border-stone-100">
              <span class="font-medium text-stone-800">${emp}</span>
              <span class="text-amber-400">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</span>
              <span class="text-xs text-stone-500">${stars}/5</span>
            </div>
          `;
        }).join('')}</div>`;
      }
      lucide.createIcons();
    }

    function initHistoryTab() {
      const picker = document.getElementById('history-date-picker');
      let yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      picker.max = yesterday.toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
      const dates = Object.keys(historyData).sort((a, b) => new Date(b) - new Date(a));
      if (dates.length > 0) { picker.value = dates[0]; renderHistoryTable(dates[0]); }
      else { picker.value = ''; renderHistoryTable(''); }
    }

    function renderHistoryTable(dateString) {
      const emptyState = document.getElementById('history-empty-state');
      const tableHead = document.getElementById('history-table-head');
      const tableBody = document.getElementById('history-table-body');
      if (!dateString || !historyData[dateString]) {
        tableHead.innerHTML = ''; tableBody.innerHTML = '';
        emptyState.innerHTML = `
          <i data-lucide="calendar-x" class="w-12 h-12 text-stone-300 mb-4"></i>
          <p class="text-stone-500 font-medium">此日期沒有評分紀錄</p>
          <p class="text-xs text-stone-400 mt-1">請嘗試透過日曆選擇其他日期</p>`;
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      emptyState.classList.add('hidden');
      buildTableHTML(historyData[dateString], 'history-table-head', 'history-table-body');
      lucide.createIcons();
    }

    // =============================================
    // 頁籤切換
    // =============================================
    function switchTab(tab) {
      ['evaluate', 'cleaning', 'dashboard', 'history'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700";
      });
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all bg-white text-stone-800 shadow-sm";
      if (tab === 'dashboard') renderDashboard();
      if (tab === 'history') initHistoryTab();
      if (tab === 'cleaning') renderCleaningModule();
    }

    function showToast(msg) {
      document.getElementById('toast-msg').innerText = msg;
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 3000);
    }

    window.onload = async () => {
      await initLiff();
      initApp();
    };
  </script>
</body>
</html>
