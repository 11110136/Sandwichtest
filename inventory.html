    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;

// --- 資料庫 ---
const initialInventory = [
    { id: 1, name: '火腿S', spec: '20條/箱', unit: '箱', systemStock: 1.1, alertLevel: 0.5, tag: '每日' },
    { id: 2, name: '沙拉S', spec: '600公克/包', unit: '包', systemStock: 63.0, alertLevel: 50, tag: '每日' },
    { id: 3, name: '水煮蛋', spec: '顆', unit: '顆', systemStock: 400.0, alertLevel: 400, tag: '每日' },

    { id: 11, name: '涼麵醬(原味)', spec: '80g/包', unit: '包', systemStock: 63.0, alertLevel: 103, tag: '每日' },

    { id: 14, name: '金蘭甲級醬油', spec: '5公升/罐', unit: '罐', systemStock: 5.0, alertLevel: 2, tag: '每周' },
    { id: 15, name: '鹽S', spec: '1000公克/包, 24包/箱', unit: '包', systemStock: 18.0, alertLevel: 1, tag: '每周' },
    { id: 16, name: '幸福醋', spec: '5.5公升/罐', unit: '罐', systemStock: 6.5, alertLevel: 1, tag: '每周' },
    { id: 17, name: '芝麻醬', spec: '2.7公升/罐, 6罐/箱', unit: '罐', systemStock: 4.0, alertLevel: 2, tag: '每周' },
    { id: 18, name: '金味王醬油', spec: '5公升/罐', unit: '罐', systemStock: 3.8, alertLevel: 1, tag: '每周' },
    { id: 19, name: '金梅油膏', spec: '4.5公斤/罐', unit: '罐', systemStock: 5.8, alertLevel: 1, tag: '每周' },
    { id: 20, name: '細砂糖S', spec: '25公斤/包', unit: '包', systemStock: 6.0, alertLevel: 0.2, tag: '每周' },
    { id: 32, name: '冬瓜磚', spec: '30塊/箱', unit: '箱', systemStock: 22.0, alertLevel: 6, tag: '每周' },
    { id: 38, name: '味噌', spec: '9公斤/箱', unit: '箱', systemStock: 2.2, alertLevel: 0.8, tag: '每周' },
    { id: 46, name: '吸管', spec: '100支/包', unit: '包', systemStock: 6.0, alertLevel: 0.5, tag: '每周' },
    { id: 50, name: '紙520湯杯', spec: '50個/條', unit: '條', systemStock: 22.0, alertLevel: 2, tag: '每周' },
    { id: 56, name: '熱感應發票紙', spec: '650個/包', unit: '包', systemStock: 122.0, alertLevel: 1, tag: '每周' },

const getTodayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const mockHistoryData = () => {
    const history = {};
    const d = new Date();
    for(let i=1; i<=5; i++) {
    const pastDate = new Date(d);
    pastDate.setDate(d.getDate() - (i * 2));
    const dateStr = `${pastDate.getFullYear()}-${String(pastDate.getMonth() + 1).padStart(2, '0')}-${String(pastDate.getDate()).padStart(2, '0')}`;
    history[dateStr] = [
        { ...initialInventory[0], actualCount: (Math.random() * 2).toFixed(1) },
        { ...initialInventory[1], actualCount: Math.floor(Math.random() * 70) },
        { ...initialInventory[4], actualCount: Math.floor(Math.random() * 40) }
    ];
    }
    return history;
};

// --- 全域導覽列 Component ---
const GlobalNav = () => {
    const [isOpen, setIsOpen] = useState(false);
    const menuRef = useRef(null);

    useEffect(() => {
        const handleClickOutside = (event) => {
            if (menuRef.current && !menuRef.current.contains(event.target)) {
                setIsOpen(false);
            }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
    }, []);

    return (
        <div className="fixed top-4 left-4 z-[990] no-print" ref={menuRef}>
            <button 
                onClick={() => setIsOpen(!isOpen)} 
                className="flex items-center justify-center w-11 h-11 bg-white/90 backdrop-blur border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 hover:shadow-md transition-all"
            >
                <MenuIcon className="w-[22px] h-[22px] text-slate-600" />
            </button>
            {isOpen && (
                <div className="absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-100 overflow-hidden transition-all origin-top-left">
                    <a href="index.html" className="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border-b border-gray-50 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                        值班系統
                    </a>
                    <a href="cash.html" className="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 border-b border-gray-50 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
                        每週收銀結算
                    </a>
                    <a href="inventory.html" className="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                        庫存盤點系統
                    </a>
                </div>
            )}
        </div>
    );
};

function App() {
    const [activeTab, setActiveTab] = useState('record');
    const [todayCounts, setTodayCounts] = useState([]);
    const [historyData, setHistoryData] = useState(mockHistoryData());
    const [calendarMonth, setCalendarMonth] = useState(new Date());
    const [selectedHistoryDate, setSelectedHistoryDate] = useState(null);
    const [searchQuery, setSearchQuery] = useState('');
    const [isDropdownOpen, setIsDropdownOpen] = useState(false);
    const [selectedItem, setSelectedItem] = useState(null);
    const [inputValue, setInputValue] = useState('');
    const [showOrderModal, setShowOrderModal] = useState(false);
    const inputRef = useRef(null);

    const filteredItems = useMemo(() => {
        if (!searchQuery) return initialInventory;
        return initialInventory.filter(item => 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.tag && item.tag.includes(searchQuery))
        );
    }, [searchQuery]);

    const handleSelectItem = (item) => {
        setSelectedItem(item);
        setSearchQuery(item.name);
        setIsDropdownOpen(false);
        setInputValue('');
        setTimeout(() => {
        if (inputRef.current) inputRef.current.focus();
        }, 50);
    };

    const handleAddRecord = () => {
        if (!selectedItem || inputValue === '') return;
        const count = parseFloat(inputValue);
        if (isNaN(count)) return;

        setTodayCounts(prev => {
        const existingIndex = prev.findIndex(item => item.id === selectedItem.id);
        const newItem = { ...selectedItem, actualCount: count };
        if (existingIndex >= 0) {
            const newList = [...prev];
            newList.splice(existingIndex, 1);
            return [newItem, ...newList];
        } else {
            return [newItem, ...prev];
        }
        });

        const todayStr = getTodayStr();
        setHistoryData(prev => {
        const newHistory = { ...prev };
        const existingDayList = newHistory[todayStr] || [];
        const existingIdx = existingDayList.findIndex(i => i.id === selectedItem.id);
        if(existingIdx >= 0) {
            existingDayList[existingIdx].actualCount = count;
        } else {
            existingDayList.push({ ...selectedItem, actualCount: count });
        }
        newHistory[todayStr] = [...existingDayList];
        return newHistory;
        });

        setSelectedItem(null);
        setSearchQuery('');
        setInputValue('');
    };

    const handleUpdateListItem = (id, newCountStr) => {
        setTodayCounts(prev => prev.map(item => {
        if (item.id === id) {
            return { ...item, actualCount: newCountStr };
        }
        return item;
        }));
    };

    const handleRemoveListItem = (id) => {
        setTodayCounts(prev => prev.filter(item => item.id !== id));
    };

    const orderList = useMemo(() => {
        return todayCounts.filter(item => {
        const count = parseFloat(item.actualCount);
        return !isNaN(count) && count < item.alertLevel;
        });
    }, [todayCounts]);

    const prevMonth = () => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1));
    const nextMonth = () => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1));

    const renderCalendar = () => {
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayStr = getTodayStr();
        const monthName = calendarMonth.toLocaleString('zh-TW', { month: 'long' });

        const days = [];
        for (let i = 0; i < firstDay; i++) {
            days.push(<div key={`empty-${i}`} className="h-10"></div>);
        }
        
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const hasRecord = !!historyData[dateStr] && historyData[dateStr].length > 0;
            const isToday = dateStr === todayStr;
            const isSelected = selectedHistoryDate === dateStr;

            days.push(
                <div 
                    key={dateStr} 
                    onClick={() => hasRecord ? setSelectedHistoryDate(dateStr) : null}
                    className={`h-12 flex flex-col items-center justify-center relative rounded-xl cursor-pointer transition-all
                        ${hasRecord ? 'hover:bg-blue-50' : 'text-gray-300 cursor-default'}
                        ${isSelected ? 'bg-blue-100 ring-2 ring-blue-400' : ''}
                        ${isToday && !isSelected ? 'bg-gray-100' : ''}
                    `}
                >
                    <span className={`text-sm font-medium ${isToday ? 'text-blue-700' : hasRecord ? 'text-gray-800' : 'text-gray-400'}`}>
                        {i}
                    </span>
                    {hasRecord && (
                        <div className="w-1.5 h-1.5 bg-blue-500 rounded-full mt-1"></div>
                    )}
                </div>
            );
        }

        return (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
                <div className="flex justify-between items-center mb-4 px-2">
                    <button onClick={prevMonth} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors"><ChevronLeft className="w-5 h-5"/></button>
                    <h3 className="font-bold text-lg text-gray-800">{year}年 {monthName}</h3>
                    <button onClick={nextMonth} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors"><ChevronRight className="w-5 h-5"/></button>
                </div>
                <div className="grid grid-cols-7 gap-1 text-center mb-2">
                    {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                        <div key={d} className="text-xs font-medium text-gray-400 py-1">{d}</div>
                    ))}
                </div>
                <div className="grid grid-cols-7 gap-1">
                    {days}
                </div>
            </div>
        );
    };

    const DropdownOverlay = () => isDropdownOpen && (
        <div 
        className="fixed inset-0 z-10" 
        onClick={() => setIsDropdownOpen(false)}
        ></div>
    );

    return (
        <div className="min-h-screen pb-24 flex flex-col">
            {/* 匯入全域導覽列 */}
            <GlobalNav />

            {/* 頂部導覽列 (加入 pl-16 讓出空間給左上角選單) */}
            <header className="bg-white shadow-sm sticky top-0 z-30">
                <div className="max-w-2xl mx-auto px-4 py-3 pl-16 flex justify-between items-center">
                    <div className="flex items-center space-x-2 text-blue-700">
                        <ClipboardList className="w-6 h-6" />
                        <h1 className="text-xl font-bold tracking-tight">庫存盤點系統</h1>
                    </div>
                    <button 
                        onClick={() => setShowOrderModal(true)}
                        className="flex items-center space-x-1 bg-red-50 text-red-600 px-4 py-2 rounded-full font-medium hover:bg-red-100 transition-colors shadow-sm border border-red-200"
                    >
                        <ShoppingCart className="w-5 h-5" />
                        <span className="hidden sm:inline">今日結算</span>
                        {orderList.length > 0 && (
                        <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">
                            {orderList.length}
                        </span>
                        )}
                    </button>
                </div>
                
                {/* 頁籤切換 */}
                <div className="max-w-2xl mx-auto px-4 pb-0 flex border-b border-gray-200">
                    <button
                        onClick={() => { setActiveTab('record'); setSelectedHistoryDate(null); }}
                        className={`flex-1 py-3 text-sm font-medium border-b-2 transition-colors flex items-center justify-center gap-2 ${
                            activeTab === 'record' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'
                        }`}
                    >
                        <ListPlus className="w-4 h-4" />
                        紀錄庫存
                    </button>
                    <button
                        onClick={() => setActiveTab('history')}
                        className={`flex-1 py-3 text-sm font-medium border-b-2 transition-colors flex items-center justify-center gap-2 ${
                            activeTab === 'history' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'
                        }`}
                    >
                        <CalendarIcon className="w-4 h-4" />
                        歷史紀錄
                    </button>
                </div>
            </header>

            <main className="flex-1 max-w-2xl w-full mx-auto px-4 py-6">
                
                {/* ---------------- 頁籤 1: 紀錄庫存 ---------------- */}
                {activeTab === 'record' && (
                <div className="space-y-6 animate-in fade-in duration-300">
                    
                    {/* 智慧輸入區塊 */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h2 className="text-sm font-bold text-gray-500 mb-3 flex items-center">
                        <Search className="w-4 h-4 mr-1" /> 選擇盤點品項
                    </h2>
                    
                    <div className="relative z-20">
                        <div className="relative">
                        <input
                            type="text"
                            placeholder="點擊展開選單，或輸入關鍵字搜尋..."
                            value={searchQuery}
                            onChange={(e) => {
                            setSearchQuery(e.target.value);
                            setSelectedItem(null); 
                            setIsDropdownOpen(true);
                            }}
                            onFocus={() => setIsDropdownOpen(true)}
                            className="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-base font-medium"
                        />
                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                            <ChevronDown className={`w-5 h-5 transition-transform duration-200 ${isDropdownOpen ? 'rotate-180' : ''}`} />
                        </div>
                        </div>

                        {/* 下拉選單 */}
                        <DropdownOverlay />
                        {isDropdownOpen && (
                        <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-gray-100 rounded-xl shadow-lg max-h-60 overflow-y-auto custom-scrollbar z-20">
                            {filteredItems.length > 0 ? (
                            filteredItems.map(item => (
                                <div 
                                key={item.id} 
                                onClick={() => handleSelectItem(item)}
                                className="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0 flex justify-between items-center transition-colors"
                                >
                                <div>
                                    <span className="font-bold text-gray-800 block">{item.name}</span>
                                    <span className="text-xs text-gray-400 block mt-0.5">{item.spec || '無規格'}</span>
                                </div>
                                <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">{item.tag}</span>
                                </div>
                            ))
                            ) : (
                            <div className="px-4 py-6 text-center text-gray-400 text-sm">找不到相關品項</div>
                            )}
                        </div>
                        )}
                    </div>

                    {/* 數量輸入與確認按鈕 (當選中品項時顯示) */}
                    {selectedItem && (
                        <div className="mt-4 pt-4 border-t border-gray-100 flex items-end gap-3 animate-in slide-in-from-top-2 duration-200">
                        <div className="flex-1">
                            <label className="block text-xs font-bold text-gray-500 mb-1.5">
                            輸入數量 ({selectedItem.unit})
                            </label>
                            <input
                            ref={inputRef}
                            type="number"
                            step="0.1"
                            min="0"
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleAddRecord()}
                            placeholder={`帳面庫存: ${selectedItem.systemStock}`}
                            className="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-bold text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-blue-50/30"
                            />
                        </div>
                        <button 
                            onClick={handleAddRecord}
                            disabled={inputValue === ''}
                            className="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm"
                        >
                            加入
                        </button>
                        </div>
                    )}
                    </div>

                    {/* 今日盤點清單 */}
                    <div>
                    <h2 className="text-sm font-bold text-gray-500 mb-3 ml-1 flex justify-between items-center">
                        <span>今日已盤點 ({todayCounts.length})</span>
                        {todayCounts.length > 0 && <span className="text-xs font-normal">直接修改數字即可更新</span>}
                    </h2>
                    
                    {todayCounts.length === 0 ? (
                        <div className="text-center py-12 bg-white rounded-2xl border border-gray-100 border-dashed">
                        <ClipboardList className="w-12 h-12 text-gray-300 mx-auto mb-2" />
                        <p className="text-gray-400">目前還沒有紀錄<br/>請從上方搜尋並加入品項</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                        {todayCounts.map(item => {
                            const count = parseFloat(item.actualCount);
                            const isLowStock = !isNaN(count) && count < item.alertLevel;
                            
                            return (
                            <div key={item.id} className={`bg-white p-4 rounded-xl shadow-sm border-l-4 relative group ${
                                isLowStock ? 'border-red-500' : 'border-green-500'
                            }`}>
                                <button 
                                onClick={() => handleRemoveListItem(item.id)}
                                className="absolute top-3 right-3 text-gray-300 hover:text-red-500 transition-colors p-1"
                                >
                                <Trash2 className="w-4 h-4" />
                                </button>

                                <div className="flex justify-between items-start mb-2 pr-6">
                                <div>
                                    <h3 className="font-bold text-gray-800 text-base">{item.name}</h3>
                                    <p className="text-xs text-gray-400 mt-0.5">{item.spec} · 安全線: {item.alertLevel}</p>
                                </div>
                                </div>
                                
                                <div className="flex items-center gap-3">
                                <div className="flex-1 bg-gray-50 rounded-lg p-2 flex justify-between items-center">
                                    <span className="text-xs text-gray-500 font-medium">盤點數量</span>
                                    <div className="flex items-center">
                                    <input
                                        type="number"
                                        step="0.1"
                                        min="0"
                                        value={item.actualCount}
                                        onChange={(e) => handleUpdateListItem(item.id, e.target.value)}
                                        className={`w-20 px-2 py-1 bg-white border rounded-md text-center font-bold text-base focus:outline-none focus:ring-2 ${
                                        isLowStock 
                                            ? 'border-red-300 focus:ring-red-500 text-red-600' 
                                            : 'border-green-300 focus:ring-green-500 text-green-700'
                                        }`}
                                    />
                                    <span className="text-sm text-gray-500 ml-2 w-4">{item.unit}</span>
                                    </div>
                                </div>
                                </div>

                                {isLowStock && (
                                <div className="mt-2 flex items-center text-xs font-medium text-red-600">
                                    <AlertCircle className="w-3.5 h-3.5 mr-1" /> 低於安全警戒，需叫貨
                                </div>
                                )}
                            </div>
                            );
                        })}
                        </div>
                    )}
                    </div>
                </div>
                )}

                {/* ---------------- 頁籤 2: 歷史紀錄 ---------------- */}
                {activeTab === 'history' && (
                <div className="animate-in fade-in duration-300">
                    {renderCalendar()}

                    {/* 顯示選擇日期的明細 */}
                    {selectedHistoryDate && (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden animate-in slide-in-from-bottom-2">
                        <div className="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                        <h3 className="font-bold text-gray-800 flex items-center">
                            <CalendarIcon className="w-4 h-4 mr-2 text-blue-600" />
                            {selectedHistoryDate} 盤點明細
                        </h3>
                        <button onClick={() => setSelectedHistoryDate(null)} className="text-gray-400 hover:text-gray-600">
                            <X className="w-5 h-5" />
                        </button>
                        </div>
                        
                        <div className="divide-y divide-gray-50">
                        {historyData[selectedHistoryDate].map(item => {
                            const count = parseFloat(item.actualCount);
                            const isLowStock = !isNaN(count) && count < item.alertLevel;
                            
                            return (
                            <div key={item.id} className="p-4 flex justify-between items-center hover:bg-gray-50">
                                <div>
                                <div className="font-bold text-gray-800">{item.name}</div>
                                <div className="text-xs text-gray-400 mt-1">安全線: {item.alertLevel} {item.unit}</div>
                                </div>
                                <div className="text-right">
                                <div className={`font-bold text-lg ${isLowStock ? 'text-red-600' : 'text-green-600'}`}>
                                    {item.actualCount} <span className="text-sm font-normal text-gray-500">{item.unit}</span>
                                </div>
                                {isLowStock && (
                                    <div className="text-[10px] text-red-500 font-medium flex items-center justify-end mt-1">
                                    <AlertCircle className="w-3 h-3 mr-0.5" /> 需叫貨
                                    </div>
                                )}
                                </div>
                            </div>
                            )
                        })}
                        </div>
                    </div>
                    )}
                    
                    {!selectedHistoryDate && (
                    <div className="text-center py-8 text-gray-400 text-sm">
                        點擊日曆上有藍點的日期查看盤點明細
                    </div>
                    )}
                </div>
                )}
            </main>

            {/* 結算 / 叫貨單彈出視窗 */}
            {showOrderModal && (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200">
                    <div className="bg-red-600 text-white p-4 flex justify-between items-center">
                    <h2 className="text-lg font-bold flex items-center">
                        <ShoppingCart className="w-5 h-5 mr-2" />
                        今日需叫貨清單
                    </h2>
                    <button onClick={() => setShowOrderModal(false)} className="text-white hover:bg-red-700 p-1 rounded-full transition-colors">
                        <X className="w-5 h-5" />
                    </button>
                    </div>
                    
                    <div className="p-4 overflow-y-auto flex-1 bg-gray-50">
                    {orderList.length > 0 ? (
                        <div className="space-y-3">
                        <p className="text-sm text-gray-500 mb-2">以下盤點數量低於安全警戒值：</p>
                        {orderList.map(item => (
                            <div key={item.id} className="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
                            <div>
                                <div className="font-bold text-gray-800">{item.name}</div>
                                <div className="text-xs text-gray-400 mt-1">規格: {item.spec || '無'}</div>
                            </div>
                            <div className="text-right bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">
                                <div className="text-red-600 font-bold">
                                剩 {item.actualCount} <span className="text-sm font-normal">{item.unit}</span>
                                </div>
                                <div className="text-[10px] text-red-400 mt-0.5">
                                低於 {item.alertLevel}
                                </div>
                            </div>
                            </div>
                        ))}
                        </div>
                    ) : (
                        <div className="text-center py-12 flex flex-col items-center">
                        <div className="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-4">
                            <CheckCircle2 className="w-8 h-8" />
                        </div>
                        <p className="text-lg font-bold text-gray-800">庫存都很充足！</p>
                        <p className="text-gray-500 text-sm mt-1">今日已盤點的品項皆在安全量之上</p>
                        </div>
                    )}
                    </div>

                    <div className="p-4 border-t border-gray-100 bg-white flex gap-3">
                    <button 
                        onClick={() => setShowOrderModal(false)}
                        className="flex-1 py-3 bg-white border-2 border-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors"
                    >
                        返回
                    </button>
                    {orderList.length > 0 && (
                        <button 
                        onClick={() => {
                            let text = `【${getTodayStr()} 叫貨清單】\n\n`;
                            orderList.forEach(i => text += `▪ ${i.name}：剩 ${i.actualCount} ${i.unit}\n`);
                            alert('以下是清單內容，您可以複製後貼到 LINE：\n\n' + text);
                            setShowOrderModal(false);
                        }}
                        className="flex-[2] py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 flex justify-center items-center shadow-sm transition-colors"
                        >
                        <Save className="w-5 h-5 mr-2" />
                        複製清單傳LINE
                        </button>
                    )}
                    </div>
                </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
