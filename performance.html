    body {

      background-position: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: #292524; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px; cursor: pointer; background: #e7e5e4; border-radius: 4px;
    }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 星星評分 */
    .star-rating { display: flex; gap: 6px; }
    .star-btn {
      cursor: pointer; color: #d6d3d1;
      transition: color 0.15s, transform 0.1s;
      background: none; border: none; padding: 0;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }

    /* 等級徽章 */
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;

    /* 崗位選擇按鈕 (優化版) */

      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1.5px solid #e7e5e4;
      background: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 14px; font-weight: 600; color: #57534e; letter-spacing: 0.025em;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .station-btn:hover { 
      border-color: #d6d3d1; background: #fafaf9; transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .station-btn.active {
      border-color: #292524; background: #292524; color: white;
      box-shadow: 0 4px 12px rgba(41, 37, 36, 0.2);
    }
    /* 給 Icon 獨立的圓形保護底色 */

      width: 28px; height: 28px; border-radius: 50%;
      background: #f5f5f4; transition: all 0.2s;
    }
    .station-btn.active .icon-wrapper {
      background: white; 
    }

    };

    const GRADE_TABLE = {
      '到職1年以內': { over90: 'O', over80: 'O', over70: 'A', over60: 'B', under60: 'C' },
      '到職1~3年':  { over90: 'O', over80: 'A', over70: 'B', over60: 'C', under60: 'D' },

    let cleaningData = {};

    let currentStation = STATIONS[0].id;
    let todayString = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

    // =============================================
    // 初始化與拉取 Supabase 班表資料
    // =============================================
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          showToast(`歡迎回來，${profile.displayName}`);
        }
      } catch (error) {
        console.error("LIFF 初始化失敗:", error);
      }
    }

    async function fetchTodayShift() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const day = today.getDate();

      try {
        const { data, error } = await supabase
          .from('shift_schedules')
          .select('shift')
          .eq('year', year)
          .eq('month', month)
          .eq('day', day)
          .single();

        if (error) throw error;

        if (data && data.shift) {
          // 以頓號分割並清理空白
          const shiftNames = data.shift.split('、').map(n => n.trim()).filter(n => n);
          
          // 從總表篩選出有上班的員工，以便帶入年資
          EMPLOYEES = ALL_EMPLOYEES.filter(emp => shiftNames.includes(emp.name));
          
          // 如果班表出現不在 ALL_EMPLOYEES 裡的新人，自動建立並預設今天到職
          shiftNames.forEach(name => {
            if (!EMPLOYEES.find(e => e.name === name) && name !== 'X' && name !== '') {
              EMPLOYEES.push({ name: name, joinDate: new Date().toISOString().split('T')[0] });
            }
          });
        }
      } catch (err) {
        console.error('取得今日班表失敗:', err);
        showToast('無法取得雲端班表，將載入預設所有員工');
        EMPLOYEES = [...ALL_EMPLOYEES];
      }
    }

        document.getElementById('employee-list').innerHTML = '<p class="text-stone-400 text-sm p-4 text-center border-2 border-dashed border-stone-200 rounded-2xl">今日查無班表</p>';
        document.getElementById('evaluate-content').innerHTML = '<div class="h-64 flex items-center justify-center text-stone-400">目前沒有人員可以評分</div>';
        return;
      }

      currentSelectedEmp = EMPLOYEES[0].name;

      loadDataFromStorage();
      renderEmployeeList();
      selectEmployee(currentSelectedEmp);
      renderStationSelector();
      renderCleaningModule();
      lucide.createIcons();
    }

    function generateDefaultEval(defaultScore = 5) {
      let data = {};
      EMPLOYEES.forEach(emp => {
        data[emp.name] = { station: STATIONS[0].id, grade: '' };
        STATIONS.forEach(st => {
          data[emp.name][st.id] = {};
          st.criteria.forEach(c => { data[emp.name][st.id][c.id] = { score: defaultScore, note: '' }; });
        });
      });
      return data;
    }

    function generateDefaultCleaning() {
      let d = {};
      EMPLOYEES.forEach(emp => { d[emp.name] = { selected: false, stars: 0 }; });
      return d;
    }

    function loadDataFromStorage() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2'));
      
      if (!storage) {
        storage = {
          lastDate: todayString,
          current: generateDefaultEval(5),
          currentCleaning: generateDefaultCleaning(),
          history: {},
          historyCleaning: {}
        };
      } else if (storage.lastDate !== todayString) {
        storage.history[storage.lastDate] = storage.current;
        storage.historyCleaning[storage.lastDate] = storage.currentCleaning;
        storage.current = generateDefaultEval(5);
        storage.currentCleaning = generateDefaultCleaning();
        storage.lastDate = todayString;
      }
      
      // 確保動態載入的員工如果在 storage 沒有預設值，幫他們建立空殼
      if(!storage.current) storage.current = {};
      if(!storage.currentCleaning) storage.currentCleaning = {};
      
      EMPLOYEES.forEach(emp => {
        if(!storage.current[emp.name]) {
          storage.current[emp.name] = { station: STATIONS[0].id, grade: '' };
          STATIONS.forEach(st => {
            storage.current[emp.name][st.id] = {};
            st.criteria.forEach(c => { storage.current[emp.name][st.id][c.id] = { score: 5, note: '' }; });
          });
        }
        if(!storage.currentCleaning[emp.name]) {
          storage.currentCleaning[emp.name] = { selected: false, stars: 0 };
        }
      });

      currentEvalData = storage.current;
      cleaningData = storage.currentCleaning;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
    }

    // =============================================
    // 計算邏輯
    // =============================================
    function getSeniorityMonths(joinDate) {
      const join = new Date(joinDate);
      const now = new Date();
      return (now.getFullYear() - join.getFullYear()) * 12 + (now.getMonth() - join.getMonth());
    }
    
    function getSeniorityLabel(months) {
      if (months <= 12) return '到職1年以內';
      if (months <= 36) return '到職1~3年';
      return '到職3~5年';
    }

    function getSuggestedGrade(empName, score) {
      const emp = EMPLOYEES.find(e => e.name === empName);
      if (!emp) return null;
      const months = getSeniorityMonths(emp.joinDate);
      const label = getSeniorityLabel(months);
      const table = GRADE_TABLE[label];
      let grade;
      const s = parseFloat(score);
      if (s >= 90) grade = table.over90;
      else if (s >= 80) grade = table.over80;
      else if (s >= 70) grade = table.over70;
      else if (s >= 60) grade = table.over60;
      else grade = table.under60;
      return { grade, seniorityLabel: label, months };
    }

    function calculateScore(dataObj, empName) {
      if (dataObj[empName] && dataObj[empName].precalculatedScore !== undefined) {
        return dataObj[empName].precalculatedScore;
      }
      const stationId = dataObj[empName].station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      let total = 0;
      station.criteria.forEach(c => {
        const d = dataObj[empName][stationId];
        if (d && d[c.id]) total += (d[c.id].score * 10) * c.weight;
      });
      return total.toFixed(1);
    }

    // =============================================
    // UI 渲染功能
    // =============================================
    function renderStationSelector() {
      document.getElementById('station-selector').innerHTML = STATIONS.map(st => `
        <button class="station-btn ${currentEvalData[currentSelectedEmp]?.station === st.id ? 'active' : ''}"
          onclick="selectStation('${st.id}')" id="station-btn-${st.id}">
          <div class="icon-wrapper">
            <i data-lucide="${st.icon}" class="w-4 h-4 ${st.color}"></i>
          </div>
          <span>${st.name}</span>
        </button>
      `).join('');
      lucide.createIcons();
    }

    function selectStation(stationId) {
      currentEvalData[currentSelectedEmp].station = stationId;
      currentStation = stationId;
      STATIONS.forEach(st => {
        const btn = document.getElementById(`station-btn-${st.id}`);
        if (btn) btn.className = `station-btn ${stationId === st.id ? 'active' : ''}`;
      });
      renderEvaluationForm();
      updateTotalAndSuggestion();
    }

    function renderEmployeeList() {
      document.getElementById('employee-list').innerHTML = EMPLOYEES.map(emp => {
        const grade = currentEvalData[emp.name]?.grade;
        const gc = grade ? GRADE_COLORS[grade] : null;
        const isCompleted = !!grade;
        
        let btnClass = "snap-start flex-shrink-0 flex items-center justify-between p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border ";
        let iconBgClass = "w-8 h-8 rounded-full flex items-center justify-center transition-colors ";
        
        if (emp.name === currentSelectedEmp) {
          btnClass += "bg-stone-800 text-white border-stone-800 shadow-lg shadow-stone-800/20";
          iconBgClass += "emp-icon-bg bg-stone-700";
        } else if (isCompleted) {
          btnClass += "bg-emerald-50/70 text-emerald-800 border-emerald-100 hover:bg-emerald-50 hover:shadow-sm";
          iconBgClass += "emp-icon-bg bg-emerald-100/60";
        } else {
          btnClass += "bg-white/70 text-stone-600 border-white hover:bg-white hover:shadow-sm";
          iconBgClass += "emp-icon-bg bg-stone-100";
        }

        return `
        <button id="btn-emp-${emp.name}" onclick="selectEmployee('${emp.name}')" class="${btnClass}">
          <div class="flex items-center space-x-2 md:space-x-3">
            <div class="${iconBgClass}">
              <i data-lucide="${isCompleted && emp.name !== currentSelectedEmp ? 'check' : 'user'}" class="w-4 h-4"></i>
            </div>
            <span class="font-medium tracking-wide text-sm md:text-base whitespace-nowrap">${emp.name}</span>
          </div>
          <span id="grade-badge-${emp.name}" class="grade-badge ${grade ? 'grade-' + grade : 'hidden'} ml-2" ${grade ? `style="background:${gc.bg};color:${gc.text};"` : ''}>
            ${grade || ''}
          </span>
        </button>
      `}).join('');
      lucide.createIcons();
    }

    function selectEmployee(empName) {
      currentSelectedEmp = empName;
      currentStation = currentEvalData[empName].station || STATIONS[0].id;
      document.getElementById('current-emp-name').innerText = empName;
      renderEmployeeList();
      renderStationSelector();
      renderEvaluationForm();
      updateTotalAndSuggestion();
    }

    function renderEvaluationForm() {
      const stationId = currentEvalData[currentSelectedEmp].station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      const empData = currentEvalData[currentSelectedEmp][stationId];

      document.getElementById('criteria-form').innerHTML = station.criteria.map(c => {
        const d = empData[c.id] || { score: 5, note: '' };
        return `
          <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 lg:gap-6 p-5 md:p-6 rounded-2xl bg-stone-50/50 border border-stone-100/50 hover:bg-white transition-colors">
            <div class="lg:w-1/3">
              <div class="flex items-center space-x-2 mb-1">
                <h3 class="text-base md:text-lg font-medium text-stone-800">${c.name}</h3>
                <span class="px-2 py-0.5 rounded-full bg-stone-200/50 text-stone-600 text-[10px] font-medium">${Math.round(c.weight * 100)}%</span>
              </div>
              <p class="text-xs md:text-sm text-stone-500">${c.desc}</p>
            </div>
            <div class="lg:w-2/3 space-y-4 mt-2 lg:mt-0">
              <div class="flex items-center space-x-3 md:space-x-4">
                <button onclick="adjustScore('${stationId}', '${c.id}', -1)" class="w-8 h-8 rounded-full bg-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-300 active:scale-95 transition-all">-</button>
                
                <input type="range" min="1" max="10" value="${d.score}" id="slider-${c.id}"
                  oninput="updateScore('${stationId}', '${c.id}', this.value)"
                  class="flex-1 h-2 bg-stone-200 rounded-lg cursor-pointer" />
                  
                <button onclick="adjustScore('${stationId}', '${c.id}', 1)" class="w-8 h-8 rounded-full bg-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-300 active:scale-95 transition-all">+</button>
                
                <div id="score-display-${c.id}" class="w-10 h-10 ml-2 flex-shrink-0 flex items-center justify-center bg-stone-800 text-white rounded-xl shadow-sm text-lg">${d.score}</div>
              </div>
              <div class="relative">
                <i data-lucide="message-square" class="absolute top-2.5 left-3 w-4 h-4 text-stone-400"></i>
                <input type="text" placeholder="新增備註 (選填)..." value="${d.note}"
                  onchange="updateNote('${stationId}', '${c.id}', this.value)"
                  class="w-full pl-9 pr-4 py-2 bg-white border border-stone-200 rounded-xl text-xs md:text-sm focus:ring-2 focus:ring-stone-400/20 focus:outline-none" />
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function adjustScore(stationId, cId, delta) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      let currentScore = currentEvalData[currentSelectedEmp][stationId][cId].score;
      let newScore = Math.min(10, Math.max(1, currentScore + delta));
      currentEvalData[currentSelectedEmp][stationId][cId].score = newScore;
      document.getElementById(`slider-${cId}`).value = newScore;
      document.getElementById(`score-display-${cId}`).innerText = newScore;
      updateTotalAndSuggestion();
    }

    function updateScore(stationId, cId, val) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      currentEvalData[currentSelectedEmp][stationId][cId].score = parseInt(val, 10);
      document.getElementById(`score-display-${cId}`).innerText = val;
      updateTotalAndSuggestion();
    }
    
    function updateNote(stationId, cId, val) {
      if (currentEvalData[currentSelectedEmp][stationId]) {
        currentEvalData[currentSelectedEmp][stationId][cId].note = val;
      }
    }

    function updateTotalAndSuggestion() {
      const score = calculateScore(currentEvalData, currentSelectedEmp);
      document.getElementById('current-total-score').innerText = score;

      const suggestion = getSuggestedGrade(currentSelectedEmp, score);
      const el = document.getElementById('seniority-suggestion');
      
      let html = `
        <div class="flex flex-col gap-2 mt-3 p-4 rounded-2xl bg-stone-50 border border-stone-100">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-semibold text-stone-500 uppercase tracking-widest">評定今日等級</span>
            ${suggestion ? `<span class="text-[10px] bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full">系統依照年資建議: ${suggestion.grade}</span>` : ''}
          </div>
          <div class="flex gap-2 sm:gap-3 flex-wrap">
      `;
      
      ['O', 'A', 'B', 'C', 'D'].forEach(g => {
        const gc = GRADE_COLORS[g];
        const isSelected = currentEvalData[currentSelectedEmp]?.grade === g;
        
        html += `
          <button onclick="applyGrade('${g}')" 
            class="flex-1 min-w-[40px] h-10 sm:h-12 rounded-xl font-bold transition-all border-2 flex items-center justify-center text-sm sm:text-base
            ${isSelected ? 'ring-2 ring-offset-2 ring-stone-400 scale-105 shadow-sm' : 'hover:scale-105 opacity-60 hover:opacity-100'}"
            style="background:${gc.bg}; color:${gc.text}; border-color:${isSelected ? gc.text : gc.border};">
            ${g}
          </button>
        `;
      });
      
      html += `</div></div>`;
      el.innerHTML = html;
    }

    function applyGrade(grade) {
      currentEvalData[currentSelectedEmp].grade = grade;
      renderEmployeeList();
      updateTotalAndSuggestion();
      showToast(`已成功評定 ${currentSelectedEmp} 今日等級為 ${grade}`);
    }

    // =============================================
    // 儲存功能
    // =============================================
    async function saveData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
      storage.current = currentEvalData;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
      
      let records = [];
      EMPLOYEES.forEach(emp => {
        const grade = currentEvalData[emp.name]?.grade;
        if (grade) {
          const stationId = currentEvalData[emp.name]?.station || STATIONS[0].id;
          const stationName = STATIONS.find(s => s.id === stationId)?.name || stationId;
          const score = calculateScore(currentEvalData, emp.name);
          const details = currentEvalData[emp.name][stationId] || {};
          
          records.push({
            name: emp.name,
            station: stationName,
            score: score,
            grade: grade,
            details: details
          });
        }
      });

      if (records.length === 0) {
        showToast('尚未替任何員工設定等級，無資料可儲存');
        return;
      }

      const payload = { type: 'evaluation', date: todayString, records: records };

      try {
        showToast('正在同步至 Google 試算表...');
        const response = await fetch(GAS_API_URL, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        if (result.status === 'success') showToast('今日評分已成功儲存並同步至雲端');
        else showToast('雲端同步失敗，但已存在本機');
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
      }
    }

    async function saveCleaningData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
      storage.currentCleaning = cleaningData;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
      
      let records = [];
      EMPLOYEES.forEach(emp => {
        if (cleaningData[emp.name]?.selected) {
          records.push({
            name: emp.name,
            stars: cleaningData[emp.name].stars || 0
          });
        }
      });

      if (records.length === 0) {
        showToast('本機儲存成功 (無人參與清潔)');
        return;
      }

      const payload = { type: 'cleaning', date: todayString, records: records };

      try {
        showToast('正在同步至 Google 試算表...');
        const response = await fetch(GAS_API_URL, { 
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload) 
        });
        
        const result = await response.json();
        if (result.status === 'success') showToast('清潔評分已成功儲存並同步至雲端');
        else showToast('雲端同步失敗，但已存在本機');
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
      }
    }

    function renderCleaningModule() {
      const sel = document.getElementById('cleaning-emp-selector');
      sel.innerHTML = EMPLOYEES.map(emp => {
        const isSelected = cleaningData[emp.name]?.selected;
        return `
          <button id="clean-sel-${emp.name}" onclick="toggleCleaningEmp('${emp.name}')"
            class="px-3 py-1.5 rounded-full text-sm border transition-all ${isSelected
              ? 'bg-stone-800 text-white border-stone-800'
              : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">
            ${emp.name}
          </button>
        `;
      }).join('');
      renderCleaningSelectedList();
    }

    function toggleCleaningEmp(empName) {
      cleaningData[empName].selected = !cleaningData[empName].selected;
      if (!cleaningData[empName].selected) cleaningData[empName].stars = 0;
      renderCleaningModule();
    }

    function renderCleaningSelectedList() {
      const selectedEmps = EMPLOYEES.filter(e => cleaningData[e.name]?.selected);
      const container = document.getElementById('cleaning-selected-list');
      if (selectedEmps.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-400 text-sm py-8">請從上方選擇今日例行清潔人員</p>`;
        return;
      }
      container.innerHTML = selectedEmps.map(emp => {
        const stars = cleaningData[emp.name].stars || 0;
        return `
          <div class="flex items-center justify-between p-4 rounded-2xl bg-stone-50/50 border border-stone-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-stone-200 flex items-center justify-center text-stone-700 font-medium text-sm">
                ${emp.name.charAt(0)}
              </div>
              <span class="font-medium text-stone-800">${emp.name}</span>
            </div>
            <div class="star-rating" id="stars-${emp.name}">
              ${[1,2,3,4,5].map(n => `
                <button class="star-btn ${n <= stars ? 'active' : ''}"
                  onclick="setStars('${emp.name}', ${n})"
                  title="${n}星"><i data-lucide="star" class="w-6 h-6 ${n <= stars ? 'fill-current' : ''}"></i></button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function setStars(empName, n) {
      cleaningData[empName].stars = n;
      const container = document.getElementById(`stars-${empName}`);
      if (container) {
        container.querySelectorAll('.star-btn').forEach((btn, i) => {
          btn.classList.toggle('active', i < n);
          const icon = btn.querySelector('svg');
          if (icon) {
            if (i < n) icon.classList.add('fill-current');
            else icon.classList.remove('fill-current');
          }
        });
      }
    }

    function toggleGlobalMenu() {
      document.getElementById('global-nav-menu').classList.toggle('hidden');
    }

    function switchTab(tab) {
      ['evaluate', 'cleaning'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        const tabBtn = document.getElementById(`tab-${t}`);
        if(tabBtn) tabBtn.className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700";
      });
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      const activeTabBtn = document.getElementById(`tab-${tab}`);
      if(activeTabBtn) activeTabBtn.className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all bg-white text-stone-800 shadow-sm";
      if (tab === 'cleaning') renderCleaningModule();
    }

    function showToast(msg) {
      document.getElementById('toast-msg').innerText = msg;
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none'), 3000);
    }

    window.onload = async () => {
    await initLiff();
    
    // 先向後端要金鑰並初始化 Supabase
    const isSupabaseReady = await initSupabase();
    
    // 確定初始化成功後，才啟動主程式碼去抓班表
    if (isSupabaseReady) {
      initApp();
    } else {
      document.getElementById('evaluate-content').innerHTML = '<div class="h-64 flex items-center justify-center text-stone-400">系統初始化失敗，請確認後端連線</div>';
    }
  };
  </script>
</body>
</html>
