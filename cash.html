    <style>
        /* 自訂卷軸，避免手機版表格太擠 */
        .table-container { overflow-x: auto; }
        table { min-width: 700px; }

        @media print {
            /* 設定紙張為直向 (Portrait)，保留適當邊距 */
            @page { size: portrait; margin: 10mm; }
            
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 0; border: none !important; }
            
            /* 解除列印時的寬度限制與捲軸，解決表格被壓縮的問題 */
            .table-container { overflow-x: visible !important; }
            table { min-width: 100% !important; width: 100% !important; border-collapse: collapse !important; }
            
            /* 【字體放大】微調列印時的字體與間距 */
            td, th { border: 1px solid #d1d5db !important; padding: 8px 4px !important; font-size: 13px !important; }
            input { border: none !important; background: transparent !important; width: 100% !important; text-align: center !important; font-size: 14px !important; font-weight: bold !important; }
            
            .date-line { border-bottom: 1px solid black !important; }
            textarea::placeholder { color: transparent !important; }
            
            /* 列印顏色保留 */
            .print-bg-dark { background-color: #1e293b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-gray { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-yellow { background-color: #fefce8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            
            .print-text-large { font-size: 16px !important; }
            .print-text-xl { font-size: 20px !important; }
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

            </div>

            <div class="border border-gray-300 rounded-xl p-5 flex flex-col items-center justify-end bg-white h-full shadow-sm">
                <div class="w-full max-w-[320px] h-24 md:h-32 border-b-2 border-gray-800 mb-4 bg-white"></div>
                <p class="text-lg md:text-xl font-bold text-gray-700 tracking-wide print-text-large">主管/核實人簽名</p>
                <div class="text-sm text-gray-400 italic mt-1">(Signature of Manager)</div>
            </div>
            
        </div>

        <div class="mt-10 flex flex-wrap justify-center gap-3 md:gap-4 no-print relative">
            <button onclick="window.print()" class="w-36 md:w-44 flex justify-center items-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-4 rounded-lg shadow transition duration-200 text-base md:text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                列印紙本
            </button>
            <button id="btnSubmitData" onclick="submitToCloud()" class="w-36 md:w-44 flex justify-center items-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 md:py-4 rounded-lg shadow transition duration-200 text-base md:text-lg">
                上傳數據
            </button>
            <button onclick="resetForm()" class="w-36 md:w-44 flex justify-center items-center bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-3 md:py-4 rounded-lg transition duration-200 text-base md:text-lg shadow-sm">
                清除內容
            </button>
        </div>

        <div id="loadingOverlay" class="fixed inset-0 z-[2000] hidden bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-emerald-500 mb-4"></div>
            <p class="text-white font-bold tracking-widest text-lg">資料上傳中，請稍候...</p>
        </div>

        <div class="text-xs text-gray-400 mt-8 text-center uppercase tracking-widest no-print">
            End of Inventory Report
        </div>
    </div>

    <script>
        // 設定面額與邏輯
        const denominations = [1000, 500, 100, 50, 10, 5];
        const inputs = document.querySelectorAll('.qty-input');

        inputs.forEach(input => {
            input.addEventListener('input', calculate);
        });

        // 7天盤點計算邏輯
        function calculate() {
            let grandTotal = 0;
            let dayTotals = [0, 0, 0, 0, 0, 0, 0];

            denominations.forEach(val => {
                let weekQty = 0;
                const row = document.querySelector(`.cash-row[data-val="${val}"]`);
                if(!row) return;

                // 統計星期一到星期日的數值
                for(let day = 1; day <= 7; day++) {
                    const input = row.querySelector(`.qty-input.day-${day}`);
                    const qty = parseInt(input.value) || 0;
                    weekQty += qty;
                    dayTotals[day-1] += (qty * val);
                }

                const weekSubtotal = weekQty * val;
                grandTotal += weekSubtotal;

                // 更新畫面中的當列「週小計」，若為 0 則顯示空白
                row.querySelector('.week-subtotal-cell').textContent = weekSubtotal > 0 ? weekSubtotal.toLocaleString('zh-TW') : '';
            });

            // 更新「每日金庫剩餘」列，若為 0 則顯示空白
            for(let day = 1; day <= 7; day++) {
                const dtCell = document.querySelector(`.day-total.day-${day}`);
                if(dtCell) {
                    dtCell.textContent = dayTotals[day-1] > 0 ? dayTotals[day-1].toLocaleString('zh-TW') : '';
                }
            }

            // 更新總計，若為 0 則顯示空白
            document.getElementById('grandTotal').textContent = grandTotal > 0 ? 'NT$ ' + grandTotal.toLocaleString('zh-TW') : '';
        }

        // 格式清除功能
        function resetForm() {
            if(confirm('確定要清空所有數量與備註嗎？')) {
                inputs.forEach(input => input.value = '');
                document.getElementById('reportDate').value = '';
                document.getElementById('remarksInput').value = '';
                calculate();
            }
        }

        // 導航列控制
        function toggleGlobalMenu() {
            document.getElementById('global-nav-menu').classList.toggle('hidden');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('global-nav-menu');
            const btn = document.getElementById('global-nav-btn');
            if (menu && btn && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // ==============================================
        // 後端 Apps Script 上傳邏輯 (背景自動計算總數量)
        // ==============================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvxtZPmYJD5EmPxAGQnfRmoZrODO3tx_26OWFY20_3ASmUb2ejmkudcPvB-G65cA5VAA/exec";

        async function submitToCloud() {
            const dateVal = document.getElementById('reportDate').value.trim();
            if (!dateVal) {
                alert("請先填寫「結算週別」喔！");
                document.getElementById('reportDate').focus();
                return;
            }

            // 自己計算出當週各面額的總數量 (傳給後端雲端用)
            const getWeekQty = (val) => {
                let qty = 0;
                const row = document.querySelector(`.cash-row[data-val="${val}"]`);
                if(row) {
                    for(let day = 1; day <= 7; day++) {
                        const input = row.querySelector(`.qty-input.day-${day}`);
                        qty += parseInt(input.value) || 0;
                    }
                }
                return qty.toString();
            };
            
            const totalText = document.getElementById('grandTotal').innerText;
            const totalVal = totalText.replace(/[^\d]/g, '') || "0"; 

            // 傳送數據與備註給 Google Sheets
            const payload = {
                date: dateVal,
                cash1000: getWeekQty(1000),
                cash500: getWeekQty(500),
                cash100: getWeekQty(100),
                coin50: getWeekQty(50),
                coin10: getWeekQty(10),
                coin5: getWeekQty(5),
                total: totalVal, 
                remarks: document.getElementById('remarksInput').value
            };

            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✅ 盤點數據已成功上傳至雲端！");
                    resetForm();
                } else {
                    alert("❌ 上傳失敗：" + result.message);
                }
            } catch (error) {
                alert("❌ 網路連線錯誤，請檢查網路狀態或網址設定。");
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
