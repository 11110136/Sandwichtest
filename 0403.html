<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北歐風排班表與分配表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        /* 北歐風專屬柔和色彩 */
        .bg-nordic-stone { background-color: #f5f5f4; }
        .bg-nordic-sage { background-color: #f0fdf4; }
        .text-nordic-charcoal { color: #475569; }
        .text-nordic-taupe { color: #8a7e71; }
        .text-nordic-sage { color: #4b8b6b; }

        /* 柔和的文字顏色 */
        .text-soft-purple { color: #8b5cf6; }
        .text-soft-blue { color: #0ea5e9; }
        .text-soft-red { color: #f43f5e; }

        /* 表格共用設定 */
        .cal-grid-base {
            display: grid;
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .cal-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 6.5rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.025em;
        }
        .cal-date {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 400;
        }

        /* 編輯區域特效 */
        .editable {
            outline: none;
            border-radius: 6px;
            padding: 4px 6px;
            min-width: 2rem;
            min-height: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        @media screen {
            .editable:hover {
                background-color: #f1f5f9;
                cursor: text;
            }
            .editable:focus {
                background-color: #ffffff;
                border-color: #cbd5e1;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ======== 完美列印專用設定 ======== */
        @media print {
            /* 已移除強制邊界設定，讓使用者自行控制 */
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print { display: none !important; }
            
            .page-break { 
                page-break-before: always !important; 
                break-before: page !important;
            }

            .shadow-sm, .shadow-2xl, .shadow-\[0_8px_30px_rgb\(0\,0\,0\,0\.04\)\] { 
                box-shadow: none !important; 
            }
            .container { 
                max-width: 100% !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                border: none !important; 
            }
            
            .cal-cell { min-height: 5.8rem; }
            table.duty-table { 
                border-collapse: collapse !important; 
                border-spacing: 0; 
                width: 100% !important;
                min-width: 0 !important;
            }
            table.duty-table th, table.duty-table td { border: 1px solid #cbd5e1 !important; }
            .cal-grid-base { background-color: #cbd5e1; border: 1px solid #cbd5e1; border-radius: 0; }
            .editable { padding: 0 !important; box-shadow: none !important; background-color: transparent !important; border: none !important; }
            
            .rounded-2xl { border-radius: 0 !important; }
            .rounded-xl { border-radius: 0 !important; }
        }

        .duty-table td { padding: 0.6rem 0.3rem; vertical-align: middle; }
        .duty-table tr:hover { background-color: #f8fafc; }
        .duty-table td.border-r { border-right: 1px solid #e2e8f0; }
    </style>
</head>
<body class="p-4 md:p-8 print:p-0">

    <div class="w-[98%] max-w-[1600px] mx-auto mb-8 no-print">
        <div class="bg-white/60 backdrop-blur-md border border-slate-200 p-5 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-slate-100 p-2 rounded-full">✨</div>
                <div>
                    <h3 class="font-semibold text-slate-700 text-lg">極簡編輯模式</h3>
                    <p class="text-slate-500 text-sm">請選擇月份，表格會自動產生。點擊儲存格即可優雅編輯。</p>
                </div>
            </div>
            <div class="flex gap-3 items-center flex-wrap">
                <input type="month" id="monthPicker" class="border border-slate-200 rounded-xl px-4 py-2.5 text-slate-600 font-medium bg-white shadow-sm outline-none focus:border-slate-400 transition" onchange="renderCalendar()">
                
                <button onclick="clearData()" class="bg-white hover:bg-slate-50 text-slate-600 font-medium py-2.5 px-5 rounded-xl border border-slate-200 shadow-sm transition duration-300 text-sm">
                    清除資料
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-6 rounded-xl shadow-md hover:shadow-lg transition duration-300 text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    列印排班表
                </button>
            </div>
        </div>
    </div>

    <div class="container w-[98%] max-w-[1600px] mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-16 print:mb-0 print:shadow-none print:w-full print:max-w-none print:p-0 border border-slate-100">
        
        <div class="flex flex-col md:flex-row gap-6 md:gap-8 mb-6 print:flex-row print:mb-6">
            <div class="w-full md:w-5/12 print:w-5/12 flex items-baseline gap-6">
                <h1 class="text-3xl md:text-4xl text-nordic-taupe font-light tracking-widest" id="title-clean-month">
                    </h1>
                <span class="text-2xl text-slate-700 font-medium tracking-widest">清潔</span>
            </div>
            <div class="w-full md:w-7/12 print:w-7/12 flex items-baseline gap-6 border-t md:border-t-0 pt-4 md:pt-0 border-slate-100 print:border-0 print:pt-0">
                <h1 class="text-3xl md:text-4xl text-nordic-sage font-light tracking-widest" id="title-wash-month">
                    </h1>
                <span class="text-2xl text-slate-700 font-medium tracking-widest">洗餐具</span>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 md:gap-6 print:flex-row">
            <div class="w-full md:w-5/12 print:w-5/12">
                <div class="cal-grid-base grid-cols-5" id="cleaning-grid">
                    </div>
            </div>

            <div class="w-full md:w-7/12 print:w-7/12 h-full">
                <div class="cal-grid-base grid-cols-7 h-full" id="wash-grid">
                    </div>
            </div>
        </div>
    </div>

    <div class="page-break container w-[98%] max-w-[1600px] mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] print:shadow-none print:p-0 print:w-full print:max-w-none border border-slate-100 print:border-0 print:mt-10">
        
        <div class="mb-6 flex justify-between items-end border-b border-slate-100 print:border-b-2 print:border-slate-300 pb-4">
            <h1 class="text-3xl text-slate-700 tracking-wider font-light">
                <span id="title-duty-month" class="font-medium"></span> 值班表
            </h1>
        </div>

        <div class="flex flex-col lg:flex-row gap-8 items-start print:flex-row print:gap-6">
            <div class="w-full lg:w-[calc(100%-6rem)] print:w-[calc(100%-6rem)] overflow-hidden rounded-xl border border-slate-200 print:border-0">
                <table class="duty-table w-full text-center text-[15px] text-slate-600">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-sm tracking-widest font-medium uppercase border-b border-slate-200 print:bg-slate-100">
                            <th class="py-3 px-2 w-[5%] font-medium">Date</th>
                            <th class="py-3 px-2 w-[5%] font-medium">Day</th>
                            <th class="py-3 px-2 w-[7%] font-medium text-slate-700">Open</th>
                            <th class="py-3 px-2 w-[21%] font-medium">Staff</th>
                            <th class="py-3 px-2 w-[6%] font-medium">20:00</th>
                            <th class="py-3 px-2 w-[6%] font-medium border-r border-slate-200">Close</th>
                            
                            <th class="py-3 px-2 w-[5%] font-medium">Date</th>
                            <th class="py-3 px-2 w-[5%] font-medium">Day</th>
                            <th class="py-3 px-2 w-[7%] font-medium text-slate-700">Open</th>
                            <th class="py-3 px-2 w-[21%] font-medium">Staff</th>
                            <th class="py-3 px-2 w-[6%] font-medium">20:00</th>
                            <th class="py-3 px-2 w-[6%] font-medium">Close</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100" id="duty-tbody">
                        </tbody>
                </table>
            </div>

            <div class="w-full lg:w-24 print:w-24 flex-shrink-0 bg-slate-50 p-4 rounded-xl border border-slate-200 print:border-0 shadow-sm flex flex-col items-center">
                <div class="text-slate-400 text-xs tracking-widest font-medium uppercase mb-4 w-full text-center border-b border-slate-200 pb-2">Order<br>開店順序</div>
                <div class="flex flex-col gap-3 w-full">
                    <div class="text-center font-medium text-slate-700 editable" contenteditable="true" id="duty-order-1" oninput="saveData('duty-order-1', this.innerHTML)"></div>
                    <div class="text-center font-medium text-slate-700 editable" contenteditable="true" id="duty-order-2" oninput="saveData('duty-order-2', this.innerHTML)"></div>
                    <div class="text-center font-medium text-slate-700 editable" contenteditable="true" id="duty-order-3" oninput="saveData('duty-order-3', this.innerHTML)"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 初始化月份為當月
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthPicker').value = `${y}-${m}`;
            
            // 載入側邊欄靜態項目
            ['duty-order-1', 'duty-order-2', 'duty-order-3'].forEach(id => {
                const saved = localStorage.getItem(id);
                if(saved) document.getElementById(id).innerHTML = saved;
            });

            renderCalendar();
        });

        function saveData(key, value) {
            localStorage.setItem(key, value);
        }

        function renderCalendar() {
            const picker = document.getElementById('monthPicker');
            const [yearStr, monthStr] = picker.value.split('-');
            const year = parseInt(yearStr);
            const month = parseInt(monthStr); // 1-12

            // 標題更新
            const titleStr = `${year} 年 ${month} 月`;
            document.getElementById('title-clean-month').innerText = titleStr;
            document.getElementById('title-wash-month').innerText = titleStr;
            document.getElementById('title-duty-month').innerText = titleStr;

            const daysInMonth = new Date(year, month, 0).getDate();
            const firstDayOfWeek = new Date(year, month - 1, 1).getDay(); // 0(Sun) ~ 6(Sat)

            // ==================== 1. 清潔表 (Mon - Fri) ====================
            const cleaningGrid = document.getElementById('cleaning-grid');
            let cleanHtml = `
                <div class="bg-white text-center py-3 text-nordic-taupe text-sm tracking-widest font-medium uppercase">Mon</div>
                <div class="bg-white text-center py-3 text-nordic-taupe text-sm tracking-widest font-medium uppercase">Tue</div>
                <div class="bg-white text-center py-3 text-nordic-taupe text-sm tracking-widest font-medium uppercase">Wed</div>
                <div class="bg-white text-center py-3 text-nordic-taupe text-sm tracking-widest font-medium uppercase">Thu</div>
                <div class="bg-white text-center py-3 text-nordic-taupe text-sm tracking-widest font-medium uppercase">Fri</div>
            `;
            
            let cleanCellCount = 0;
            // 計算開頭需要幾個空白格 (週一到週五)
            let blanks = 0;
            if (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) {
                blanks = firstDayOfWeek - 1; 
            }
            
            for(let i=0; i<blanks; i++) {
                cleanHtml += `<div class="cal-cell bg-white/40"></div>`;
                cleanCellCount++;
            }

            for(let d=1; d<=daysInMonth; d++) {
                let currentDay = new Date(year, month-1, d).getDay();
                if(currentDay >= 1 && currentDay <= 5) { // 只算平日
                    let rowNum = Math.floor(cleanCellCount / 5) + 1;
                    let bgClass = (rowNum % 2 === 0) ? 'bg-nordic-stone' : 'bg-white';
                    let id = `clean-${year}-${month}-${d}`;
                    let saved = localStorage.getItem(id) || '';
                    
                    cleanHtml += `<div class="cal-cell ${bgClass} leading-relaxed"><span class="cal-date">${d}</span><div contenteditable="true" class="editable w-full" id="${id}" oninput="saveData('${id}', this.innerHTML)">${saved}</div></div>`;
                    cleanCellCount++;
                }
            }
            
            // 補齊最後一列空白格
            let cleanRemainder = cleanCellCount % 5;
            if (cleanRemainder !== 0) {
                let fill = 5 - cleanRemainder;
                let rowNum = Math.floor(cleanCellCount / 5) + 1;
                let bgClass = (rowNum % 2 === 0) ? 'bg-nordic-stone' : 'bg-white';
                for(let i=0; i<fill; i++) {
                    cleanHtml += `<div class="cal-cell ${bgClass} opacity-40"></div>`;
                }
            }

            let notesId = `notes-clean-${year}-${month}`;
            let notesVal = localStorage.getItem(notesId) || '';
            cleanHtml += `
                <div class="col-span-5 bg-white p-4 flex gap-6 items-start text-left">
                    <div class="flex-grow flex flex-col">
                        <span class="text-nordic-taupe font-medium text-sm tracking-widest mb-1">NOTES 記事</span>
                        <div contenteditable="true" class="editable w-full text-slate-600 min-h-[3rem]" id="${notesId}" oninput="saveData('${notesId}', this.innerHTML)">${notesVal}</div>
                    </div>
                </div>
            `;
            cleaningGrid.innerHTML = cleanHtml;

            // ==================== 2. 洗餐具表 (Sun - Sat) ====================
            const washGrid = document.getElementById('wash-grid');
            let washHtml = `
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Sun</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Mon</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Tue</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Wed</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Thu</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Fri</div>
                <div class="bg-white text-center py-3 text-nordic-sage text-sm tracking-widest font-medium uppercase">Sat</div>
            `;

            let washCellCount = 0;
            for(let i=0; i<firstDayOfWeek; i++) {
                washHtml += `<div class="cal-cell bg-white/40"></div>`;
                washCellCount++;
            }

            for(let d=1; d<=daysInMonth; d++) {
                let rowNum = Math.floor(washCellCount / 7) + 1;
                let bgClass = (rowNum % 2 === 0) ? 'bg-nordic-sage' : 'bg-white';
                let id = `wash-${year}-${month}-${d}`;
                let saved = localStorage.getItem(id) || '';

                washHtml += `<div class="cal-cell ${bgClass}"><span class="cal-date">${d}</span><div contenteditable="true" class="editable w-full text-lg" id="${id}" oninput="saveData('${id}', this.innerHTML)">${saved}</div></div>`;
                washCellCount++;
            }

            let washRemainder = washCellCount % 7;
            if (washRemainder !== 0) {
                let fill = 7 - washRemainder;
                let rowNum = Math.floor(washCellCount / 7) + 1;
                let bgClass = (rowNum % 2 === 0) ? 'bg-nordic-sage' : 'bg-white';
                for(let i=0; i<fill; i++) {
                    washHtml += `<div class="cal-cell ${bgClass} opacity-40"></div>`;
                }
            }

            // 對齊左側高度用的裝飾留白
            washHtml += `<div class="col-span-7 bg-white h-[4.5rem]"></div>`;
            washGrid.innerHTML = washHtml;

            // ==================== 3. 值班表 (雙欄顯示) ====================
            const dutyTbody = document.getElementById('duty-tbody');
            let tbodyHtml = '';
            let half = Math.ceil(daysInMonth / 2);
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            for(let i=1; i<=half; i++) {
                let d1 = i;
                let d2 = i + half;

                let date1 = new Date(year, month-1, d1);
                let day1 = dayNames[date1.getDay()];

                tbodyHtml += `<tr>`;
                // 左側
                tbodyHtml += buildDutyCells(year, month, d1, day1, false);
                
                // 右側
                if(d2 <= daysInMonth) {
                    let date2 = new Date(year, month-1, d2);
                    let day2 = dayNames[date2.getDay()];
                    tbodyHtml += buildDutyCells(year, month, d2, day2, true);
                } else {
                    tbodyHtml += `<td colspan="6"></td>`; // 右側沒有日期時顯示空白
                }
                tbodyHtml += `</tr>`;
            }
            dutyTbody.innerHTML = tbodyHtml;
        }

        // 產生值班表的單側儲存格
        function buildDutyCells(year, month, d, dayName, isRight) {
            let idOpen = `duty-open-${year}-${month}-${d}`;
            let idStaff = `duty-staff-${year}-${month}-${d}`;
            let id20 = `duty-20-${year}-${month}-${d}`;
            let idClose = `duty-close-${year}-${month}-${d}`;
            
            let valOpen = localStorage.getItem(idOpen) || '';
            let valStaff = localStorage.getItem(idStaff) || '';
            let val20 = localStorage.getItem(id20) || '';
            let valClose = localStorage.getItem(idClose) || '';
            
            let borderClass = isRight ? '' : 'border-r';
            
            return `
                <td><div class="text-slate-400">${d}.</div></td>
                <td><div class="text-slate-400">(${dayName})</div></td>
                <td><div contenteditable="true" class="editable w-full" id="${idOpen}" oninput="saveData('${idOpen}', this.innerHTML)">${valOpen}</div></td>
                <td><div contenteditable="true" class="editable w-full font-medium" id="${idStaff}" oninput="saveData('${idStaff}', this.innerHTML)">${valStaff}</div></td>
                <td class="text-soft-purple font-medium"><div contenteditable="true" class="editable w-full" id="${id20}" oninput="saveData('${id20}', this.innerHTML)">${val20}</div></td>
                <td class="text-soft-blue font-medium ${borderClass}"><div contenteditable="true" class="editable w-full" id="${idClose}" oninput="saveData('${idClose}', this.innerHTML)">${valClose}</div></td>
            `;
        }

        // 清除按鈕功能：只清除本系統儲存的資料
        function clearData() {
            if(confirm("確定要清除所有月份的排班資料嗎？\n(將會清空您輸入過的所有文字)")) {
                let keysToRemove = [];
                for(let i=0; i<localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if(key.startsWith('clean-') || key.startsWith('wash-') || key.startsWith('duty-') || key.startsWith('notes-')) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
                
                // 重新載入靜態項目
                ['duty-order-1', 'duty-order-2', 'duty-order-3'].forEach(id => {
                    document.getElementById(id).innerHTML = '';
                });

                renderCalendar(); // 重新渲染表格
            }
        }
    </script>
</body>
</html>
