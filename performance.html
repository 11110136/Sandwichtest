  <style>
    body {
      background-image: linear-gradient(to bottom right, rgba(250, 250, 249, 0.95), rgba(245, 245, 244, 0.85)), url('https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: #292524; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px; cursor: pointer; background: #e7e5e4; border-radius: 4px;
    }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 星星評分 */
    .star-rating { display: flex; gap: 6px; }
    .star-btn {
      font-size: 28px; cursor: pointer; color: #d6d3d1;
      transition: color 0.15s, transform 0.1s;
      background: none; border: none; padding: 0;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }

    /* 等級徽章 */
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      font-weight: 700; font-size: 14px; letter-spacing: 0.05em;
    }
    .grade-O { background: #fef9c3; color: #854d0e; }
    .grade-A { background: #dcfce7; color: #166534; }
    .grade-B { background: #dbeafe; color: #1e40af; }
    .grade-C { background: #f3e8ff; color: #6b21a8; }
    .grade-D { background: #fee2e2; color: #991b1b; }

    /* 崗位選擇按鈕 */
    .station-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 10px 8px; border-radius: 12px; border: 1.5px solid #e7e5e4;
      background: white; cursor: pointer; transition: all 0.2s; min-width: 70px;
      font-size: 12px; color: #78716c;
    }
    .station-btn:hover { border-color: #a8a29e; background: #fafaf9; }
    .station-btn.active {
      border-color: #292524; background: #292524; color: white;
    }
    .station-btn .station-icon { font-size: 18px; }

    /* 超額警告 */
    .quota-bar { height: 4px; border-radius: 2px; transition: width 0.3s; }
    .quota-ok { background: #86efac; }
    .quota-warn { background: #fb923c; }
    .quota-full { background: #f87171; }
  </style>
</head>

    // 初始化 LIFF 流程
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        console.log("LIFF 初始化成功");
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          console.log("LINE 登入成功:", profile.displayName);
          showToast(`歡迎回來，${profile.displayName} 👋`);
        } else {
          console.log("未登入 LINE，以一般網頁模式瀏覽");
        }
      } catch (error) {
        console.error("LIFF 初始化失敗:", error);

    // =============================================

    const GRADE_COLORS = {
      O: { bg: '#fef9c3', text: '#854d0e', border: '#fde68a' },
      A: { bg: '#dcfce7', text: '#166534', border: '#bbf7d0' },
      B: { bg: '#dbeafe', text: '#1e40af', border: '#bfdbfe' },
      C: { bg: '#f3e8ff', text: '#6b21a8', border: '#e9d5ff' },
      D: { bg: '#fee2e2', text: '#991b1b', border: '#fecaca' },
    };

    const GRADE_TABLE = {
      '到職1年以內': { over90: 'O', over80: 'O', over70: 'A', over60: 'B', under60: 'C' },
      '到職1~3年':  { over90: 'O', over80: 'A', over70: 'B', over60: 'C', under60: 'D' },
      '到職3~5年':  { over90: 'A', over80: 'B', over70: 'C', over60: 'D', under60: 'D' },
    };

    let currentEvalData = {};
    let historyData = {};
    let cleaningData = {}; 
    let currentSelectedEmp = EMPLOYEES[0].name;
    let currentStation = STATIONS[0].id;
    let todayString = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

    // =============================================
    // 年資計算
    // =============================================
    function getSeniorityMonths(joinDate) {
      const join = new Date(joinDate);
      const now = new Date();
      return (now.getFullYear() - join.getFullYear()) * 12 + (now.getMonth() - join.getMonth());
    }
    function getSeniorityLabel(months) {
      if (months <= 12) return '到職1年以內';
      if (months <= 36) return '到職1~3年';
      return '到職3~5年';
    }
    function getSuggestedGrade(empName, score) {
      const emp = EMPLOYEES.find(e => e.name === empName);
      if (!emp) return null;
      const months = getSeniorityMonths(emp.joinDate);
      const label = getSeniorityLabel(months);
      const table = GRADE_TABLE[label];
      let grade;
      const s = parseFloat(score);
      if (s >= 90) grade = table.over90;
      else if (s >= 80) grade = table.over80;
      else if (s >= 70) grade = table.over70;
      else if (s >= 60) grade = table.over60;
      else grade = table.under60;
      return { grade, seniorityLabel: label, months };
    }

    // =============================================
    // 初始化系統
    // =============================================
    async function initApp() {
      loadDataFromStorage();
      renderEmployeeList();
      selectEmployee(EMPLOYEES[0].name);
      renderStationSelector();
      renderCleaningModule();
      document.getElementById('dashboard-date').innerText = `(${todayString})`;
      lucide.createIcons();
      
      await fetchHistoryFromGAS();
    }

    function generateDefaultEval(defaultScore = 5) {
      let data = {};
      EMPLOYEES.forEach(emp => {
        data[emp.name] = { station: STATIONS[0].id, grade: '' }; // 空等級代表未評量
        STATIONS.forEach(st => {
          data[emp.name][st.id] = {};
          st.criteria.forEach(c => { data[emp.name][st.id][c.id] = { score: defaultScore, note: '' }; });
        });
      });
      return data;
    }

    function generateDefaultCleaning() {
      let d = {};
      EMPLOYEES.forEach(emp => { d[emp.name] = { selected: false, stars: 0 }; });
      return d;
    }

    function loadDataFromStorage() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2'));
      
      if (!storage) {
        storage = {
          lastDate: todayString,
          current: generateDefaultEval(5),
          currentCleaning: generateDefaultCleaning(),
          history: {},
          historyCleaning: {}
        };
      } else if (storage.lastDate !== todayString) {
        storage.history[storage.lastDate] = storage.current;
        storage.historyCleaning[storage.lastDate] = storage.currentCleaning;
        storage.current = generateDefaultEval(5);
        storage.currentCleaning = generateDefaultCleaning();
        storage.lastDate = todayString;
      }
      currentEvalData = storage.current;
      historyData = storage.history;
      cleaningData = storage.currentCleaning || generateDefaultCleaning();
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
    }

    async function fetchHistoryFromGAS() {
      try {
        const response = await fetch(GAS_API_URL + "?action=getHistory");
        if (!response.ok) return;
        const result = await response.json();
        
        if (result.status === 'success' && result.data) {
          let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
          
          if (result.data.history) {
              storage.history = { ...storage.history, ...result.data.history };
          }
          if (result.data.historyCleaning) {
              storage.historyCleaning = { ...storage.historyCleaning, ...result.data.historyCleaning };
          }
          
          localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
          historyData = storage.history;
          
          if (!document.getElementById('section-history').classList.contains('hidden')) {
              initHistoryTab();
          }
        }
      } catch (error) {
        console.warn("無法取得雲端歷史資料", error);
      }
    }

    // =============================================
    // 分數計算 (修正：優先讀取歷史紀錄的預算分數)
    // =============================================
    function calculateScore(dataObj, empName) {
      if (dataObj[empName] && dataObj[empName].precalculatedScore !== undefined) {
        return dataObj[empName].precalculatedScore;
      }
      
      const stationId = dataObj[empName].station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      let total = 0;
      station.criteria.forEach(c => {
        const d = dataObj[empName][stationId];
        if (d && d[c.id]) total += (d[c.id].score * 10) * c.weight;
      });
      return total.toFixed(1);
    }

    // =============================================
    // 崗位選擇
    // =============================================
    function renderStationSelector() {
      document.getElementById('station-selector').innerHTML = STATIONS.map(st => `
        <button class="station-btn ${currentEvalData[currentSelectedEmp]?.station === st.id ? 'active' : ''}"
          onclick="selectStation('${st.id}')" id="station-btn-${st.id}">
          <span class="station-icon">${st.icon}</span>
          <span>${st.name}</span>
        </button>
      `).join('');
    }

    function selectStation(stationId) {
      currentEvalData[currentSelectedEmp].station = stationId;
      currentStation = stationId;
      STATIONS.forEach(st => {
        const btn = document.getElementById(`station-btn-${st.id}`);
        if (btn) btn.className = `station-btn ${stationId === st.id ? 'active' : ''}`;
      });
      renderEvaluationForm();
      updateTotalAndSuggestion();
    }

    // =============================================
    // 員工列表 & 選擇 (加入完成狀態標示)
    // =============================================
    function renderEmployeeList() {
      document.getElementById('employee-list').innerHTML = EMPLOYEES.map(emp => {
        const grade = currentEvalData[emp.name]?.grade;
        const gc = grade ? GRADE_COLORS[grade] : null;
        const isCompleted = !!grade; // 有給等級代表完成評分
        
        let btnClass = "snap-start flex-shrink-0 flex items-center justify-between p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border ";
        let iconBgClass = "w-8 h-8 rounded-full flex items-center justify-center transition-colors ";
        
        if (emp.name === currentSelectedEmp) {
          btnClass += "bg-stone-800 text-white border-stone-800 shadow-lg shadow-stone-800/20";
          iconBgClass += "emp-icon-bg bg-stone-700";
        } else if (isCompleted) {
          btnClass += "bg-emerald-50/70 text-emerald-800 border-emerald-100 hover:bg-emerald-50 hover:shadow-sm";
          iconBgClass += "emp-icon-bg bg-emerald-100/60";
        } else {
          btnClass += "bg-white/70 text-stone-600 border-white hover:bg-white hover:shadow-sm";
          iconBgClass += "emp-icon-bg bg-stone-100";
        }

        return `
        <button id="btn-emp-${emp.name}" onclick="selectEmployee('${emp.name}')" class="${btnClass}">
          <div class="flex items-center space-x-2 md:space-x-3">
            <div class="${iconBgClass}">
              <i data-lucide="${isCompleted && emp.name !== currentSelectedEmp ? 'check' : 'user'}" class="w-4 h-4"></i>
            </div>
            <span class="font-medium tracking-wide text-sm md:text-base whitespace-nowrap">${emp.name}</span>
          </div>
          <span id="grade-badge-${emp.name}" class="grade-badge ${grade ? 'grade-' + grade : 'hidden'} ml-2" ${grade ? `style="background:${gc.bg};color:${gc.text};"` : ''}>
            ${grade || ''}
          </span>
        </button>
      `}).join('');
      lucide.createIcons();
    }

    function selectEmployee(empName) {
      currentSelectedEmp = empName;
      currentStation = currentEvalData[empName].station || STATIONS[0].id;
      document.getElementById('current-emp-name').innerText = empName;
      renderEmployeeList(); // 重新渲染列表以更新狀態顏色
      renderStationSelector();
      renderEvaluationForm();
      updateTotalAndSuggestion();
    }

    // =============================================
    // 評分表單 (+/- 按鈕微調優化)
    // =============================================
    function renderEvaluationForm() {
      const stationId = currentEvalData[currentSelectedEmp].station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      const empData = currentEvalData[currentSelectedEmp][stationId];

      document.getElementById('criteria-form').innerHTML = station.criteria.map(c => {
        const d = empData[c.id] || { score: 5, note: '' };
        return `
          <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 lg:gap-6 p-5 md:p-6 rounded-2xl bg-stone-50/50 border border-stone-100/50 hover:bg-white transition-colors">
            <div class="lg:w-1/3">
              <div class="flex items-center space-x-2 mb-1">
                <h3 class="text-base md:text-lg font-medium text-stone-800">${c.name}</h3>
                <span class="px-2 py-0.5 rounded-full bg-stone-200/50 text-stone-600 text-[10px] font-medium">${Math.round(c.weight * 100)}%</span>
              </div>
              <p class="text-xs md:text-sm text-stone-500">${c.desc}</p>
            </div>
            <div class="lg:w-2/3 space-y-4 mt-2 lg:mt-0">
              <div class="flex items-center space-x-3 md:space-x-4">
                <button onclick="adjustScore('${stationId}', '${c.id}', -1)" class="w-8 h-8 rounded-full bg-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-300 active:scale-95 transition-all">-</button>
                
                <input type="range" min="1" max="10" value="${d.score}" id="slider-${c.id}"
                  oninput="updateScore('${stationId}', '${c.id}', this.value)"
                  class="flex-1 h-2 bg-stone-200 rounded-lg cursor-pointer" />
                  
                <button onclick="adjustScore('${stationId}', '${c.id}', 1)" class="w-8 h-8 rounded-full bg-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-300 active:scale-95 transition-all">+</button>
                
                <div id="score-display-${c.id}" class="w-10 h-10 ml-2 flex-shrink-0 flex items-center justify-center bg-stone-800 text-white rounded-xl shadow-sm text-lg">${d.score}</div>
              </div>
              <div class="relative">
                <i data-lucide="message-square" class="absolute top-2.5 left-3 w-4 h-4 text-stone-400"></i>
                <input type="text" placeholder="新增備註 (選填)..." value="${d.note}"
                  onchange="updateNote('${stationId}', '${c.id}', this.value)"
                  class="w-full pl-9 pr-4 py-2 bg-white border border-stone-200 rounded-xl text-xs md:text-sm focus:ring-2 focus:ring-stone-400/20 focus:outline-none" />
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function adjustScore(stationId, cId, delta) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      let currentScore = currentEvalData[currentSelectedEmp][stationId][cId].score;
      let newScore = Math.min(10, Math.max(1, currentScore + delta));
      currentEvalData[currentSelectedEmp][stationId][cId].score = newScore;
      document.getElementById(`slider-${cId}`).value = newScore;
      document.getElementById(`score-display-${cId}`).innerText = newScore;
      updateTotalAndSuggestion();
    }

    function updateScore(stationId, cId, val) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      currentEvalData[currentSelectedEmp][stationId][cId].score = parseInt(val, 10);
      document.getElementById(`score-display-${cId}`).innerText = val;
      updateTotalAndSuggestion();
    }
    
    function updateNote(stationId, cId, val) {
      if (currentEvalData[currentSelectedEmp][stationId]) {
        currentEvalData[currentSelectedEmp][stationId][cId].note = val;
      }
    }

    // =============================================
    // 總分與直覺手動等級選擇器
    // =============================================
    function updateTotalAndSuggestion() {
      const score = calculateScore(currentEvalData, currentSelectedEmp);
      document.getElementById('current-total-score').innerText = score;

      const suggestion = getSuggestedGrade(currentSelectedEmp, score);
      const el = document.getElementById('seniority-suggestion');
      
      let html = `
        <div class="flex flex-col gap-2 mt-3 p-4 rounded-2xl bg-stone-50 border border-stone-100">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-semibold text-stone-500 uppercase tracking-widest">評定今日等級</span>
            ${suggestion ? `<span class="text-[10px] bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full">系統依照年資建議: ${suggestion.grade}</span>` : ''}
          </div>
          <div class="flex gap-2 sm:gap-3 flex-wrap">
      `;
      
      ['O', 'A', 'B', 'C', 'D'].forEach(g => {
        const gc = GRADE_COLORS[g];
        const isSelected = currentEvalData[currentSelectedEmp]?.grade === g;
        
        html += `
          <button onclick="applyGrade('${g}')" 
            class="flex-1 min-w-[40px] h-10 sm:h-12 rounded-xl font-bold transition-all border-2 flex items-center justify-center text-sm sm:text-base
            ${isSelected ? 'ring-2 ring-offset-2 ring-stone-400 scale-105 shadow-sm' : 'hover:scale-105 opacity-60 hover:opacity-100'}"
            style="background:${gc.bg}; color:${gc.text}; border-color:${isSelected ? gc.text : gc.border};">
            ${g}
          </button>
        `;
      });
      
      html += `</div></div>`;
      el.innerHTML = html;
    }

    function applyGrade(grade) {
      currentEvalData[currentSelectedEmp].grade = grade;
      renderEmployeeList(); // 更新左側列表狀態
      updateTotalAndSuggestion(); // 重新渲染自己的選擇器狀態
      showToast(`已成功評定 ${currentSelectedEmp} 今日等級為 ${grade}`);
    }

    // =============================================
    // 績效儲存功能 (新增：過濾未排班人員)
    // =============================================
    async function saveData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
      storage.current = currentEvalData;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
      
      let records = [];
      EMPLOYEES.forEach(emp => {
        const grade = currentEvalData[emp.name]?.grade;
        
        // 【重要修改】只有給予等級的人，才算是今天有上班/被評分，才會寫入雲端
        if (grade) {
          const stationId = currentEvalData[emp.name]?.station || STATIONS[0].id;
          const stationName = STATIONS.find(s => s.id === stationId)?.name || stationId;
          const score = calculateScore(currentEvalData, emp.name);
          
          records.push({
            name: emp.name,
            station: stationName,
            score: score,
            grade: grade
          });
        }
      });

      if (records.length === 0) {
        showToast('尚未替任何員工設定等級，無資料可儲存');
        return;
      }

      const payload = {
        type: 'evaluation',
        date: todayString,
        records: records
      };

      try {
        showToast('正在同步至 Google 試算表...');
        
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        if (result.status === 'success') {
          showToast('今日評分已成功儲存並同步至雲端');
        } else {
          showToast('雲端同步失敗，但已存在本機');
          console.error(result.message);
        }
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
        console.error('API Error:', error);
      }
    }

    // =============================================
    // 清潔評分模組
    // =============================================
    function renderCleaningModule() {
      const sel = document.getElementById('cleaning-emp-selector');
      sel.innerHTML = EMPLOYEES.map(emp => {
        const isSelected = cleaningData[emp.name]?.selected;
        return `
          <button id="clean-sel-${emp.name}" onclick="toggleCleaningEmp('${emp.name}')"
            class="px-3 py-1.5 rounded-full text-sm border transition-all ${isSelected
              ? 'bg-stone-800 text-white border-stone-800'
              : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">
            ${emp.name}
          </button>
        `;
      }).join('');
      renderCleaningSelectedList();
    }

    function toggleCleaningEmp(empName) {
      cleaningData[empName].selected = !cleaningData[empName].selected;
      if (!cleaningData[empName].selected) cleaningData[empName].stars = 0;
      renderCleaningModule();
    }

    function renderCleaningSelectedList() {
      const selectedEmps = EMPLOYEES.filter(e => cleaningData[e.name]?.selected);
      const container = document.getElementById('cleaning-selected-list');
      if (selectedEmps.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-400 text-sm py-8">請從上方選擇今日例行清潔人員</p>`;
        return;
      }
      container.innerHTML = selectedEmps.map(emp => {
        const stars = cleaningData[emp.name].stars || 0;
        return `
          <div class="flex items-center justify-between p-4 rounded-2xl bg-stone-50/50 border border-stone-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-stone-200 flex items-center justify-center text-stone-700 font-medium text-sm">
                ${emp.name.charAt(0)}
              </div>
              <span class="font-medium text-stone-800">${emp.name}</span>
            </div>
            <div class="star-rating" id="stars-${emp.name}">
              ${[1,2,3,4,5].map(n => `
                <button class="star-btn ${n <= stars ? 'active' : ''}"
                  onclick="setStars('${emp.name}', ${n})"
                  title="${n}星">★</button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function setStars(empName, n) {
      cleaningData[empName].stars = n;
      const container = document.getElementById(`stars-${empName}`);
      if (container) {
        container.querySelectorAll('.star-btn').forEach((btn, i) => {
          btn.classList.toggle('active', i < n);
        });
      }
    }

    // =============================================
    // 清潔儲存功能
    // =============================================
    async function saveCleaningData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
      storage.currentCleaning = cleaningData;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
      
      let records = [];
      EMPLOYEES.forEach(emp => {
        if (cleaningData[emp.name]?.selected) {
          records.push({
            name: emp.name,
            stars: cleaningData[emp.name].stars || 0
          });
        }
      });

      if (records.length === 0) {
        showToast('本機儲存成功 (無人參與清潔)');
        return;
      }

      const payload = { type: 'cleaning', date: todayString, records: records };

      try {
        showToast('正在同步至 Google 試算表...');
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.status === 'success') showToast('清潔評分已成功儲存並同步至雲端');
        else showToast('雲端同步失敗，但已存在本機');
      } catch (error) {
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
      }
    }

    // =============================================
    // 等級配額總覽
    // =============================================
    function renderGradeQuota() {
      const usedGrades = { O: 0, A: 0, B: 0, C: 0, D: 0 };
      EMPLOYEES.forEach(emp => {
        const g = currentEvalData[emp.name]?.grade;
        if (g && usedGrades[g] !== undefined) usedGrades[g]++;
      });

      document.getElementById('grade-quota-display').innerHTML = Object.entries(GRADE_LIMITS).map(([grade, limit]) => {
        const used = usedGrades[grade];
        const pct = Math.min(100, (used / limit) * 100);
        const isOver = used > limit;
        const isFull = used === limit;
        const gc = GRADE_COLORS[grade];
        return `
          <div class="rounded-2xl p-4 border" style="background:${gc.bg}; border-color:${gc.border};">
            <div class="flex items-center justify-between mb-2">
              <span class="text-lg font-bold" style="color:${gc.text};">${grade}級</span>
              <span class="text-sm font-medium ${isOver ? 'text-red-600' : ''}" style="${!isOver ? 'color:' + gc.text : ''}">
                ${used} / ${limit}
              </span>
            </div>
            <div class="h-2 rounded-full bg-white/60 overflow-hidden mb-2">
              <div class="h-full rounded-full transition-all ${isOver ? 'quota-warn' : isFull ? 'quota-full' : 'quota-ok'}"
                style="width:${pct}%"></div>
            </div>
            ${isOver
              ? `<p class="text-xs font-medium text-orange-600">⚠ 超額 ${used - limit} 人</p>`
              : isFull
                ? `<p class="text-xs font-medium" style="color:${gc.text}">已達上限</p>`
                : `<p class="text-xs" style="color:${gc.text}">尚可 ${limit - used} 人</p>`
            }
          </div>
        `;
      }).join('');
    }

    // =============================================
    // 總覽與歷史表格 (過濾未評分員工)
    // =============================================
    function buildTableHTML(dataSource, theadId, tbodyId) {
      document.getElementById(theadId).innerHTML = `
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-medium text-stone-500 uppercase tracking-wider whitespace-nowrap">員工姓名</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-medium text-stone-500 whitespace-nowrap">崗位</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-medium text-stone-500 whitespace-nowrap">年資</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-bold text-stone-800 whitespace-nowrap text-right">加權總分</th>
        <th class="py-4 px-4 md:py-5 md:px-6 text-xs md:text-sm font-bold text-stone-800 whitespace-nowrap text-center">等級</th>
      `;
      
      // 只列出有評分(有指派等級)的員工
      const evaluatedEmps = EMPLOYEES.filter(emp => dataSource[emp.name]?.grade);
      
      if (evaluatedEmps.length === 0) {
        document.getElementById(tbodyId).innerHTML = `<tr><td colspan="5" class="py-8 text-center text-stone-400">目前尚無評估紀錄</td></tr>`;
        return;
      }

      document.getElementById(tbodyId).innerHTML = evaluatedEmps.map(emp => {
        const stationId = dataSource[emp.name]?.station || STATIONS[0].id;
        const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
        const score = calculateScore(dataSource, emp.name);
        const grade = dataSource[emp.name]?.grade || '';
        const months = getSeniorityMonths(emp.joinDate);
        const gc = grade ? GRADE_COLORS[grade] : null;
        return `
          <tr class="hover:bg-stone-50/30">
            <td class="py-4 px-4 md:py-5 md:px-6 text-sm md:text-base font-medium text-stone-800 whitespace-nowrap">${emp.name}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-sm text-stone-500 whitespace-nowrap">${station.icon} ${station.name}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-sm text-stone-500 whitespace-nowrap">${getSeniorityLabel(months)}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-right font-medium text-stone-800 text-lg md:text-xl">${score}</td>
            <td class="py-4 px-4 md:py-5 md:px-6 text-center">
              ${grade
                ? `<span class="grade-badge grade-${grade}" style="background:${gc.bg};color:${gc.text};">${grade}</span>`
                : '<span class="text-stone-300 text-sm">—</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderDashboard() {
      renderGradeQuota();

      // 卡片區也只顯示有被評估的員工
      const evaluatedEmps = EMPLOYEES.filter(emp => currentEvalData[emp.name]?.grade);
      
      if(evaluatedEmps.length === 0) {
        document.getElementById('dashboard-cards').innerHTML = `<div class="col-span-full text-center py-6 text-stone-400">尚未指派任何評估等級</div>`;
      } else {
        document.getElementById('dashboard-cards').innerHTML = evaluatedEmps.map(emp => {
          const score = calculateScore(currentEvalData, emp.name);
          const grade = currentEvalData[emp.name]?.grade || '';
          const gc = grade ? GRADE_COLORS[grade] : null;
          return `
            <div class="bg-white/80 backdrop-blur-xl border border-white/60 p-4 md:p-6 rounded-3xl shadow-sm text-center group hover:shadow-md transition-all">
              <div class="w-12 h-12 md:w-14 md:h-14 mx-auto rounded-full bg-stone-50 border border-stone-100 flex items-center justify-center mb-2 shadow-sm">
                <i data-lucide="user" class="w-5 h-5 text-stone-600"></i>
              </div>
              <h3 class="text-lg font-medium text-stone-800">${emp.name}</h3>
              <div class="text-3xl md:text-4xl font-light text-stone-800 mt-1 mb-2">${score}</div>
              ${grade
                ? `<span class="grade-badge grade-${grade} mx-auto" style="background:${gc.bg};color:${gc.text};">${grade}</span>`
                : `<span class="text-xs text-stone-400">未設等級</span>`}
            </div>
          `;
        }).join('');
      }

      buildTableHTML(currentEvalData, 'dashboard-table-head', 'dashboard-table-body');

      const cleaningSelected = EMPLOYEES.filter(e => cleaningData[e.name]?.selected);
      const cleanSummaryEl = document.getElementById('cleaning-summary');
      if (cleaningSelected.length === 0) {
        cleanSummaryEl.innerHTML = '<p class="text-stone-400 text-sm">今日尚無清潔評分紀錄</p>';
      } else {
        cleanSummaryEl.innerHTML = `<div class="flex flex-wrap gap-3">${cleaningSelected.map(emp => {
          const stars = cleaningData[emp.name].stars || 0;
          return `
            <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-stone-50 border border-stone-100">
              <span class="font-medium text-stone-800">${emp.name}</span>
              <span class="text-amber-400">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>
              <span class="text-xs text-stone-500">${stars}/5</span>
            </div>
          `;
        }).join('')}</div>`;
      }

      lucide.createIcons();
    }

    function initHistoryTab() {
      const picker = document.getElementById('history-date-picker');
      let yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      picker.max = yesterday.toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
      const dates = Object.keys(historyData).sort((a, b) => new Date(b) - new Date(a));
      if (dates.length > 0) { picker.value = dates[0]; renderHistoryTable(dates[0]); }
      else { picker.value = ''; renderHistoryTable(''); }
    }

    function renderHistoryTable(dateString) {
      const emptyState = document.getElementById('history-empty-state');
      const tableHead = document.getElementById('history-table-head');
      const tableBody = document.getElementById('history-table-body');
      if (!dateString || !historyData[dateString]) {
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';
        emptyState.innerHTML = `
          <i data-lucide="calendar-x" class="w-12 h-12 text-stone-300 mb-4"></i>
          <p class="text-stone-500 font-medium">此日期沒有評分紀錄</p>
          <p class="text-xs text-stone-400 mt-1">請嘗試透過日曆選擇其他日期</p>`;
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      emptyState.classList.add('hidden');
      buildTableHTML(historyData[dateString], 'history-table-head', 'history-table-body');
      lucide.createIcons();
    }

    // =============================================
    // 頁籤切換
    // =============================================
    function switchTab(tab) {
      ['evaluate', 'cleaning', 'dashboard', 'history'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all text-stone-500 hover:text-stone-700";
      });
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-shrink-0 flex items-center px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-medium transition-all bg-white text-stone-800 shadow-sm";
      if (tab === 'dashboard') renderDashboard();
      if (tab === 'history') initHistoryTab();
      if (tab === 'cleaning') renderCleaningModule();
    }

    function showToast(msg) {
      document.getElementById('toast-msg').innerText = msg;
      const toast = document.getElementById('toast');
      // 移除隱藏屬性，讓訊息彈出
      toast.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
      // 3 秒後加回隱藏屬性
      setTimeout(() => toast.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none'), 3000);
    }

    // 啟動流程：先等 LIFF 啟動再進入系統
    window.onload = async () => {
      await initLiff();
      initApp();
    };
  </script>
</body>
</html>
