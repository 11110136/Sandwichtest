<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日收銀結算表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 20px; border: none !important; }
            input { border: none !important; background: transparent !important; }
            .date-line { border-bottom: 1px solid black !important; }
            
            /* 新增這行：列印時隱藏備註欄的提示文字 */
            textarea::placeholder { color: transparent !important; }
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen font-sans">

    <div class="fixed top-4 left-4 z-[999] no-print">
        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="flex items-center justify-center w-11 h-11 bg-white/90 backdrop-blur border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 hover:shadow-md transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                <line x1="4" x2="20" y1="12" y2="12"/>
                <line x1="4" x2="20" y1="6" y2="6"/>
                <line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
        </button>
        
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-100 overflow-hidden transition-all origin-top-left">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border-b border-gray-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
                </svg>
                值班系統
            </a>
            <a href="cash.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>
                </svg>
                每日收銀結算
            </a>
        </div>
    </div>
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg container border border-gray-200 pt-12 md:pt-8 mt-12 md:mt-0">
        <div class="border-b-2 border-gray-800 pb-4 mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-wider">每日收銀結算表</h1>
                <p class="text-xs text-gray-500 uppercase tracking-tighter">Daily Cash Reconciliation Form</p>
            </div>
            <div class="text-right">
                <label class="block text-xs font-bold text-gray-600 mb-1">結算日期</label>
                <input type="text" id="reportDate" placeholder="年 / 月 / 日" class="date-line border-b border-gray-300 focus:outline-none focus:border-blue-500 text-center py-1 px-2 w-48 bg-transparent">
            </div>
        </div>

        <table class="w-full border-collapse border border-gray-300 mb-8">
            <thead>
                <tr class="bg-gray-800 text-white">
                    <th class="border border-gray-300 p-3 text-left w-1/3">面額 (單位)</th>
                    <th class="border border-gray-300 p-3 text-center w-1/3">數量 (張/枚)</th>
                    <th class="border border-gray-300 p-3 text-right w-1/3 text-nowrap">小計 (元)</th>
                </tr>
            </thead>
            <tbody>
                <tr class="bg-gray-100"><td colspan="3" class="border border-gray-300 p-2 font-bold text-gray-700">百鈔與大鈔 (Notes)</td></tr>
                <tr class="cash-row" data-val="1000">
                    <td class="border border-gray-300 p-3 text-left">1,000 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="500">
                    <td class="border border-gray-300 p-3 text-left">500 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="100">
                    <td class="border border-gray-300 p-3 text-left">100 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>

                <tr class="bg-gray-100"><td colspan="3" class="border border-gray-300 p-2 font-bold text-gray-700">零錢 (Coins)</td></tr>
                <tr class="cash-row" data-val="50">
                    <td class="border border-gray-300 p-3 text-left">50 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="10">
                    <td class="border border-gray-300 p-3 text-left">10 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="5">
                    <td class="border border-gray-300 p-3 text-left">5 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="bg-yellow-50 font-bold text-xl">
                    <td colspan="2" class="border border-gray-300 p-4 text-right">現金總額 (Total):</td>
                    <td class="border border-gray-300 p-4 text-right text-blue-800" id="grandTotal">NT$ 0</td>
                </tr>
            </tfoot>
        </table>

        <div class="grid grid-cols-2 gap-4 md:gap-12 mt-16 px-2 md:px-4">
            <div class="text-center flex flex-col items-center">
                <div class="relative w-full h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/50">
                    <canvas id="canvasCloser" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
                    <button onclick="clearCanvas('canvasCloser')" class="absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/80 px-2 py-1 rounded shadow-sm no-print transition-colors">
                        清除
                    </button>
                    <span class="sign-hint absolute inset-0 flex items-center justify-center text-gray-300 pointer-events-none text-sm tracking-widest no-print">
                        請在此處簽名
                    </span>
                </div>
                <p class="text-sm font-bold text-gray-700">當天關帳人簽名</p>
                <div class="text-xs text-gray-400 italic mt-1">(Signature of Closer)</div>
            </div>

            <div class="text-center flex flex-col items-center">
                <div class="relative w-full h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/50">
                    <canvas id="canvasManager" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
                    <button onclick="clearCanvas('canvasManager')" class="absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/80 px-2 py-1 rounded shadow-sm no-print transition-colors">
                        清除
                    </button>
                    <span class="sign-hint absolute inset-0 flex items-center justify-center text-gray-300 pointer-events-none text-sm tracking-widest no-print">
                        請在此處簽名
                    </span>
                </div>
                <p class="text-sm font-bold text-gray-700">主管/核實人簽名</p>
                <div class="text-xs text-gray-400 italic mt-1">(Signature of Manager)</div>
            </div>
        </div>

        <div class="mt-12 border border-gray-300 rounded-xl p-4 break-inside-avoid">
            <label for="remarksInput" class="block text-sm font-bold text-gray-700 mb-2">備註事項 (Remarks):</label>
            <textarea id="remarksInput" rows="3" class="w-full border border-gray-200 rounded-lg p-3 text-gray-700 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-y print:border print:border-gray-300 print:bg-white" placeholder="可點擊此處輸入備註，或直接留白列印出來手寫..."></textarea>
        </div>

        <div class="mt-10 flex justify-center space-x-4 no-print">
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                列印紙本表格
            </button>
            <button onclick="resetForm()" class="bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 font-bold py-3 px-8 rounded-lg transition duration-200">
                清除內容
            </button>
        </div>

        <div class="text-[10px] text-gray-400 mt-8 text-center uppercase tracking-widest no-print">
            End of Report
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.qty-input');
        const rows = document.querySelectorAll('.cash-row');
        const grandTotalDisplay = document.getElementById('grandTotal');

        function calculate() {
            let total = 0;
            rows.forEach(row => {
                const val = parseInt(row.getAttribute('data-val'));
                const qty = parseInt(row.querySelector('.qty-input').value) || 0;
                const subtotal = val * qty;
                row.querySelector('.subtotal').textContent = subtotal.toLocaleString('zh-TW');
                total += subtotal;
            });
            grandTotalDisplay.textContent = 'NT$ ' + total.toLocaleString('zh-TW');
        }

        inputs.forEach(input => {
            input.addEventListener('input', calculate);
        });

        function resetForm() {
            if(confirm('確定要清空所有數量與簽名嗎？')) {
                inputs.forEach(input => input.value = '');
                document.getElementById('reportDate').value = '';
                
                // 新增這行：清空備註欄
                document.getElementById('remarksInput').value = '';
                
                // 如果你之前有加上清除簽名的代碼，保留在這裡：
                clearCanvas('canvasCloser');
                clearCanvas('canvasManager');
                
                calculate();
            }
        }

        // ==========================================
        // --- 全域導覽選單功能 ---
        // ==========================================
        function toggleGlobalMenu() {
            document.getElementById('global-nav-menu').classList.toggle('hidden');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('global-nav-menu');
            const btn = document.getElementById('global-nav-btn');
            if (menu && btn && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // ==========================================
        // --- 電子簽名板 (Signature Pad) 功能 ---
        // ==========================================
        function initSignaturePad(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            const hint = container.querySelector('.sign-hint');
            
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            // 確保畫布解析度與 CSS 顯示尺寸一致，線條才會平滑
            function resizeCanvas() {
                // 如果已經有簽名了，調整大小前先暫存起來
                const dataUrl = canvas.toDataURL(); 
                
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                
                // 恢復暫存的簽名
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => { ctx.drawImage(img, 0, 0); };
                
                // 設定畫筆樣式
                ctx.lineWidth = 2.5; // 畫筆粗細
                ctx.lineCap = 'round'; // 圓滑邊緣
                ctx.lineJoin = 'round'; // 圓滑轉角
                ctx.strokeStyle = '#1e293b'; // 墨水顏色 (深藍灰)
            }

            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 100); // 延遲一下確保畫面渲染完畢才取得尺寸

            // 取得目前觸控或滑鼠座標
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            // 開始畫圖
            function startPosition(e) {
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                if(hint) hint.style.display = 'none'; // 隱藏「請在此處簽名」的提示
                e.preventDefault(); // 防止手機螢幕跟著滑動
            }

            // 結束畫圖
            function endPosition() {
                isDrawing = false;
                ctx.beginPath(); // 重置路徑，避免下次畫圖跟上次連在一起
            }

            // 畫圖中
            function draw(e) {
                if (!isDrawing) return;
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
                e.preventDefault(); // 防止手機螢幕跟著滑動
            }

            // 註冊滑鼠事件 (電腦端)
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mouseout', endPosition);
            canvas.addEventListener('mousemove', draw);

            // 註冊觸控事件 (手機/平板端)
            canvas.addEventListener('touchstart', startPosition, {passive: false});
            canvas.addEventListener('touchend', endPosition, {passive: false});
            canvas.addEventListener('touchcancel', endPosition, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
        }

        // 清除畫布功能
        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清空畫面
            
            // 把「請在此處簽名」的提示加回來
            const hint = canvas.parentElement.querySelector('.sign-hint');
            if(hint) hint.style.display = 'flex';
        }

        // 網頁載入後初始化兩個簽名板
        document.addEventListener("DOMContentLoaded", () => {
            initSignaturePad('canvasCloser');
            initSignaturePad('canvasManager');
        });
    </script>
</body>
</html>
