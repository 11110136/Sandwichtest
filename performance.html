    body {
      background-color: #F6F7F2; 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: #6C8673; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px; cursor: pointer; background: #D4DCD5; border-radius: 4px;
    }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 星星評分 */
    .star-rating { display: flex; gap: 6px; }
    .star-btn {
      cursor: pointer; color: #D4DCD5;
      transition: color 0.15s, transform 0.1s;
      background: none; border: none; padding: 0;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }

    /* 等級徽章 */
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      font-weight: 700; font-size: 14px; letter-spacing: 0.05em;
    }
    .grade-O { background: #fef9c3; color: #854d0e; }
    .grade-A { background: #dcfce7; color: #166534; }
    .grade-B { background: #dbeafe; color: #1e40af; }
    .grade-C { background: #f3e8ff; color: #6b21a8; }
    .grade-D { background: #fee2e2; color: #991b1b; }

    /* 崗位選擇按鈕 */
    .station-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1.5px solid #D4DCD5;
      background: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 14px; font-weight: 600; color: #4F6354; letter-spacing: 0.025em;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .station-btn:hover { 
      border-color: #A3B4A5; background: #F8FAF8; transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .station-btn.active {
      border-color: #6C8673; background: #6C8673; color: white;
      box-shadow: 0 4px 12px rgba(108, 134, 115, 0.2);
    }
    .station-btn .icon-wrapper {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      background: #F0F4F1; transition: all 0.2s;
    }
    .station-btn.active .icon-wrapper {
      background: white; 
    }
    
    dialog {
      border: none;
      background: white;
    }
    dialog::backdrop {
      background: rgba(45, 58, 49, 0.5); 
    }

    async function fetchTodayShift() {
      const today = new Date();
      const year = parseInt(today.getFullYear());
      const month = parseInt(today.getMonth() + 1);
      const day = parseInt(today.getDate());

      try {
        const { data, error } = await supabase
          .from('shift_schedules')
          .select('open, shift') 
          .eq('year', year)
          .eq('month', month)
          .eq('day', day)
          .maybeSingle();

        if (error) {
          console.error("Supabase 查詢錯誤:", error);
          return;
        }

        if (data) {
          let allShiftPeople = [];
          if (data.open)  allShiftPeople.push(...data.open.split('、').map(n => n.trim()));
          if (data.shift) allShiftPeople.push(...data.shift.split('、').map(n => n.trim()));

          const uniqueNames = [...new Set(allShiftPeople.filter(n => n && n !== 'X' && n !== ''&& n !== '可柔'))];
          EMPLOYEES = ALL_EMPLOYEES.filter(emp => uniqueNames.includes(emp.name));
          
          uniqueNames.forEach(name => {
            if (!EMPLOYEES.find(e => e.name === name) && name !== 'X' && name !== '') {
              EMPLOYEES.push({ name: name, joinDate: new Date().toISOString().split('T')[0] });
            }
          });
          renderEmployeeList(); 
        }
      } catch (err) {
        console.error('取得班表失敗:', err);
      }
    }

    async function initApp() {
      await fetchTodayShift();

      if (EMPLOYEES.length === 0) {
        document.getElementById('employee-list').innerHTML = '<p class="text-[#8FA192] text-sm p-4 text-center border-2 border-dashed border-[#D4DCD5] rounded-2xl">今日查無班表</p>';
        document.getElementById('evaluate-content').innerHTML = '<div class="h-64 flex items-center justify-center text-[#8FA192]">目前沒有人員可以評分</div>';
        return;
      }

      currentSelectedEmp = EMPLOYEES[0].name;
      loadDataFromStorage();
      renderEmployeeList();
      selectEmployee(currentSelectedEmp);
      renderStationSelector();
      renderCleaningModule();
      lucide.createIcons();
      
      // 給予 150ms 充足時間讓 Tailwind CDN 處理完 DOM 排版，再進行首次完美對齊切換
      setTimeout(() => {
        const isCleaningHidden = document.getElementById('section-cleaning').classList.contains('hidden');
        switchTab(isCleaningHidden ? 'evaluate' : 'cleaning');
      }, 150);
    }

    function generateDefaultEval(defaultScore = 5) {
      let data = {};
      EMPLOYEES.forEach(emp => {
        data[emp.name] = { station: STATIONS[0].id, grade: '' };
        STATIONS.forEach(st => {
          data[emp.name][st.id] = {};
          st.criteria.forEach(c => { data[emp.name][st.id][c.id] = { score: defaultScore, note: '' }; });
        });
      });
      return data;
    }

    function generateDefaultCleaning() {
      let d = {};
      ALL_EMPLOYEES.forEach(emp => { d[emp.name] = { selected: false, stars: 0 }; });
      return d;
    }

    function loadDataFromStorage() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2'));
      if (!storage) {
        storage = {
          lastDate: todayString,
          current: generateDefaultEval(5),
          currentCleaning: generateDefaultCleaning(),
          history: {},
          historyCleaning: {}
        };
      } else if (storage.lastDate !== todayString) {
        storage.history[storage.lastDate] = storage.current;
        storage.historyCleaning[storage.lastDate] = storage.currentCleaning;
        storage.current = generateDefaultEval(5);
        storage.currentCleaning = generateDefaultCleaning();
        storage.lastDate = todayString;
      }
      
      if(!storage.current) storage.current = {};
      if(!storage.currentCleaning) storage.currentCleaning = {};
      
      EMPLOYEES.forEach(emp => {
        if(!storage.current[emp.name]) {
          storage.current[emp.name] = { station: STATIONS[0].id, grade: '' };
          STATIONS.forEach(st => {
            storage.current[emp.name][st.id] = {};
            st.criteria.forEach(c => { storage.current[emp.name][st.id][c.id] = { score: 5, note: '' }; });
          });
        }
      });

      ALL_EMPLOYEES.forEach(emp => {
        if(!storage.currentCleaning[emp.name]) {
          storage.currentCleaning[emp.name] = { selected: false, stars: 0 };
        }
      });

      currentEvalData = storage.current;
      cleaningData = storage.currentCleaning;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
    }

    function getGradeTableKey(tier) {
      const map = { 'A': '到職1年以內', 'B': '到職1~3年', 'C': '到職3~5年', 'D': '到職5~8年' };
      return map[tier] || '到職1年以內';
    }

    function getSuggestedGrade(empName, score) {
      const emp = EMPLOYEES.find(e => e.name === empName);
      if (!emp) return null;
      const label = getGradeTableKey(emp.gradeTier);
      const table = GRADE_TABLE[label];
      let grade;
      const s = parseFloat(score);
      if (s >= 90) grade = table.over90;
      else if (s >= 80) grade = table.over80;
      else if (s >= 70) grade = table.over70;
      else if (s >= 60) grade = table.over60;
      else grade = table.under60;
      return { grade, seniorityLabel: label };
    }

    function calculateScore(dataObj, empName) {
      if (dataObj[empName] && dataObj[empName].precalculatedScore !== undefined) {
        return dataObj[empName].precalculatedScore;
      }
      const stationId = dataObj[empName].station || STATIONS[0].id;
      const station = STATIONS.find(s => s.id === stationId) || STATIONS[0];
      let total = 0;
      station.criteria.forEach(c => {
        const d = dataObj[empName][stationId];
        if (d && d[c.id]) total += (d[c.id].score * 10) * c.weight;
      });
      return total.toFixed(1);
    }

    function adjustScore(stationId, cId, delta) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      let currentScore = currentEvalData[currentSelectedEmp][stationId][cId].score;
      let newScore = Math.min(10, Math.max(1, currentScore + delta));
      currentEvalData[currentSelectedEmp][stationId][cId].score = newScore;
      document.getElementById(`slider-${cId}`).value = newScore;
      document.getElementById(`score-display-${cId}`).innerText = newScore;
      updateTotalAndSuggestion();
    }

    function updateScore(stationId, cId, val) {
      if (!currentEvalData[currentSelectedEmp][stationId]) return;
      currentEvalData[currentSelectedEmp][stationId][cId].score = parseInt(val, 10);
      document.getElementById(`score-display-${cId}`).innerText = val;
      updateTotalAndSuggestion();
    }
    
    function updateNote(stationId, cId, val) {
      if (currentEvalData[currentSelectedEmp][stationId]) {
        currentEvalData[currentSelectedEmp][stationId][cId].note = val;
      }
    }

    function updateTotalAndSuggestion() {
      const score = calculateScore(currentEvalData, currentSelectedEmp);
      document.getElementById('current-total-score').innerText = score;
      const suggestion = getSuggestedGrade(currentSelectedEmp, score);
      const el = document.getElementById('seniority-suggestion');
      
      let html = `
        <div class="flex flex-col gap-2 mt-3 p-4 rounded-2xl bg-[#F8FAF8] border border-[#E5EBE6]">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-semibold text-[#8FA192] uppercase tracking-widest">評定今日等級</span>
            ${suggestion ? `<span class="text-[10px] bg-[#E5EBE6] text-[#687A6B] px-2 py-0.5 rounded-full">該員工年資級距: ${suggestion.seniorityLabel}</span>` : ''}
          </div>
          <div class="flex gap-2 sm:gap-3 flex-wrap">
      `;
      
      ['O', 'A', 'B', 'C', 'D'].forEach(g => {
        const gc = GRADE_COLORS[g];
        const isSelected = currentEvalData[currentSelectedEmp]?.grade === g;
        html += `
          <button onclick="applyGrade('${g}')" 
            class="flex-1 min-w-[40px] h-10 sm:h-12 rounded-xl font-bold transition-all border-2 flex items-center justify-center text-sm sm:text-base

            style="background:${gc.bg}; color:${gc.text}; border-color:${isSelected ? gc.text : gc.border};">
            ${g}

        `;
      });
      html += `</div></div>`;
      el.innerHTML = html;
    }

    async function saveData() {
      let storage = JSON.parse(localStorage.getItem('EvalSystemDB_v2')) || {};
      storage.current = currentEvalData;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(storage));
      
      let records = [];
      EMPLOYEES.forEach(emp => {
        const grade = currentEvalData[emp.name]?.grade;
        if (grade) {
          const stationId = currentEvalData[emp.name]?.station || STATIONS[0].id;
          const stationObj = STATIONS.find(s => s.id === stationId);
          const stationName = stationObj?.name || stationId;
          const score = calculateScore(currentEvalData, emp.name); 
          const details = currentEvalData[emp.name][stationId] || {};
          
          let detailsTextArr = [];
          if (stationObj && stationObj.criteria) {
            stationObj.criteria.forEach(c => {
              if (details[c.id]) {
                const cScore = details[c.id].score;
                const cNote = details[c.id].note ? ` (備註: ${details[c.id].note})` : '';
                detailsTextArr.push(`【${c.name}】${cScore}分${cNote}`);
              }
            });
          }
          const detailsString = detailsTextArr.join('\n');
          const gradeScore = GRADE_SCORES[grade] || 0;
          const weightedTotal = parseFloat(score);
          const finalScore = (weightedTotal * 0.7 + gradeScore * 0.3).toFixed(1);

          records.push({
            date: todayString, name: emp.name, station: stationName,      
            score: weightedTotal, grade: grade, details: detailsString,    
            finalScore: parseFloat(finalScore) 
          });
        }
      });

      if (records.length === 0) {
        showToast('尚未替任何員工設定等級，無資料可儲存');
        return;
      }

      const payload = { type: 'evaluation', date: todayString, records: records };
      const modal = document.getElementById('status-modal');
      const loading = document.getElementById('modal-loading');
      const success = document.getElementById('modal-success');
      
      modal.showModal();
      loading.classList.remove('hidden');
      success.classList.add('hidden');

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        loading.classList.add('hidden');
        if (result.status === 'success') {
          success.classList.remove('hidden');
          lucide.createIcons();
        } else {
          modal.close();
          showToast('雲端同步失敗，但已存在本機');
        }
      } catch (error) {
        loading.classList.add('hidden');
        modal.close();
        showToast('網路錯誤：雲端同步失敗，已儲存於本機');
      }
    }

          headers: { 'Content-Type': 'text/plain;charset=utf-8' },

    // 更新底線寬度與位置的統一函式
    function updateTabIndicator() {
      const evaluateBtn = document.getElementById('tab-evaluate');
      const cleaningBtn = document.getElementById('tab-cleaning');
      const indicator = document.getElementById('tab-indicator');
      const sectionCleaning = document.getElementById('section-cleaning');
      
      if (!indicator || !evaluateBtn || !cleaningBtn || !sectionCleaning) return;

      const isEvaluate = sectionCleaning.classList.contains('hidden');
      const activeBtn = isEvaluate ? evaluateBtn : cleaningBtn;

      // 💡 優化點：如果寬度尚未被彈性排版撐開（為 0），先不要更新寬度，有效防止抓到初始 block 的錯誤大寬度
      if (activeBtn.offsetWidth === 0) return;

      indicator.style.width = `${activeBtn.offsetWidth}px`;
      indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
    }

    // 💡 優化點：只保留視窗縮放的即時對齊，徹底移除 window.load，改由 initApp 進行最終定型
    window.addEventListener('resize', updateTabIndicator);

    function switchTab(tab) {
      const evaluateBtn = document.getElementById('tab-evaluate');
      const cleaningBtn = document.getElementById('tab-cleaning');
      const sectionEvaluate = document.getElementById('section-evaluate');
      const sectionCleaning = document.getElementById('section-cleaning');
      const indicator = document.getElementById('tab-indicator');

      if (tab === 'evaluate') {
        sectionEvaluate.classList.remove('hidden');
        sectionCleaning.classList.add('hidden');
        evaluateBtn.classList.remove('text-[#8FA192]', 'hover:text-[#4F6354]');
        evaluateBtn.classList.add('text-[#2D3A31]');
        cleaningBtn.classList.remove('text-[#2D3A31]');
        cleaningBtn.classList.add('text-[#8FA192]', 'hover:text-[#4F6354]');
      } else {
        sectionEvaluate.classList.add('hidden');
        sectionCleaning.classList.remove('hidden');
        cleaningBtn.classList.remove('text-[#8FA192]', 'hover:text-[#4F6354]');
        cleaningBtn.classList.add('text-[#2D3A31]');
        evaluateBtn.classList.remove('text-[#2D3A31]');
        evaluateBtn.classList.add('text-[#8FA192]', 'hover:text-[#4F6354]');
        renderCleaningModule();
      }
      
      // 計算並移動到底部標籤正確位置
      updateTabIndicator();
      
      // 💡 優化點：如果底線還是透明狀態（代表初次進入網頁且排版已完成），給予 50ms 小緩衝確保寬度已精準寫入樣式，再淡入顯示
      if (indicator && indicator.classList.contains('opacity-0')) {
        setTimeout(() => {
          indicator.classList.remove('opacity-0');
        }, 50);
      }
    }

    function showToast(msg, isWarning = false) {
      document.getElementById('toast-msg').innerText = msg;
      const toast = document.getElementById('toast');
      if (isWarning) {
        toast.classList.remove('bg-[#3F5144]/95');
        toast.classList.add('bg-orange-500/95');
      } else {
        toast.classList.add('bg-[#3F5144]/95');
        toast.classList.remove('bg-orange-500/95');
      }
      toast.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none'), 3000);
    }

    window.onload = async () => {
      try {
        await Promise.race([
          initLiff(),
          new Promise(resolve => setTimeout(resolve, 3000))
        ]);
        initApp();
      } catch (err) {
        console.error("嚴重錯誤:", err);
      }
    };
  </script>
</body>
</html>
