<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a9e7e;
    --sage-light: #c8dcc9;
    --sage-pale: #eaf2eb;
    --olive: #5c7a5e;
    --cream: #faf8f3;
    --warm-white: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #3d3d3d;
    --ink-muted: #777;
    --accent-red: #c0392b;
    --accent-blue: #2980b9;
    --accent-purple: #8e44ad;
    --accent-orange: #e67e22;
    --border: #d4dfd4;
    --shadow: 0 2px 12px rgba(90,120,90,0.10);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── TOP NAV ── */
  .topbar {
    background: var(--olive);
    color: #fff;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .topbar-actions { display: flex; gap: 10px; }
  .btn {
    padding: 7px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: all .18s;
  }
  .btn-white { background: #fff; color: var(--olive); }
  .btn-white:hover { background: var(--sage-pale); }
  .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); }
  .btn-outline:hover { background: rgba(255,255,255,.15); }
  .btn-sage { background: var(--sage); color: #fff; }
  .btn-sage:hover { background: var(--olive); }
  .btn-red { background: var(--accent-red); color: #fff; }
  .btn-red:hover { filter: brightness(1.1); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--warm-white);
    border-bottom: 2px solid var(--border);
    padding: 0 32px;
  }
  .tab {
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink-muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all .18s;
    letter-spacing: .5px;
  }
  .tab.active { color: var(--olive); border-bottom-color: var(--olive); }
  .tab:hover:not(.active) { color: var(--sage); }

  /* ── MAIN ── */
  .main { padding: 28px 32px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .section-header h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    color: var(--olive);
    font-weight: 700;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .month-nav button {
    background: var(--sage-pale);
    border: 1px solid var(--border);
    border-radius: 5px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 16px;
    color: var(--olive);
    font-weight: 700;
    line-height: 1;
  }
  .month-nav span { font-size: 15px; font-weight: 700; color: var(--ink); min-width: 90px; text-align: center; }

  /* ── STAFF MANAGER ── */
  .staff-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  .staff-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--sage-pale);
    border: 1.5px solid var(--sage-light);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 500;
  }
  .staff-tag .del { background: none; border: none; cursor: pointer; color: var(--accent-red); font-size: 16px; line-height: 1; padding: 0 2px; }
  .add-staff-row { display: flex; gap: 8px; }
  .add-staff-row input {
    padding: 7px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    width: 160px;
    transition: border .15s;
  }
  .add-staff-row input:focus { border-color: var(--sage); }

  /* ── CALENDAR GRIDS ── */
  .calendars-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .cal-section h3 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    color: var(--sage);
    margin-bottom: 10px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .calendar {
    background: var(--warm-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* ── WEEKDAY CALENDAR (5 columns: Mon–Fri) ── */
  .cal-weekday .cal-header {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--sage);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
  }
  .cal-weekday .cal-body {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }

  /* ── FULL CALENDAR (7 columns: all week) ── */
  .cal-full .cal-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--sage);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
  }
  .cal-full .cal-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .cal-header div {
    text-align: center;
    padding: 8px 4px;
    letter-spacing: .5px;
  }

  /* ── CALENDAR CELL ── */
  .cal-cell {
    min-height: 110px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px 6px;
    font-size: 15px;
    vertical-align: top;
    position: relative;
    transition: background .15s;
    text-align: center;
  }
  .cal-cell:last-child { border-right: none; }
  .cal-weekday .cal-cell:nth-child(5n) { border-right: none; }
  .cal-full .cal-cell:nth-child(7n) { border-right: none; }

  .cal-cell.other-month { background: #f7f7f5; }
  .cal-cell.today { background: #fffbea; }
  .cal-cell.weekend { background: #faf5f5; }
  .cal-cell.highlighted { background: var(--sage-pale); }

  .cal-cell .date-num {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
    display: block;
    text-align: center;
  }
  .cal-cell.other-month .date-num { color: #bbb; }

  .cal-cell .task-line {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    white-space: pre-line;
    text-align: center;
  }
  .cal-cell .task-line b { color: var(--olive); font-size: 16px; }

  .cal-cell .edit-btn {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: var(--sage-light);
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    color: var(--olive);
    opacity: 0;
    transition: opacity .15s;
  }
  .cal-cell:hover .edit-btn { opacity: 1; }

  .cal-cell .closed-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-red);
    text-align: center;
  }

  /* ── SHIFT TABLE ── */
  .shift-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    background: var(--warm-white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .shift-table th, .shift-table td {
    border: 1px solid var(--border);
    padding: 9px 12px;
    text-align: center;
    vertical-align: middle;
  }
  .shift-table thead tr:first-child th {
    background: #3b6cbf;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
  }
  .shift-table thead tr:nth-child(2) th {
    background: #e8f0fe;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 15px;
  }
  .shift-table td.closed-cell {
    color: var(--accent-red);
    font-weight: 700;
    font-size: 15px;
  }
  .shift-table td.open-cell {
    min-width: 120px;
  }
  .shift-table td input, .shift-table td select {
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 6px;
    width: 100%;
    outline: none;
    background: var(--cream);
    transition: border .15s;
    text-align: center;
  }
  .shift-table td input:focus, .shift-table td select:focus { border-color: var(--sage); background: #fff; }

  .opener-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .opener-可 { background: #ffe0b2; color: #b26a00; }
  .opener-郭 { background: #d1c4e9; color: #4a148c; }
  .opener-俐 { background: #b3e5fc; color: #01579b; }
  .opener-宣 { background: #c8e6c9; color: #1b5e20; }
  .opener-若 { background: #f8bbd0; color: #880e4f; }
  .opener-瑋 { background: #dcedc8; color: #33691e; }
  .opener-菟 { background: #f0f4c3; color: #827717; }
  .opener-苑 { background: #ffd54f; color: #5d4037; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px 32px;
    width: 440px;
    max-width: 95vw;
    box-shadow: 0 8px 40px rgba(0,0,0,.18);
    position: relative;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--olive); }
  .modal .close-btn {
    position: absolute;
    top: 16px; right: 18px;
    background: none; border: none; font-size: 20px; cursor: pointer; color: #888;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--ink-soft); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border .15s;
    background: var(--cream);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--sage); background: #fff; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .staff-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .staff-checkbox {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--sage-pale);
    border: 1.5px solid var(--border);
    border-radius: 15px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all .15s;
    user-select: none;
  }
  .staff-checkbox input { display: none; }
  .staff-checkbox.checked { background: var(--sage); color: #fff; border-color: var(--olive); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* ══════════════════════════════════════════
     PRINT STYLES — 清潔＋洗餐具同頁、填滿、置中
     ══════════════════════════════════════════ */
  @media print {
    @page {
      size: A4 landscape;
      margin: 8mm 10mm;
    }

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    body { background: #fff !important; margin: 0; padding: 0; }

    /* Hide everything except active panel */
    .topbar, .tabs, .section-header .month-nav,
    .edit-btn, .btn, .add-staff-row,
    #staffPanel, .modal-overlay { display: none !important; }

    .main { padding: 0 !important; margin: 0 !important; }

    .panel { display: none !important; }
    .panel.active { display: flex !important; flex-direction: column; height: 100vh; }

    /* ── cleanPanel: fill the entire page ── */
    #cleanPanel {
      width: 100% !important;
      height: calc(100vh - 16mm) !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 4px !important;
    }

    /* Title row */
    #cleanPanel .section-header {
      width: 100% !important;
      justify-content: center !important;
      margin-bottom: 4px !important;
    }
    #cleanPanel .section-header h2 {
      font-size: 22px !important;
      text-align: center !important;
    }

    /* Two calendars side by side, filling width & remaining height */
    #cleanPanel .calendars-wrap {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 10px !important;
      width: 100% !important;
      flex: 1 !important;
      align-items: stretch !important;
    }

    #cleanPanel .cal-section {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
    }

    #cleanPanel .cal-section h3 {
      font-size: 17px !important;
      margin-bottom: 4px !important;
      text-align: center !important;
    }

    /* Calendar fills remaining height */
    #cleanPanel .calendar {
      flex: 1 !important;
      display: flex !important;
      flex-direction: column !important;
      border-radius: 4px !important;
      overflow: hidden !important;
      box-shadow: none !important;
    }

    /* Cal header */
    #cleanPanel .cal-header div {
      padding: 6px 2px !important;
      font-size: 16px !important;
    }

    /* Cal body fills all space */
    #cleanPanel .cal-body {
      flex: 1 !important;
      /* grid rows auto-stretch to fill */
      align-content: stretch !important;
    }

    /* ── 清潔 weekday grid ── */
    #cleanPanel #cleanCalBody {
      display: grid !important;
      grid-template-columns: repeat(5, 1fr) !important;
      /* auto rows that stretch evenly */
      grid-auto-rows: 1fr !important;
      height: 100% !important;
    }

    /* ── 洗餐具 full-week grid ── */
    #cleanPanel #dishCalBody {
      display: grid !important;
      grid-template-columns: repeat(7, 1fr) !important;
      grid-auto-rows: 1fr !important;
      height: 100% !important;
    }

    /* ── Calendar cells ── */
    #cleanPanel .cal-cell {
      min-height: unset !important;
      height: auto !important;
      padding: 4px 3px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      border-right: 1px solid #ccc !important;
      border-bottom: 1px solid #ccc !important;
      overflow: hidden !important;
    }

    #cleanPanel .cal-cell .date-num {
      font-size: 15px !important;
      margin-bottom: 3px !important;
      font-weight: 700 !important;
      line-height: 1.1 !important;
    }

    /* 清潔 cell text */
    #cleanPanel #cleanCalBody .cal-cell .task-line {
      font-size: 13px !important;
      line-height: 1.4 !important;
      text-align: center !important;
      white-space: pre-line !important;
    }

    /* 洗餐具 cell text — LARGE, fills the cell */
    #cleanPanel #dishCalBody .cal-cell {
      justify-content: center !important;
    }
    #cleanPanel #dishCalBody .cal-cell .task-line {
      font-size: 20px !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      text-align: center !important;
    }
    #cleanPanel #dishCalBody .cal-cell .task-line b {
      font-size: 22px !important;
      color: var(--olive) !important;
    }
    #cleanPanel #dishCalBody .cal-cell .closed-label {
      font-size: 18px !important;
      font-weight: 700 !important;
      color: var(--accent-red) !important;
    }
    #cleanPanel #dishCalBody .cal-cell .date-num {
      font-size: 13px !important;
      color: #888 !important;
      font-weight: 600 !important;
    }

    /* Background colors preserved */
    #cleanPanel .cal-cell.highlighted { background: #eaf2eb !important; }
    #cleanPanel .cal-cell.today { background: #fffbea !important; }
    #cleanPanel .cal-cell.weekend { background: #faf5f5 !important; }
    #cleanPanel .cal-cell.other-month { background: #f7f7f5 !important; }
    #cleanPanel .cal-header { background: #7a9e7e !important; color: #fff !important; }

    /* Shift panel print (unchanged) */
    .shift-table { font-size: 11px; }
    .shift-table th, .shift-table td { padding: 4px 5px; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .calendars-wrap { grid-template-columns: 1fr; }
    .main { padding: 16px; }
  }

  .tip { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; }
  .divider { height: 1px; background: var(--border); margin: 24px 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>📋 排班管理系統</h1>
  <div class="topbar-actions">
    <button class="btn btn-outline" onclick="switchTab('staffPanel')">👥 管理人員</button>
    <button class="btn btn-white" onclick="printSchedule()">🖨️ 列印排班表</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('cleanPanel')">🧹 清潔與洗餐具</div>
  <div class="tab" onclick="switchTab('shiftPanel')">🏪 開店關帳值班</div>
  <div class="tab" id="staffTabBtn" onclick="switchTab('staffPanel')" style="display:none;">👥 人員管理</div>
</div>

<div class="main">

  <!-- ══ PANEL 1: 清潔 & 洗餐具 ══ -->
  <div class="panel active" id="cleanPanel">
    <div class="section-header">
      <h2 id="cleanTitle">2026 年 4 月　清潔與洗餐具</h2>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel">2026 年 4 月</span>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <p class="tip">點擊日期格右下角「編輯」按鈕可輸入當天負責人員（清潔表格僅顯示週一至週五）</p>
    <div class="calendars-wrap">
      <div class="cal-section">
        <h3>清潔</h3>
        <div class="calendar cal-weekday" id="cleanCal">
          <div class="cal-header">
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div>
          </div>
          <div class="cal-body" id="cleanCalBody"></div>
        </div>
      </div>
      <div class="cal-section">
        <h3>洗餐具</h3>
        <div class="calendar cal-full" id="dishCal">
          <div class="cal-header">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
          </div>
          <div class="cal-body" id="dishCalBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ PANEL 2: 開店關帳值班 ══ -->
  <div class="panel" id="shiftPanel">
    <div class="section-header">
      <h2>開店關帳人員值班表</h2>
      <div class="month-nav">
        <button onclick="changeShiftMonth(-1)">‹</button>
        <span id="shiftMonthLabel">2026 年 2 月</span>
        <button onclick="changeShiftMonth(1)">›</button>
      </div>
    </div>
    <p class="tip">直接點擊欄位輸入；開店人員可切換顏色標記</p>
    <div class="shift-wrap">
      <table class="shift-table" id="shiftTable">
        <thead>
          <tr><th colspan="7" id="shiftTableTitle">2026年2月份</th></tr>
          <tr>
            <th>日期</th><th>星期</th><th>開店</th><th>當天值班</th><th>20:00</th><th>關帳</th>
            <th style="width:20px;background:#f0f0f0;"></th>
          </tr>
        </thead>
        <tbody id="shiftBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ══ PANEL 3: 人員管理 ══ -->
  <div class="panel" id="staffPanel">
    <div class="section-header"><h2>人員管理</h2></div>
    <p class="tip">新增或刪除排班人員，變更會立即套用至所有表格。</p>
    <div class="staff-grid" id="staffGrid"></div>
    <div class="add-staff-row">
      <input type="text" id="newStaffInput" placeholder="輸入姓名" maxlength="10" onkeydown="if(event.key==='Enter')addStaff()">
      <button class="btn btn-sage" onclick="addStaff()">＋ 新增</button>
    </div>
    <div class="divider"></div>
    <p class="tip">預設高亮週次（每隔一週背景上色，對應原表格的綠色行）</p>
  </div>

</div>

<!-- ══ EDIT MODAL ══ -->

function changeMonth(d) {

function renderCleanCal() {

function renderDishCal() {

function renderWeekdayCal(bodyId, year, month, type) {
  const body = document.getElementById(bodyId);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();

  const firstDay = new Date(year, month, 1);
  const firstDow = firstDay.getDay();
  const offsetFromMon = (firstDow === 0) ? 6 : firstDow - 1;

  let html = '';
  let currentDate = new Date(year, month, 1 - offsetFromMon);

  const lastDay = new Date(year, month, daysInMonth);
  const lastDow = lastDay.getDay();
  const offsetFromFri = (lastDow === 0) ? 2 : (lastDow <= 5 ? 5 - lastDow : 0);
  const endDate = new Date(year, month, daysInMonth + offsetFromFri);

  while(currentDate <= endDate) {
    const dow = currentDate.getDay();
    if(dow >= 1 && dow <= 5) {
      const isCurrentMonth = (currentDate.getFullYear()===year && currentDate.getMonth()===month);
      const day = currentDate.getDate();
      const key = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${day}`;
      const isToday = (currentDate.getFullYear()===today.getFullYear() &&
                       currentDate.getMonth()===today.getMonth() &&
                       currentDate.getDate()===today.getDate());

      const weekIndex = getWeekIndex(currentDate, year, month);
      const hl = (weekIndex % 2 === 1);

      let cls = '';
      if(!isCurrentMonth) cls = 'other-month';
      else if(isToday) cls = 'today';
      else if(hl) cls = 'highlighted';

      let content = '';
      if(isCurrentMonth && type==='clean') {
        const cd = cleanData[key]||{};
        if(cd.glass) content += `<div class="task-line">玻璃\n${cd.glass}</div>`;
        if(cd.juice||cd.floor) content += `<div class="task-line">果汁：${cd.juice||'-'}\n刷地：${cd.floor||'-'}</div>`;
        if(cd.toilet) content += `<div class="task-line">${cd.toilet}</div>`;
      }

      html += `<div class="cal-cell ${cls}">
        <span class="date-num">${day}</span>
        ${content}
        ${isCurrentMonth ? `<button class="edit-btn" onclick='openEditModal("${type}","${key}","${day}")'>編輯</button>` : ''}
      </div>`;
    }
    currentDate = new Date(currentDate.getTime() + 86400000);
  }
  body.innerHTML = html;
}

function getWeekIndex(date, refYear, refMonth) {
  const firstDay = new Date(refYear, refMonth, 1);
  const firstDow = firstDay.getDay();
  const offsetFromMon = (firstDow === 0) ? 6 : firstDow - 1;
  const weekStart = new Date(refYear, refMonth, 1 - offsetFromMon);
  const diff = date - weekStart;
  return Math.floor(diff / (7 * 86400000));
}

function renderFullCal(bodyId, year, month, type) {
  const body = document.getElementById(bodyId);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const today = new Date();
  let html = '';
  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for(let i=0; i<totalCells; i++) {
    const weekRow = Math.floor(i/7);
    const hl = (weekRow%2===1);
    if(i < firstDay) {
      const d = prevDays - firstDay + i + 1;
      html += `<div class="cal-cell other-month ${hl?'highlighted':''}"><span class="date-num">${d}</span></div>`;
    } else if(i >= firstDay + daysInMonth) {
      const d = i - firstDay - daysInMonth + 1;
      html += `<div class="cal-cell other-month ${hl?'highlighted':''}"><span class="date-num">${d}</span></div>`;
    } else {
      const day = i - firstDay + 1;
      const dow = i % 7;
      const isToday = (year===today.getFullYear() && month===today.getMonth() && day===today.getDate());
      const isWeekend = dow===0||dow===6;
      const key = `${year}-${month}-${day}`;
      let cls = '';
      if(isToday) cls='today'; else if(hl) cls='highlighted'; else if(isWeekend) cls='weekend';

      let content = '';
      const dd = dishData[key]||'';
      if(dd) {
        if(dd==='店休') content=`<div class="closed-label">店休</div>`;
        else content=`<div class="task-line"><b>${dd}</b></div>`;
      }
      html += `<div class="cal-cell ${cls}">
        <span class="date-num">${day}</span>
        ${content}
        <button class="edit-btn" onclick='openEditModal("${type}","${key}","${day}")'>編輯</button>
      </div>`;
    }
  }
  body.innerHTML = html;
}

// ══════════════════════════════════════════
//  SHIFT TABLE
// ══════════════════════════════════════════
function changeShiftMonth(d) {
  shiftMonth += d;
  if(shiftMonth>11){shiftMonth=0;shiftYear++;}
  if(shiftMonth<0){shiftMonth=11;shiftYear--;}
  document.getElementById('shiftMonthLabel').textContent=`${shiftYear} 年 ${shiftMonth+1} 月`;
  document.getElementById('shiftTableTitle').textContent=`${shiftYear}年${shiftMonth+1}月份`;
  renderShiftTable();
}

function renderShiftTable() {
  const daysInMonth = new Date(shiftYear, shiftMonth+1, 0).getDate();
  const rows = [];
  for(let d=1; d<=daysInMonth; d++) {
    const key = `${shiftYear}-${shiftMonth}-${d}`;
    const sd = shiftData[key]||{};
    const dow = new Date(shiftYear, shiftMonth, d).getDay();
    const weekName = `週${WEEKDAYS[dow]}`;
    rows.push({d, key, dow, weekName, ...sd});
  }
  const half = Math.ceil(rows.length/2);
  const left = rows.slice(0,half);
  const right = rows.slice(half);

  let html = '';
  const maxRows = Math.max(left.length, right.length);
  for(let i=0;i<maxRows;i++) {
    const l=left[i], r=right[i];
    html += `<tr>`;
    if(l) html += buildShiftCells(l);
    else html += `<td colspan="6"></td>`;
    html += `<td style="width:8px;background:#e8e8e8;"></td>`;
    if(r) html += buildShiftCells(r);
    else html += `<td colspan="6"></td>`;
    html += `</tr>`;
  }
  document.getElementById('shiftBody').innerHTML = html;
}

function buildShiftCells(row) {
  if(row.closed) {
    return `
      <td><b>${row.d}.</b></td>
      <td>(${row.weekName})</td>
      <td class="closed-cell">店休</td>
      <td class="closed-cell" colspan="3">店休</td>`;
  }
  const openerColor = row.opener?`opener-${row.opener}`:'';
  return `
    <td><b>${row.d}.</b></td>
    <td>(${row.weekName})</td>
    <td>
      <button class="opener-badge ${openerColor}"
        onclick="cycleOpener('${row.key}',this)"
        title="點擊切換開店人員"
      >${row.opener||'　'}</button>
    </td>
    <td class="open-cell">
      <input value="${row.duty||''}" placeholder="當天值班人員"
        onblur="saveShiftField('${row.key}','duty',this.value)">
    </td>
    <td>
      <input value="${row.at20||''}" placeholder="20:00" style="width:70px;"
        onblur="saveShiftField('${row.key}','at20',this.value)">
    </td>
    <td>
      <input value="${row.close||''}" placeholder="關帳" style="width:60px;"
        onblur="saveShiftField('${row.key}','close',this.value)">
    </td>`;
}

function saveShiftField(key, field, value) {
  if(!shiftData[key]) shiftData[key]={};
  shiftData[key][field] = value;
}

function cycleOpener(key, btn) {
  const opts = ['可','郭','俐','菟','宣','若'];
  if(!shiftData[key]) shiftData[key]={};
  const cur = shiftData[key].opener||'';
  const idx = opts.indexOf(cur);
  const next = opts[(idx+1)%opts.length];
  shiftData[key].opener = next;
  btn.textContent = next||'　';
  btn.className = `opener-badge opener-${next}`;
}

      </div>
      <div class="form-group">
        <label>🧹 刷地負責人</label>
        <input id="m_floor" value="${cd.floor||''}" placeholder="人員姓名">
      </div>
      <div class="form-group">
        <label>🚽 廁所負責人</label>
        <textarea id="m_toilet" rows="2" placeholder="廁所：OO\n刷地：OO">${cd.toilet||''}</textarea>
      </div>
      <div class="form-group">
        <label>🪟 玻璃（白天/晚上）</label>
        <textarea id="m_glass" rows="2" placeholder="白天：OO\n晚上：OO">${cd.glass||''}</textarea>
      </div>`;
  } else if(type==='dish') {
    const dd = dishData[key]||'';
    title.textContent = `洗餐具 — ${cleanYear}年${cleanMonth+1}月${day}日`;
    content.innerHTML = `
      <div class="form-group">
        <label>今日洗餐具人員</label>
        <div class="staff-checkboxes" id="dishCheckboxes">
          ${staff.map(s=>`
            <label class="staff-checkbox ${dd===s?'checked':''}">
              <input type="radio" name="dish_staff" value="${s}" ${dd===s?'checked':''} onchange="updateCheck(this)"> ${s}
            </label>`).join('')}
          <label class="staff-checkbox ${dd==='店休'?'checked':''}">
            <input type="radio" name="dish_staff" value="店休" ${dd==='店休'?'checked':''} onchange="updateCheck(this)"> 店休
          </label>
        </div>
      </div>
      <div class="form-group">
        <label>或手動輸入</label>
        <input id="m_dish_manual" value="${dd}" placeholder="手動輸入">
      </div>`;
  }
  modal.classList.add('open');
}

function updateCheck(radio) {
  document.querySelectorAll('.staff-checkbox').forEach(lbl => lbl.classList.remove('checked'));
  radio.closest('.staff-checkbox').classList.add('checked');
  document.getElementById('m_dish_manual').value = radio.value;
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  modalContext = null;
}

function saveModal() {
  if(!modalContext) return;
  const {type, key} = modalContext;
  if(type==='clean') {
    cleanData[key] = {
      juice: document.getElementById('m_juice').value.trim(),
      floor: document.getElementById('m_floor').value.trim(),
      toilet: document.getElementById('m_toilet').value.trim(),
      glass: document.getElementById('m_glass').value.trim(),
    };
    renderCleanCal();
  } else if(type==='dish') {
    const manual = document.getElementById('m_dish_manual').value.trim();
    dishData[key] = manual;
    renderDishCal();
  }
  closeModal();
}
