    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.25s ease forwards; }
    
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    .toast-enter { animation: toastIn 0.3s ease forwards; }

    useEffect(() => {
      const t1 = setTimeout(() => setExiting(true), 2200);
      const t2 = setTimeout(() => onDone(), 2500);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }, []);
    const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-500' : 'bg-gray-800';
    return (
      <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[999] ${bg} text-white text-sm font-medium px-5 py-3 rounded-full shadow-lg pointer-events-none ${exiting ? 'toast-exit' : 'toast-enter'}`}>

      return () => document.removeEventListener('mousedown', h);
    }, []);

  const CustomKeypad = ({ activeId, onKeyPress, onClose, onNext }) => {
    if (!activeId) return null;
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
    
    const handleKeyClick = (e, k) => {
      e.preventDefault();
      e.stopPropagation();
      onKeyPress(k);
    };

    return (
      <div className="fixed bottom-0 left-0 right-0 bg-gray-200 z-[100] pb-1 shadow-[0_-10px_20px_rgba(0,0,0,0.15)] slide-up rounded-t-2xl border-t border-gray-300">
        <div className="flex justify-between items-center px-4 py-2 bg-gray-100 rounded-t-2xl border-b border-gray-300">
          <span className="text-xs font-bold text-gray-500">數量輸入</span>
          <div className="flex gap-2">
            <button onMouseDown={(e) => { e.preventDefault(); onNext(); }} className="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow-sm active:bg-blue-700 flex items-center">下一列 ⏭</button>
            <button onMouseDown={(e) => { e.preventDefault(); onClose(); }} className="px-4 py-1.5 bg-gray-500 text-white text-xs font-bold rounded-lg shadow-sm active:bg-gray-600 flex items-center">完成 🔽</button>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-1.5 p-2 bg-gray-200 max-w-md mx-auto">
          {keys.map(k => (
            <button key={k} onMouseDown={(e) => handleKeyClick(e, k)} className="bg-white py-2.5 text-xl font-bold rounded-lg shadow-sm active:bg-gray-100 active:scale-95 transition-transform flex items-center justify-center text-gray-800">
              {k}
            </button>
          ))}
        </div>
      </div>
    );
  };

  // ── StockCard (加入 Stepper 與視覺防呆) ──
  const StockCard = ({ item, onUpdate, systemStock, activeInputId, onFocusInput }) => {
    const countStr = item.actualCount ?? '';
    const hasCounted = countStr !== '';
    const count = parseFloat(countStr);
    const isLow = !isNaN(count) && count < item.alertLevel;

    const sysStock = systemStock !== undefined ? systemStock : item.systemStock;

    let varianceText = '尚未輸入', varianceColor = 'text-gray-400', isAbnormal = false;
    if (hasCounted && !isNaN(count)) {
      const v = count - sysStock;
      const pct = Math.abs(v) / (sysStock || 1);
      isAbnormal = pct > 0.05 && sysStock > 0;
      varianceText = v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
      varianceColor = isAbnormal ? 'text-orange-600 font-bold' : 'text-gray-600';
    }

    const lastCount = item.lastCount;
    const hasLast = lastCount !== undefined && lastCount !== null && lastCount !== '';
    const lastVal = parseFloat(lastCount);
    let trendEl = null;
    if (hasLast && !isNaN(lastVal) && !isNaN(count)) {
      const diff = count - lastVal;
      if (diff > 0) trendEl = <span className="text-emerald-600 flex items-center gap-0.5"><TrendingUp className="w-3 h-3"/>+{diff.toFixed(1)}</span>;
      else if (diff < 0) trendEl = <span className="text-red-500 flex items-center gap-0.5"><TrendingDown className="w-3 h-3"/>{diff.toFixed(1)}</span>;
      else trendEl = <span className="text-gray-400">持平</span>;
    }

    let border = 'border-gray-200';
    if (isLow) border = 'border-red-500';
    else if (isAbnormal) border = 'border-orange-500';
    else if (hasCounted) border = 'border-green-500';

    const cardBg = hasCounted ? 'bg-slate-50 border-slate-200 opacity-75' : 'bg-white border-blue-100 shadow-sm';
    const isActive = activeInputId === item.id;

    const handleStep = (delta) => {
      let current = parseFloat(countStr);
      if (isNaN(current)) current = 0;
      let next = Math.max(0, current + delta);
      next = Math.round(next * 10) / 10;
      onUpdate(item.id, String(next));
    };

    return (
      <div id={`stock-card-${item.id}`} className={`rounded-xl border-l-4 fade-in transition-all duration-300 ${cardBg} ${border}`}>
        <div className="p-4">
          <div className="flex justify-between items-start mb-2">
            <div>
              <h3 className="font-bold text-gray-800 text-base">{item.name}</h3>
              <p className="text-xs text-gray-400 mt-0.5">{item.spec} · 安全線: {item.alertLevel}</p>
            </div>
          </div>

          <div className="flex flex-col gap-2">
            <div className={`flex-1 rounded-lg p-2 flex justify-between items-center transition-colors ${isActive ? 'bg-blue-50' : 'bg-white'}`}>
              <span className="text-xs text-gray-500 font-medium whitespace-nowrap">盤點數量</span>
              
              <div className="flex items-center gap-1.5 ml-2">
                <button onClick={() => handleStep(-1)} className="w-8 h-8 rounded-lg bg-gray-100 text-gray-600 font-bold text-lg flex items-center justify-center active:bg-gray-200">-</button>
                
                <input 
                  type="text" 
                  inputMode="none"
                  readOnly
                  placeholder="輸入.."
                  value={countStr}
                  onClick={() => onFocusInput(item.id)}
                  className={`w-[72px] px-2 py-1.5 bg-white border rounded-md text-center font-bold text-base focus:outline-none transition-all cursor-pointer ${isActive ? 'border-blue-500 ring-2 ring-blue-500 text-blue-700' : isLow ? 'border-red-300 text-red-600' : 'border-gray-300 text-gray-800'}`}
                />
                
                <button onClick={() => handleStep(1)} className="w-8 h-8 rounded-lg bg-gray-100 text-gray-600 font-bold text-lg flex items-center justify-center active:bg-gray-200">+</button>
                <span className="text-sm text-gray-500 ml-1 w-4 shrink-0">{item.unit}</span>
              </div>
            </div>

            {hasLast && (
              <div className="flex justify-between items-center text-xs px-1 py-1 bg-indigo-50/50 rounded-lg">
                <span className="text-indigo-500 flex items-center gap-1">
                  <History className="w-3 h-3"/> 上次 {lastVal} {item.unit} {item.lastDate && <span className="text-indigo-300 ml-1">({item.lastDate})</span>}
                </span>
                {trendEl && <span className="text-xs font-medium flex items-center gap-0.5">{trendEl}</span>}
              </div>
            )}

            <div className={`flex justify-between items-center text-xs px-1 ${isAbnormal ? 'bg-orange-50 p-1.5 rounded' : ''}`}>
              <span className="text-gray-500">帳面庫存：{sysStock}</span>
              <span className="flex items-center">盤差：<span className={varianceColor}>{varianceText}</span>{isAbnormal && <AlertCircle className="w-3 h-3 text-orange-500 ml-1"/>}</span>
            </div>
          </div>
          {isLow && <div className="mt-2 flex items-center text-xs font-medium text-red-600"><AlertCircle className="w-3.5 h-3.5 mr-1"/>低於安全警戒，需叫貨</div>}
        </div>
      </div>
    );
  };

  // ✨ ── 進貨登記 Modal (支援顯示「今日」紀錄) ──
  const RestockModal = ({ onClose, systemStockMap, onRestock, showToast, getLatestRecord }) => {
    const [selectedItem, setSelectedItem] = useState(null);
    const [searchQuery, setSearchQuery] = useState('');
    const [isDropdownOpen, setIsDropdownOpen] = useState(false);
    const [restockQty, setRestockQty] = useState('');
    const [newTotal, setNewTotal] = useState('');
    const [mode, setMode] = useState('add');
    const [isLoading, setIsLoading] = useState(false);
    const [log, setLog] = useState([]);

    const filteredItems = useMemo(() => {
      if (!searchQuery) return initialInventory;
      return initialInventory.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()));
    }, [searchQuery]);

    const curStock = selectedItem ? (systemStockMap[selectedItem.id] ?? selectedItem.systemStock) : null;
    const lastRecord = selectedItem && getLatestRecord ? getLatestRecord(selectedItem.id) : null;
    const baseStock = selectedItem ? (lastRecord && !isNaN(parseFloat(lastRecord.count)) ? parseFloat(lastRecord.count) : curStock) : null;
    const todayStr = getTodayStr();

    const handleSelectItem = (item) => {
      setSelectedItem(item); setSearchQuery(item.name); setIsDropdownOpen(false); setRestockQty('');
      const cur = systemStockMap[item.id] ?? item.systemStock; setNewTotal(String(cur));
    };

    const handleConfirm = async () => {
      if (!selectedItem) return;
      
      let finalVal;
      if (mode === 'add') {
        const qty = parseFloat(restockQty);
        if (isNaN(qty) || qty <= 0) { showToast('請輸入有效的進貨數量', 'error'); return; }
        finalVal = parseFloat((baseStock + qty).toFixed(2));
      } else {
        const v = parseFloat(newTotal);
        if (isNaN(v) || v < 0) { showToast('請輸入有效的帳面數值', 'error'); return; }
        finalVal = v;
      }

      setIsLoading(true);
      try {
        const { error } = await supabase.from('system_stock_overrides').upsert({
          item_id: selectedItem.id, stock_value: finalVal, updated_at: new Date().toISOString()
        }, { onConflict: 'item_id' });
        if (error) throw error;

        onRestock(selectedItem.id, finalVal);
        setLog(prev => [{ 
          name: selectedItem.name, unit: selectedItem.unit, before: mode === 'add' ? baseStock : curStock, 
          after: finalVal, mode, qty: mode === 'add' ? parseFloat(restockQty) : null 
        }, ...prev]);
        
        showToast(`「${selectedItem.name}」帳面已更新為 ${finalVal} ${selectedItem.unit}`);
        setSelectedItem(null); setSearchQuery(''); setRestockQty(''); setNewTotal('');
      } catch (err) {
        console.error(err); showToast('更新失敗，請稍後再試', 'error');
      } finally { setIsLoading(false); }
    };

    const previewVal = useMemo(() => {
      if (!selectedItem) return null;
      if (mode === 'add') {
        const qty = parseFloat(restockQty);
        if (isNaN(qty)) return null;
        return parseFloat((baseStock + qty).toFixed(2));
      } else {
        const v = parseFloat(newTotal); return isNaN(v) ? null : v;
      }
    }, [selectedItem, mode, restockQty, newTotal, baseStock]);

    return (
      <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm fade-in">
        <div className="bg-white w-full h-[100dvh] sm:h-auto sm:max-h-[90vh] sm:rounded-2xl shadow-xl max-w-md overflow-hidden flex flex-col">
          <div className="bg-emerald-600 text-white p-4 flex justify-between items-center flex-shrink-0">
            <h2 className="text-lg font-bold flex items-center gap-2"><PackagePlus className="w-5 h-5"/>進貨 / 更新帳面庫存</h2>
            <button onClick={onClose} className="hover:bg-emerald-700 p-1 rounded-full"><X className="w-5 h-5"/></button>
          </div>
          <div className="p-4 overflow-y-auto flex-1 custom-scrollbar space-y-4">
            <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-700 leading-relaxed">
              進貨數量將優先以「上次實際盤點量」作為加總基準，確保帳面精準。
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-500 mb-1.5">選擇品項</label>
              <div className="relative z-20">
                <input type="text" placeholder="輸入品名搜尋..." value={searchQuery}
                  onChange={e => { setSearchQuery(e.target.value); setSelectedItem(null); setIsDropdownOpen(true); }}
                  onFocus={() => setIsDropdownOpen(true)}
                  className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-sm font-medium"
                />
                {isDropdownOpen && <div className="fixed inset-0 z-10" onClick={() => setIsDropdownOpen(false)}/>}
                {isDropdownOpen && (
                  <div className="relative mt-1.5 bg-white border border-gray-100 rounded-xl shadow-lg max-h-52 overflow-y-auto custom-scrollbar z-20">
                    {filteredItems.length > 0 ? filteredItems.map(item => (
                      <div key={item.id} onClick={() => handleSelectItem(item)}
                        className="px-4 py-2.5 hover:bg-emerald-50 cursor-pointer border-b border-gray-50 last:border-0 flex justify-between items-center text-sm">
                        <span className="font-bold text-gray-800">{item.name}</span>
                        <span className="text-xs text-gray-400">{systemStockMap[item.id] ?? item.systemStock} {item.unit}</span>
                      </div>
                    )) : <div className="px-4 py-4 text-center text-gray-400 text-sm">找不到品項</div>}
                  </div>
                )}
              </div>
            </div>

            {selectedItem && (
              <div className="fade-in space-y-3">
                <div className="bg-gray-50 border border-gray-200 rounded-xl p-3 space-y-2">
                  <div className="flex justify-between items-center text-sm">
                    <span className="text-gray-500">上次實際盤點</span>
                    <span className="font-bold text-gray-800">
                      {lastRecord && !isNaN(parseFloat(lastRecord.count)) ? lastRecord.count : '無紀錄'}
                      {lastRecord && <span className="text-xs font-normal text-gray-400 ml-1">({lastRecord.date === todayStr ? '今日' : lastRecord.date})</span>}
                    </span>
                  </div>
                  <div className="flex justify-between items-center text-sm">
                    <span className="text-gray-500">目前帳面庫存</span>
                    <span className="font-bold text-gray-800">{curStock}</span>
                  </div>
                  <div className="mt-2 pt-2 border-t border-gray-200 flex justify-between items-center">
                    <span className="text-xs font-bold text-emerald-600 flex items-center">
                      <AlertCircle className="w-3 h-3 mr-1"/> 加總計算基準
                    </span>
                    <span className="font-bold text-emerald-700">
                      {baseStock} <span className="text-xs font-normal text-emerald-600">{selectedItem.unit}</span>
                    </span>
                  </div>
                </div>

                <div className="flex rounded-xl overflow-hidden border border-gray-200">
                  <button onClick={() => setMode('add')} className={`flex-1 py-2 text-sm font-bold transition-colors ${mode === 'add' ? 'bg-emerald-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>＋ 加入進貨量</button>
                  <button onClick={() => setMode('set')} className={`flex-1 py-2 text-sm font-bold transition-colors ${mode === 'set' ? 'bg-emerald-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>✎ 直接設定</button>
                </div>

                {mode === 'add' ? (
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1.5">本次進貨數量（{selectedItem.unit}）</label>
                    <input type="number" inputMode="decimal" step="0.1" min="0" placeholder="例如：5" value={restockQty} onChange={e => setRestockQty(e.target.value)}
                      className="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-bold text-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-emerald-50/30 text-center" />
                  </div>
                ) : (
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1.5">設定新帳面庫存（{selectedItem.unit}）</label>
                    <input type="number" inputMode="decimal" step="0.1" min="0" value={newTotal} onChange={e => setNewTotal(e.target.value)}
                      className="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-bold text-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-emerald-50/30 text-center" />
                  </div>
                )}
                {previewVal !== null && (
                  <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex justify-between items-center fade-in">
                    <span className="text-sm text-emerald-700">更新後帳面</span>
                    <span className="text-lg font-bold text-emerald-700">{mode === 'add' ? baseStock : curStock} → <span className="text-emerald-600">{previewVal}</span><span className="text-sm font-normal ml-1">{selectedItem.unit}</span></span>
                  </div>
                )}
              </div>
            )}
            {log.length > 0 && (
              <div className="fade-in pb-4">
                <p className="text-xs font-bold text-gray-400 mb-2">本次更新紀錄</p>
                <div className="space-y-1.5">
                  {log.map((l, i) => (
                    <div key={i} className="bg-gray-50 rounded-lg px-3 py-2 flex justify-between items-center text-xs">
                      <span className="font-bold text-gray-700">{l.name}</span>
                      <span className="text-gray-500">{l.before} → <span className="text-emerald-600 font-bold">{l.after}</span> {l.unit} {l.mode === 'add' && <span className="text-emerald-400 ml-1">(+{l.qty})</span>}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
          <div className="p-4 border-t border-gray-100 bg-white flex gap-3 flex-shrink-0">
            <button onClick={onClose} className="flex-1 py-3 bg-white border-2 border-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors">關閉</button>
            <button onClick={handleConfirm} disabled={!selectedItem || isLoading || (mode === 'add' ? !restockQty : !newTotal)} className="flex-[2] py-3 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm flex items-center justify-center gap-2">
              {isLoading ? '更新中...' : <><PackagePlus className="w-4 h-4"/>確認更新帳面</>}
            </button>
          </div>
        </div>
      </div>
    );
  };

  // ── App 主程式 ──
  function App() {
    const [isDBLoading, setIsDBLoading] = useState(true);
    const [activeTab, setActiveTab] = useState('record');
    const [historyData, setHistoryData] = useState({});
    const [calendarMonth, setCalendarMonth] = useState(new Date());
    const [selectedHistoryDate, setSelectedHistoryDate] = useState(null);
    const [searchQuery, setSearchQuery] = useState('');
    const [isDropdownOpen, setIsDropdownOpen] = useState(false);
    const [selectedItem, setSelectedItem] = useState(null);
    const [inputValue, setInputValue] = useState('');
    const [showOrderModal, setShowOrderModal] = useState(false);
    const [showRestockModal, setShowRestockModal] = useState(false);
    const [toast, setToast] = useState(null);
    const [systemStockMap, setSystemStockMap] = useState({});
    
    const [activeInputId, setActiveInputId] = useState(null);

    const todayStr = getTodayStr();
    const todayCounts = useMemo(() => historyData[todayStr] || [], [historyData, todayStr]);

    const showToast = useCallback((msg, type = 'success') => setToast({ msg, type, key: Date.now() }), []);

    // ✨ 新增：取得「不含今日」的歷史紀錄 (給盤點卡片的歷史對比用)
    const getPreviousRecord = useCallback((itemId) => {
      const dates = Object.keys(historyData).filter(d => d !== todayStr && historyData[d].some(i => i.id === itemId && i.actualCount !== '')).sort().reverse();
      if (dates.length === 0) return null;
      const lastDate = dates[0];
      const entry = historyData[lastDate].find(i => i.id === itemId);
      return entry ? { count: entry.actualCount, date: lastDate } : null;
    }, [historyData, todayStr]);

    // ✨ 新增：取得「包含今日」的最新紀錄 (給進貨系統做計算基準用)
    const getLatestRecord = useCallback((itemId) => {
      const dates = Object.keys(historyData).filter(d => historyData[d].some(i => i.id === itemId && i.actualCount !== '')).sort().reverse();
      if (dates.length === 0) return null;
      const lastDate = dates[0];
      const entry = historyData[lastDate].find(i => i.id === itemId);
      return entry ? { count: entry.actualCount, date: lastDate } : null;
    }, [historyData]);

    useEffect(() => {
      const fetchAll = async () => {
        try {
          const { data: records, error: e1 } = await supabase.from('inventory_records').select('*');
          if (e1) throw e1;
          const { data: overrides, error: e2 } = await supabase.from('system_stock_overrides').select('*');
          setSystemStockMap(buildSystemStockMap(e2 ? null : overrides));
          const hData = {};
          if (records) {
            records.forEach(row => {
              const itemDef = initialInventory.find(i => i.id === row.item_id);
              if (itemDef) {
                if (!hData[row.record_date]) hData[row.record_date] = [];
                hData[row.record_date].push({ ...itemDef, actualCount: row.actual_count !== null ? row.actual_count : '' });
              }
            });
          }
          setHistoryData(hData);
        } catch (err) {
          console.error("資料庫連線失敗:", err); showToast("無法連線到雲端資料庫", "error");
          setSystemStockMap(buildSystemStockMap(null));
        } finally { setIsDBLoading(false); }
      };

      if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
        alert("⚠️ 開發者提示：請先設定 SUPABASE_URL");
        setSystemStockMap(buildSystemStockMap(null)); setIsDBLoading(false);
      } else { fetchAll(); }
    }, [showToast]);

    useEffect(() => { setActiveInputId(null); }, [activeTab]);

    useEffect(() => {
      if (activeInputId) {
        const el = document.getElementById(`stock-card-${activeInputId}`);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
      }
    }, [activeInputId]);

    const handleRestock = useCallback((itemId, newVal) => { setSystemStockMap(prev => ({ ...prev, [itemId]: newVal })); }, []);

    const filteredItems = useMemo(() => {
      if (!searchQuery) return initialInventory;
      return initialInventory.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()) || (i.tag && i.tag.includes(searchQuery)));
    }, [searchQuery]);

    const handleSelectItem = (item) => {
      setSelectedItem(item); setSearchQuery(item.name); setIsDropdownOpen(false); setInputValue('');
    };

    const handleAddRecord = async () => {
      if (!selectedItem || inputValue === '') return;
      const count = parseFloat(inputValue);
      if (isNaN(count)) return;
      const newItem = { ...selectedItem, actualCount: count };
      setHistoryData(prev => {
        const list = [...(prev[todayStr] || [])];
        const idx = list.findIndex(i => i.id === selectedItem.id);
        if (idx >= 0) list.splice(idx, 1);
        return { ...prev, [todayStr]: [newItem, ...list] };
      });
      showToast(`已記錄「${selectedItem.name}」`);
      setSelectedItem(null); setSearchQuery(''); setInputValue('');
      await supabase.from('inventory_records').upsert({ record_date: todayStr, item_id: newItem.id, actual_count: count }, { onConflict: 'record_date, item_id' });
    };

    // ✨ 修正邏輯：直接替換整個清單，但「自動保留」畫面或資料庫中已輸入過的心血
    const handleQuickLoad = async (tag) => {
      const items = initialInventory.filter(i => i.tag === tag);
      
      // 步驟 1：向資料庫要最新的今日紀錄，確保不覆蓋剛存在雲端的數據
      const { data: todayRecords } = await supabase
        .from('inventory_records')
        .select('item_id, actual_count')
        .eq('record_date', todayStr);
        
      const dbCountMap = {};
      if (todayRecords) {
        todayRecords.forEach(r => {
          if (r.actual_count !== null) dbCountMap[r.item_id] = r.actual_count;
        });
      }

      // 步驟 2：替換畫面清單
      let newListForDB = [];
      setHistoryData(prev => {
        const currentList = prev[todayStr] || [];
        const localCountMap = {};
        // 抓取畫面上還沒按 F5 但已經輸入的數字
        currentList.forEach(i => { if (i.actualCount !== '') localCountMap[i.id] = i.actualCount; });
        
        const newList = items.map(item => {
          let count = '';
          if (localCountMap[item.id] !== undefined) count = localCountMap[item.id]; // 優先以剛輸入為主
          else if (dbCountMap[item.id] !== undefined) count = dbCountMap[item.id];  // 其次看資料庫
          return { ...item, actualCount: count };
        });
        
        newListForDB = newList;
        return { ...prev, [todayStr]: newList };
      });

      // 步驟 3：只把清單裡的「未填寫項」寫為 null 佔位，維持資料庫同步，完全不清除既有數字
      if (newListForDB.length > 0) {
        const dbUpserts = newListForDB.map(item => ({
          record_date: todayStr,
          item_id: item.id,
          actual_count: item.actualCount !== '' ? parseFloat(item.actualCount) : null
        }));
        await supabase.from('inventory_records').upsert(dbUpserts, { onConflict: 'record_date, item_id' });
      }
    };

    const handleUpdateListItem = async (id, val) => {
      setHistoryData(prev => ({ ...prev, [todayStr]: (prev[todayStr] || []).map(i => i.id === id ? { ...i, actualCount: val } : i) }));
      const count = parseFloat(val);
      await supabase.from('inventory_records').upsert({ record_date: todayStr, item_id: id, actual_count: isNaN(count) ? null : count }, { onConflict: 'record_date, item_id' });
    };

    const handleKeypadPress = (key) => {
      if (!activeInputId) return;
      const item = todayCounts.find(i => i.id === activeInputId);
      if (!item) return;
      
      let currentStr = String(item.actualCount ?? '');
      
      if (key === '⌫') {
        currentStr = currentStr.slice(0, -1);
      } else if (key === '.') {
        if (!currentStr.includes('.')) currentStr += '.';
      } else {
        currentStr += key;
      }
      handleUpdateListItem(activeInputId, currentStr);
    };

    const handleKeypadNext = () => {
      const idx = todayCounts.findIndex(i => i.id === activeInputId);
      if (idx >= 0 && idx < todayCounts.length - 1) {
        setActiveInputId(todayCounts[idx + 1].id);
      } else {
        setActiveInputId(null);
      }
    };

    const handleExportCSV = () => {
      let csv = "\uFEFF品名,規格,標籤,帳面庫存,實際盤點,盤差,單位\n";
      initialInventory.forEach(item => {
        const sysStock = systemStockMap[item.id] ?? item.systemStock;
        const c = todayCounts.find(i => i.id === item.id);
        const actual = c && c.actualCount !== '' ? c.actualCount : '未盤點';
        const v = c && c.actualCount !== '' && !isNaN(parseFloat(c.actualCount)) ? (parseFloat(c.actualCount) - sysStock).toFixed(1) : '';
        csv += `${item.name},${item.spec||''},${item.tag},${sysStock},${actual},${v},${item.unit}\n`;
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      link.download = `庫存總表_${getTodayStr()}.csv`; link.style.visibility = 'hidden';
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };

    const handleCopyAndLine = async () => {
      let text = `【${getTodayStr()} 叫貨清單】\n\n`;
      orderList.forEach(i => { text += `▪ ${i.name}：剩 ${i.actualCount} ${i.unit}\n`; });
      try { await navigator.clipboard.writeText(text); showToast('已複製！可直接貼到 LINE'); } 
      catch { window.open(`line://msg/text/${encodeURIComponent(text)}`, '_blank'); }
    };

    const orderList = useMemo(() => todayCounts.filter(i => { const c = parseFloat(i.actualCount); return !isNaN(c) && c < i.alertLevel; }), [todayCounts]);
    const countedNum = useMemo(() => todayCounts.filter(i => i.actualCount !== '').length, [todayCounts]);

    const prevMonth = () => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1));
    const nextMonth = () => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1));

    const renderCalendar = () => {
      const y = calendarMonth.getFullYear(), m = calendarMonth.getMonth();
      const firstDay = new Date(y, m, 1).getDay(), days_in = new Date(y, m+1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(<div key={`e${i}`} className="h-10"/>);
      for (let i = 1; i <= days_in; i++) {
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const has = !!(historyData[ds] && historyData[ds].some(x => x.actualCount !== ''));
        const isToday = ds === todayStr, isSel = selectedHistoryDate === ds;
        cells.push(
          <div key={ds} onClick={() => has && setSelectedHistoryDate(ds)} className={`h-12 flex flex-col items-center justify-center rounded-xl transition-all ${has ? 'cursor-pointer hover:bg-blue-50' : 'cursor-default'} ${isSel ? 'bg-blue-100 ring-2 ring-blue-400' : ''} ${isToday && !isSel ? 'bg-gray-100' : ''}`}>
            <span className={`text-sm font-medium ${isToday ? 'text-blue-700' : has ? 'text-gray-800' : 'text-gray-400'}`}>{i}</span>
            {has && <div className="w-1.5 h-1.5 bg-blue-500 rounded-full mt-0.5"/>}
          </div>
        );
      }
      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
          <div className="flex justify-between items-center mb-4 px-2">
            <button onClick={prevMonth} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><ChevronLeft className="w-5 h-5"/></button>
            <h3 className="font-bold text-lg text-gray-800">{y}年 {calendarMonth.toLocaleString('zh-TW',{month:'long'})}</h3>
            <button onClick={nextMonth} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><ChevronRight className="w-5 h-5"/></button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center mb-2">
            {['日','一','二','三','四','五','六'].map(d=><div key={d} className="text-xs font-medium text-gray-400 py-1">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">{cells}</div>
        </div>
      );
    };

    if (isDBLoading) return <div className="min-h-screen flex items-center justify-center text-blue-600 font-bold bg-gray-50">連線雲端資料庫中...</div>;

    return (
      <div className={`min-h-screen flex flex-col ${activeInputId ? 'pb-60' : 'pb-24'}`}>
        <GlobalNav />
        {toast && <Toast key={toast.key} message={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

        <header className="bg-white shadow-sm sticky top-0 z-30">
          <div className="max-w-2xl mx-auto px-4 py-3 pl-16 flex justify-between items-center gap-2">
            <div className="flex items-center space-x-2 text-blue-700">
              <ClipboardList className="w-6 h-6"/>
              <h1 className="text-xl font-bold tracking-tight">庫存盤點</h1>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setShowRestockModal(true)} className="flex items-center space-x-1 bg-emerald-50 text-emerald-600 px-3 py-2 rounded-full font-medium hover:bg-emerald-100 transition-colors shadow-sm border border-emerald-200">
                <PackagePlus className="w-5 h-5"/><span className="hidden sm:inline text-sm">進貨</span>
              </button>
              <button onClick={() => setShowOrderModal(true)} className="flex items-center space-x-1 bg-red-50 text-red-600 px-3 py-2 rounded-full font-medium hover:bg-red-100 transition-colors shadow-sm border border-red-200">
                <ShoppingCart className="w-5 h-5"/><span className="hidden sm:inline text-sm">結算</span>
                {orderList.length > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">{orderList.length}</span>}
              </button>
            </div>
          </div>
          <div className="max-w-2xl mx-auto px-2 pb-0 flex border-b border-gray-200 bg-white relative z-10">
            {[{k:'record',l:'紀錄',I:ListPlus},{k:'history',l:'歷史',I:CalendarIcon},{k:'overview',l:'總表',I:BarChart2}].map(({k,l,I})=>(
              <button key={k} onClick={()=>{setActiveTab(k);if(k!=='history')setSelectedHistoryDate(null);}}
                className={`flex-1 py-3 text-sm font-medium border-b-2 transition-colors flex items-center justify-center gap-1.5 ${activeTab===k?'border-blue-600 text-blue-700':'border-transparent text-gray-500 hover:text-gray-700'}`}>
                <I className="w-4 h-4"/> {l}
              </button>
            ))}
          </div>
          {activeTab === 'record' && todayCounts.length > 0 && (
            <div className="max-w-2xl mx-auto px-4 py-2 bg-slate-50 border-b border-gray-200 shadow-inner">
              <div className="flex justify-between items-center mb-1.5">
                <span className="text-xs font-bold text-gray-500">今日盤點進度</span>
                <span className="text-xs font-bold text-blue-600">{countedNum} / {todayCounts.length} <span className="font-normal text-gray-400 ml-1">({Math.round(countedNum/todayCounts.length*100)}%)</span></span>
              </div>
              <div className="h-1.5 bg-gray-200 rounded-full overflow-hidden">
                <div className="h-full bg-blue-500 rounded-full transition-all duration-500" style={{width:`${Math.round(countedNum/todayCounts.length*100)}%`}}/>
              </div>
            </div>
          )}
        </header>

        <main className="flex-1 max-w-2xl w-full mx-auto px-4 py-6">
          {activeTab === 'record' && (
            <div className="space-y-6 fade-in">
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 className="text-sm font-bold text-gray-500 mb-3 flex items-center"><Search className="w-4 h-4 mr-1"/>搜尋新增盤點品項</h2>
                <div className="relative z-20">
                  <div className="relative">
                    <input type="text" placeholder="點擊展開選單，或輸入關鍵字..." value={searchQuery}
                      onChange={e=>{setSearchQuery(e.target.value);setSelectedItem(null);setIsDropdownOpen(true);}}
                      onFocus={()=>setIsDropdownOpen(true)}
                      className="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-base font-medium"/>
                    <div className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                      <ChevronDown className={`w-5 h-5 transition-transform duration-200 ${isDropdownOpen?'rotate-180':''}`}/>
                    </div>
                  </div>
                  {isDropdownOpen && <div className="fixed inset-0 z-10" onClick={()=>setIsDropdownOpen(false)}/>}
                  {isDropdownOpen && (
                    <div className="relative mt-2 bg-white border border-gray-100 rounded-xl shadow-lg max-h-60 overflow-y-auto custom-scrollbar z-20">
                      {filteredItems.length > 0 ? filteredItems.map(item=>(
                        <div key={item.id} onClick={()=>handleSelectItem(item)}
                          className="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0 flex justify-between items-center transition-colors">
                          <div><span className="font-bold text-gray-800 block">{item.name}</span><span className="text-xs text-gray-400 block mt-0.5">{item.spec||'無規格'}</span></div>
                          <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">{item.tag}</span>
                        </div>
                      )) : <div className="px-4 py-6 text-center text-gray-400 text-sm">找不到相關品項</div>}
                    </div>
                  )}
                </div>
                {!selectedItem && (
                  <div className="mt-4 flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                    <button onClick={()=>handleQuickLoad('每日')} className="whitespace-nowrap text-xs bg-blue-50 text-blue-700 px-3 py-2 rounded-lg font-bold hover:bg-blue-100 border border-blue-100 transition-colors">+ 載入「每日」盤點表</button>
                    <button onClick={()=>handleQuickLoad('每周')} className="whitespace-nowrap text-xs bg-emerald-50 text-emerald-700 px-3 py-2 rounded-lg font-bold hover:bg-emerald-100 border border-emerald-100 transition-colors">+ 載入「每周」盤點表</button>
                  </div>
                )}
                {selectedItem && (
                  <div className="mt-4 pt-4 border-t border-gray-100 flex items-end gap-3 fade-in">
                    <div className="flex-1">
                      <label className="block text-xs font-bold text-gray-500 mb-1.5">輸入數量 ({selectedItem.unit})</label>
                      <input type="number" inputMode="decimal" step="0.1" min="0" value={inputValue}
                        onChange={e=>setInputValue(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddRecord()}
                        placeholder={`帳面庫存: ${systemStockMap[selectedItem.id] ?? selectedItem.systemStock}`}
                        className="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-bold text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-blue-50/30"/>
                    </div>
                    <button onClick={handleAddRecord} disabled={inputValue===''}
                      className="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">加入</button>
                  </div>
                )}
              </div>

              <div>
                {todayCounts.length === 0 ? (
                  <div className="text-center py-12 bg-white rounded-2xl border border-gray-100 border-dashed">
                    <ClipboardList className="w-12 h-12 text-gray-300 mx-auto mb-2"/>
                    <p className="text-gray-400">目前還沒有紀錄<br/>請從上方搜尋並加入品項</p>
                  </div>
                ) : (
                  <div className="space-y-3 relative z-0">
                    {todayCounts.map(item => {
                      // ✨ 盤點卡片只對比「昨天(不含今日)」的紀錄，避免顯示永遠「持平」
                      const prev = getPreviousRecord(item.id);
                      return (
                        <StockCard key={item.id}
                          item={{ ...item, lastCount: prev?.count, lastDate: prev?.date }}
                          onUpdate={handleUpdateListItem}
                          systemStock={systemStockMap[item.id]}
                          activeInputId={activeInputId}
                          onFocusInput={setActiveInputId}
                        />
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {activeTab === 'history' && (
            <div className="fade-in">
              {renderCalendar()}
              {selectedHistoryDate && (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden fade-in">
                  <div className="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                    <h3 className="font-bold text-gray-800 flex items-center"><CalendarIcon className="w-4 h-4 mr-2 text-blue-600"/>{selectedHistoryDate} 盤點明細</h3>
                    <button onClick={()=>setSelectedHistoryDate(null)} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5"/></button>
                  </div>
                  <div className="divide-y divide-gray-50">
                    {(historyData[selectedHistoryDate]||[]).filter(i=>i.actualCount!=='').map(item=>{
                      const c=parseFloat(item.actualCount), isLow=!isNaN(c)&&c<item.alertLevel;
                      return (
                        <div key={item.id} className="p-4 flex justify-between items-center hover:bg-gray-50">
                          <div><div className="font-bold text-gray-800">{item.name}</div><div className="text-xs text-gray-400 mt-1">安全線: {item.alertLevel} {item.unit}</div></div>
                          <div className="text-right">
                            <div className={`font-bold text-lg ${isLow?'text-red-600':'text-green-600'}`}>{item.actualCount} <span className="text-sm font-normal text-gray-500">{item.unit}</span></div>
                            {isLow&&<div className="text-[10px] text-red-500 font-medium flex items-center justify-end mt-1"><AlertCircle className="w-3 h-3 mr-0.5"/>需叫貨</div>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {!selectedHistoryDate && <div className="text-center py-8 text-gray-400 text-sm">點擊日曆上有藍點的日期查看盤點明細</div>}
            </div>
          )}

          {activeTab === 'overview' && (
            <div className="fade-in">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4 flex justify-between items-center">
                <div>
                  <h2 className="font-bold text-gray-800">今日庫存總覽</h2>
                  <p className="text-xs text-gray-500 mt-1">已盤 {countedNum} / {initialInventory.length} 項（{Math.round(countedNum/initialInventory.length*100)}%）</p>
                </div>
                <button onClick={handleExportCSV} className="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-100 transition-colors border border-emerald-200">
                  <Download className="w-4 h-4"/>匯出報表
                </button>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left text-sm whitespace-nowrap">
                    <thead className="bg-gray-50 text-gray-600 font-medium border-b border-gray-100">
                      <tr><th className="px-4 py-3">品名</th><th className="px-4 py-3 text-right">帳面</th><th className="px-4 py-3 text-right">實盤</th><th className="px-4 py-3 text-right">盤差</th><th className="px-4 py-3 text-center">狀態</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-50">
                      {initialInventory.map(item=>{
                        const sysStock = systemStockMap[item.id] ?? item.systemStock;
                        const counted = todayCounts.find(i=>i.id===item.id);
                        const has = counted && counted.actualCount!=='';
                        const c = has ? parseFloat(counted.actualCount) : NaN;
                        let vt='-', vc='text-gray-400', badge=<span className="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded">未盤點</span>;
                        if (has && !isNaN(c)) {
                          const v=c-sysStock, pct=Math.abs(v)/(sysStock||1);
                          vt=v>0?`+${v.toFixed(1)}`:v.toFixed(1);
                          if (c<item.alertLevel) { vc='text-red-600 font-bold'; badge=<span className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded font-medium">缺貨</span>; }
                          else if (pct>0.05&&sysStock>0) { vc='text-orange-600 font-bold'; badge=<span className="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-medium">異常</span>; }
                          else { vc='text-gray-600'; badge=<span className="text-xs bg-green-100 text-green-600 px-2 py-1 rounded font-medium">正常</span>; }
                        }
                        return (
                          <tr key={item.id} className="hover:bg-gray-50 transition-colors">
                            <td className="px-4 py-3"><div className="font-bold text-gray-800">{item.name}</div><div className="text-[10px] text-gray-400">{item.unit}</div></td>
                            <td className="px-4 py-3 text-right text-gray-600">{sysStock}</td>
                            <td className="px-4 py-3 text-right font-bold text-gray-800">{has?c:'-'}</td>
                            <td className={`px-4 py-3 text-right ${vc}`}>{vt}</td>
                            <td className="px-4 py-3 text-center">{badge}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </main>

        {showOrderModal && (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm fade-in">
            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
              <div className="bg-red-600 text-white p-4 flex justify-between items-center">
                <h2 className="text-lg font-bold flex items-center"><ShoppingCart className="w-5 h-5 mr-2"/>今日需叫貨清單</h2>
                <button onClick={()=>setShowOrderModal(false)} className="text-white hover:bg-red-700 p-1 rounded-full"><X className="w-5 h-5"/></button>
              </div>
              <div className="p-4 overflow-y-auto flex-1 bg-gray-50">
                {orderList.length > 0 ? (
                  <div className="space-y-3">
                    <p className="text-sm text-gray-500 mb-2">以下盤點數量低於安全警戒值：</p>
                    {orderList.map(item=>(
                      <div key={item.id} className="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
                        <div><div className="font-bold text-gray-800">{item.name}</div><div className="text-xs text-gray-400 mt-1">規格: {item.spec||'無'}</div></div>
                        <div className="text-right bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">
                          <div className="text-red-600 font-bold">剩 {item.actualCount} <span className="text-sm font-normal">{item.unit}</span></div>
                          <div className="text-[10px] text-red-400 mt-0.5">低於 {item.alertLevel}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-12 flex flex-col items-center">
                    <div className="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-4"><CheckCircle2 className="w-8 h-8"/></div>
                    <p className="text-lg font-bold text-gray-800">庫存都很充足！</p>
                    <p className="text-gray-500 text-sm mt-1">今日已盤點的品項皆在安全量之上</p>
                  </div>
                )}
              </div>
              <div className="p-4 border-t border-gray-100 bg-white flex gap-3">
                <button onClick={()=>setShowOrderModal(false)} className="flex-1 py-3 bg-white border-2 border-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors">返回</button>
                {orderList.length > 0 && (
                  <button onClick={async()=>{await handleCopyAndLine();setShowOrderModal(false);}} className="flex-[2] py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 flex justify-center items-center shadow-sm transition-colors gap-2">
                    <Copy className="w-5 h-5"/>複製清單傳LINE
                  </button>
                )}
              </div>
            </div>
          </div>
        )}

        {/* ✨ 進貨 Modal 使用 getLatestRecord 取代原本的 getLastRecord，才能吃到今天的數字 */}
        {showRestockModal && <RestockModal onClose={() => setShowRestockModal(false)} systemStockMap={systemStockMap} onRestock={handleRestock} showToast={showToast} getLatestRecord={getLatestRecord} />}
        
        <CustomKeypad 
          activeId={activeInputId} 
          onKeyPress={handleKeypadPress} 
          onNext={handleKeypadNext} 
          onClose={() => setActiveInputId(null)} 
        />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
