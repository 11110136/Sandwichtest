<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每週金庫換錢紀錄表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自訂卷軸，避免手機版表格太擠 */
        .table-container { overflow-x: auto; }
        table { min-width: 900px; }

        @media print {
            /* 已經移除 @page 強制預設橫向與邊距的設定，讓使用者自行在列印視窗調整 */
            
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 0; border: none !important; }
            
            .table-container { overflow-x: visible !important; }
            table { min-width: 100% !important; width: 100% !important; border-collapse: collapse !important; }
            
            td, th { border: 1px solid #94a3b8 !important; padding: 6px 4px !important; font-size: 13px !important; }
            input { border: none !important; background: transparent !important; width: 100% !important; text-align: center !important; font-size: 14px !important; font-weight: bold !important; }
            
            .date-line { border-bottom: 1px solid black !important; }
            textarea::placeholder { color: transparent !important; }
            
            .print-bg-dark { background-color: #1e293b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-gray { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-indigo { background-color: #e0e7ff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 讓輸入框填滿儲存格且無外框 */
        .cell-input {
            width: 100%;
            height: 100%;
            min-height: 36px;
            text-align: center;
            background-color: transparent;
            outline: none;
            font-weight: bold;
            color: #1f2937;
        }
        .cell-input:focus {
            background-color: #e0f2fe;
        }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen font-sans text-gray-800">

    <!-- 導覽列 -->
    <div class="fixed top-4 left-4 z-[990] no-print">
        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="flex items-center justify-center w-11 h-11 bg-white/90 backdrop-blur border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 hover:shadow-md transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
        </button>
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-100 overflow-hidden transition-all origin-top-left">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border-b border-gray-50 transition-colors">值班系統</a>
            <a href="cash.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors">每週金庫結算</a>
            <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">庫存盤點</a>
            <a href="clean.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-purple-50 hover:text-purple-600 transition-colors">清潔與值班管理</a>
            <a href="performance.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-green-50 hover:text-green-600 transition-colors">績效評估系統</a>
        </div>
    </div>
    
    <div class="max-w-6xl mx-auto bg-white p-4 md:p-8 rounded-xl shadow-lg container border border-gray-200 pt-16 md:pt-8 mt-12 md:mt-0 relative z-10">
        
        <!-- 標題與日期 -->
        <div class="border-b-2 border-gray-800 pb-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div class="w-full shrink-1">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 tracking-wider whitespace-nowrap">金庫換錢週紀錄表</h1>
                <p class="text-sm text-gray-500 uppercase tracking-tighter mt-1">VAULT EXCHANGE WEEKLY RECORD</p>
            </div>
            <div class="w-full md:w-auto shrink-0 min-w-[320px] text-left md:text-right flex flex-col items-start md:items-end">
                <label class="block text-sm font-bold text-gray-600 mb-1">紀錄期間 (年/月/日)</label>
                <div class="flex items-center gap-2 w-full">
                    <input type="text" id="reportDate" value="2026 /    /    至 2026 /    /    " class="date-line border-b border-gray-300 focus:outline-none focus:border-blue-500 text-left md:text-center py-1 px-2 w-full bg-transparent text-lg font-bold text-gray-700 tracking-widest">
                </div>
            </div>
        </div>

        <!-- 金庫現有的錢 -->
        <div class="bg-indigo-50/60 print-bg-indigo border border-indigo-100 rounded-xl p-4 md:p-5 mb-6 shadow-sm">
            <h2 class="text-lg font-bold text-indigo-900 mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                金庫初始現有庫存 (單位：個)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3 md:gap-4 mb-2">
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$1000</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="1000">
                </div>
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$500</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="500">
                </div>
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$100</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="100">
                </div>
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$50</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="50">
                </div>
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$10</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="10">
                </div>
                <div class="bg-white p-2 rounded-lg border border-indigo-100 shadow-sm">
                    <label class="block text-[15pt] font-bold text-gray-500 text-center mb-1">$5</label>
                    <input type="number" min="0" class="current-qty w-full text-center font-bold text-lg text-slate-800 focus:outline-none" data-val="5">
                </div>
            </div>
            <!-- 已改為靠左對齊，並移除預設的 NT$ 0 -->
            <div class="flex items-center justify-start mt-3 pl-2 border-t border-indigo-200 pt-3 h-10">
                <span class="text-gray-600 font-bold mr-3">現有總金額:</span>
                <span id="currentTotalText" class="text-indigo-700 font-bold text-2xl tracking-wide min-w-[150px]"></span>
            </div>
        </div>

        <!-- 換錢紀錄主表格 -->
        <div class="table-container mb-6">
            <table class="w-full border-collapse border border-slate-300">
                <thead class="bg-slate-800 text-white print-bg-dark text-center text-sm md:text-base">
                    <tr>
                        <th class="border border-slate-600 p-2 w-[8%] font-bold">日期</th>
                        <th class="border border-slate-600 p-2 w-[8%] font-bold">動作</th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$1000<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$500<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$100<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$50<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$10<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[10%] font-bold">$5<br><span class="text-xs font-normal text-slate-300">(個)</span></th>
                        <th class="border border-slate-600 p-2 w-[12%] font-bold tracking-wide">合計金額</th>
                        <th class="border border-slate-600 p-2 w-[12%] font-bold">換錢人<br>簽名</th>
                    </tr>
                </thead>
                <tbody id="exchangeTableBody">
                    <!-- 使用 JavaScript 動態生成週一至週日 -->
                </tbody>
            </table>
        </div>

        <!-- 備註與主管簽名 -->
        <div class="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-6 break-inside-avoid mt-8">
            <div class="border border-gray-300 rounded-xl p-5 flex flex-col bg-white h-full shadow-sm">
                <label for="remarksInput" class="block text-base font-bold text-gray-700 mb-2">本週備註事項 (Remarks):</label>
                <textarea id="remarksInput" class="w-full flex-grow border border-gray-200 rounded-lg p-3 text-gray-800 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none min-h-[100px] print:border print:border-gray-300 print:bg-white" placeholder="若有特殊換錢狀況請註明..."></textarea>
            </div>
            <div class="border border-gray-300 rounded-xl p-5 flex flex-col items-center justify-end bg-white h-full shadow-sm">
                <div class="w-full max-w-[280px] h-20 border-b-2 border-gray-800 mb-3 bg-white"></div>
                <p class="text-lg font-bold text-gray-700 tracking-wide">主管/核實人簽名</p>
            </div>
        </div>

        <!-- 功能按鈕 -->
        <div class="mt-10 flex flex-wrap justify-center gap-3 md:gap-4 no-print relative">
            <button onclick="window.print()" class="w-36 md:w-44 flex justify-center items-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-4 rounded-lg shadow transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                列印紙本
            </button>
            <button id="btnSubmitData" onclick="submitToCloud()" class="w-36 md:w-44 flex justify-center items-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 md:py-4 rounded-lg shadow transition duration-200">
                上傳數據
            </button>
            <button onclick="resetForm()" class="w-36 md:w-44 flex justify-center items-center bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-3 md:py-4 rounded-lg shadow-sm transition duration-200">
                清除內容
            </button>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="fixed inset-0 z-[2000] hidden bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-emerald-500 mb-4"></div>
            <p class="text-white font-bold tracking-widest text-lg">資料上傳中，請稍候...</p>
        </div>
    </div>

    <script>
        const denominations = [1000, 500, 100, 50, 10, 5];
        const days = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        
        // 動態生成表格結構
        function renderTable() {
            const tbody = document.getElementById('exchangeTableBody');
            let html = '';
            
            days.forEach((dayName, index) => {
                const dayNum = index + 1;
                const isWeekend = (dayNum >= 6);
                const dayColor = isWeekend ? 'text-red-600' : 'text-slate-800';
                const bgClass = (dayNum % 2 === 0) ? 'bg-slate-50 print-bg-gray' : 'bg-white';
                
                html += `
                    <!-- 換出列 -->
                    <tr class="${bgClass} border-b border-gray-200">
                        <td rowspan="2" class="border border-slate-300 p-2 text-center font-bold ${dayColor} text-lg align-middle">${dayName}</td>
                        <td class="border border-slate-300 p-2 text-center font-bold text-red-600 bg-red-50/30">換出</td>
                        ${denominations.map(val => `
                            <td class="border border-slate-300 p-0 hover:bg-blue-50 transition-colors">
                                <input type="number" min="0" class="cell-input qty-out day-${dayNum}" data-val="${val}" data-day="${dayNum}">
                            </td>
                        `).join('')}
                        <td class="border border-slate-300 p-2 text-right font-mono font-bold text-red-700 subtotal-out-${dayNum} bg-red-50/30"></td>
                        <td rowspan="2" class="border border-slate-300 p-1 bg-white align-middle">
                            <!-- 簽名空格 -->
                        </td>
                    </tr>
                    <!-- 換入列 -->
                    <tr class="${bgClass} border-b-2 border-slate-400">
                        <td class="border border-slate-300 p-2 text-center font-bold text-emerald-600 bg-emerald-50/30">換入</td>
                        ${denominations.map(val => `
                            <td class="border border-slate-300 p-0 hover:bg-blue-50 transition-colors">
                                <input type="number" min="0" class="cell-input qty-in day-${dayNum}" data-val="${val}" data-day="${dayNum}">
                            </td>
                        `).join('')}
                        <td class="border border-slate-300 p-2 text-right font-mono font-bold text-emerald-700 subtotal-in-${dayNum} bg-emerald-50/30"></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            
            // 綁定事件
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('input', calculateTotals);
            });
        }

        // 計算總金額邏輯
        function calculateTotals() {
            // 1. 計算「金庫現有庫存」
            let currentVaultTotal = 0;
            document.querySelectorAll('.current-qty').forEach(input => {
                const val = parseInt(input.getAttribute('data-val'));
                const qty = parseInt(input.value) || 0;
                currentVaultTotal += (val * qty);
            });
            
            // 若為 0 則回傳空白字串，印出來時就會乾淨留白
            document.getElementById('currentTotalText').textContent = currentVaultTotal > 0 ? `NT$ ${currentVaultTotal.toLocaleString('zh-TW')}` : '';

            // 2. 計算表格內每一天的「換出」與「換入」合計金額
            for(let day = 1; day <= 7; day++) {
                let outSum = 0;
                let inSum = 0;
                
                // 換出加總
                document.querySelectorAll(`.qty-out.day-${day}`).forEach(input => {
                    const val = parseInt(input.getAttribute('data-val'));
                    const qty = parseInt(input.value) || 0;
                    outSum += (val * qty);
                });
                
                // 換入加總
                document.querySelectorAll(`.qty-in.day-${day}`).forEach(input => {
                    const val = parseInt(input.getAttribute('data-val'));
                    const qty = parseInt(input.value) || 0;
                    inSum += (val * qty);
                });

                // 更新顯示 (金額大於0才顯示)
                const outCell = document.querySelector(`.subtotal-out-${day}`);
                const inCell = document.querySelector(`.subtotal-in-${day}`);
                
                if(outCell) outCell.textContent = outSum > 0 ? `$ ${outSum.toLocaleString('zh-TW')}` : '';
                if(inCell) inCell.textContent = inSum > 0 ? `$ ${inSum.toLocaleString('zh-TW')}` : '';
            }
        }

        // 清除內容
        function resetForm() {
            if(confirm('確定要清空所有輸入的數量與備註嗎？')) {
                // 只清除數字輸入框跟備註欄，保留日期的 / / 格式
                document.querySelectorAll('input[type="number"], textarea').forEach(input => {
                    input.value = '';
                });
                document.getElementById('reportDate').value = '2026 /    /    至 2026 /    /    '; // 重置為有底線格式
                calculateTotals();
            }
        }

        // 導覽列控制
        function toggleGlobalMenu() {
            document.getElementById('global-nav-menu').classList.toggle('hidden');
        }
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('global-nav-menu');
            const btn = document.getElementById('global-nav-btn');
            if (menu && btn && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // 雲端上傳邏輯
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvxtZPmYJD5EmPxAGQnfRmoZrODO3tx_26OWFY20_3ASmUb2ejmkudcPvB-G65cA5VAA/exec";

        async function submitToCloud() {
            const dateVal = document.getElementById('reportDate').value.trim();
            // 若為完全沒填過的預設值，提示必填
            if (!dateVal || dateVal === "2026 /    /    至 2026 /    /    ") {
                alert("請先填寫「紀錄期間」喔！");
                document.getElementById('reportDate').focus();
                return;
            }

            const currentTotalStr = document.getElementById('currentTotalText').innerText.replace(/[^\d]/g, '') || "0";

            const payload = {
                date: dateVal,
                currentTotal: currentTotalStr,
                remarks: document.getElementById('remarksInput').value,
                action: "vault_exchange_update"
            };

            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✅ 換錢紀錄已成功上傳至雲端！");
                    resetForm();
                } else {
                    alert("❌ 上傳失敗：" + result.message);
                }
            } catch (error) {
                alert("❌ 網路連線錯誤，請檢查網路狀態或網址設定。");
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        // 初始化
        window.onload = () => {
            renderTable();
        };
    </script>
</body>
</html>
