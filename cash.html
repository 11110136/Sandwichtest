<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日收銀結算表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 20px; border: none !important; }
            input { border: none !important; background: transparent !important; }
            .date-line { border-bottom: 1px solid black !important; }
            
            /* 列印時隱藏備註欄的提示文字 */
            textarea::placeholder { color: transparent !important; }
            
            /* 列印時，強制顯示簽名圖片，隱藏按鈕跟提示 */
            .print-show-img { display: block !important; }
            .print-hide { display: none !important; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen font-sans">

    <div class="fixed top-4 left-4 z-[990] no-print">
        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="flex items-center justify-center w-11 h-11 bg-white/90 backdrop-blur border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 hover:shadow-md transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                <line x1="4" x2="20" y1="12" y2="12"/>
                <line x1="4" x2="20" y1="6" y2="6"/>
                <line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
        </button>
        
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-100 overflow-hidden transition-all origin-top-left">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border-b border-gray-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
                </svg>
                值班系統
            </a>
            <a href="cash.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>
                </svg>
                每日收銀結算
            </a>
        </div>
    </div>
    <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg container border border-gray-200 pt-16 md:pt-8 mt-12 md:mt-0 relative z-10">
        <div class="border-b-2 border-gray-800 pb-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div class="w-full">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-wider whitespace-nowrap">每日收銀結算表</h1>
                <p class="text-xs text-gray-500 uppercase tracking-tighter mt-1">Daily Cash Reconciliation Form</p>
            </div>
            <div class="w-full md:w-auto text-left md:text-right">
                <label class="block text-xs font-bold text-gray-600 mb-1">結算日期</label>
                <input type="text" id="reportDate" placeholder="月 / 日" class="date-line border-b border-gray-300 focus:outline-none focus:border-blue-500 text-left md:text-center py-1 px-2 w-full md:w-48 bg-transparent">
            </div>
        </div>

        <table class="w-full border-collapse border border-gray-300 mb-8">
            <thead>
                <tr class="bg-gray-800 text-white">
                    <th class="border border-gray-300 p-3 text-left w-1/3">面額 (單位)</th>
                    <th class="border border-gray-300 p-3 text-center w-1/3">數量 (張/枚)</th>
                    <th class="border border-gray-300 p-3 text-right w-1/3 text-nowrap">小計 (元)</th>
                </tr>
            </thead>
            <tbody>
                <tr class="bg-gray-100"><td colspan="3" class="border border-gray-300 p-2 font-bold text-gray-700">百鈔與大鈔 (Notes)</td></tr>
                <tr class="cash-row" data-val="1000">
                    <td class="border border-gray-300 p-3 text-left">1,000 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="500">
                    <td class="border border-gray-300 p-3 text-left">500 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="100">
                    <td class="border border-gray-300 p-3 text-left">100 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>

                <tr class="bg-gray-100"><td colspan="3" class="border border-gray-300 p-2 font-bold text-gray-700">零錢 (Coins)</td></tr>
                <tr class="cash-row" data-val="50">
                    <td class="border border-gray-300 p-3 text-left">50 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="10">
                    <td class="border border-gray-300 p-3 text-left">10 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
                <tr class="cash-row" data-val="5">
                    <td class="border border-gray-300 p-3 text-left">5 元</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <input type="number" min="0" class="qty-input w-24 text-center border-b border-gray-200 focus:border-blue-500 focus:outline-none">
                    </td>
                    <td class="border border-gray-300 p-3 text-right subtotal font-mono">0</td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="bg-yellow-50 font-bold text-xl">
                    <td colspan="2" class="border border-gray-300 p-4 text-right">現金總額 (Total):</td>
                    <td class="border border-gray-300 p-4 text-right text-blue-800" id="grandTotal">NT$ 0</td>
                </tr>
            </tfoot>
        </table>

        <div class="grid grid-cols-2 gap-4 md:gap-12 mt-16 px-2 md:px-4 break-inside-avoid">
            
            <div class="text-center flex flex-col items-center">
                <div onclick="openSignatureModal('closer', '當天關帳人簽名')" class="relative w-full h-24 md:h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/80 cursor-pointer hover:bg-blue-50/50 transition-colors group">
                    <img id="imgCloser" src="" class="absolute inset-0 w-full h-full object-contain hidden pointer-events-none print-show-img">
                    <button onclick="clearInlineSignature(event, 'closer')" id="btnClearCloser" class="absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/90 px-2 py-1 rounded shadow-sm no-print transition-colors hidden z-10">清除</button>
                    <span id="hintCloser" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-sm tracking-widest no-print group-hover:text-blue-500 transition-colors print-hide">
                        <svg class="w-5 h-5 mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                        點擊放大簽名
                    </span>
                </div>
                <p class="text-sm font-bold text-gray-700">當天關帳人簽名</p>
                <div class="text-xs text-gray-400 italic mt-1">(Signature of Closer)</div>
            </div>

            <div class="text-center flex flex-col items-center">
                <div onclick="openSignatureModal('manager', '主管/核實人簽名')" class="relative w-full h-24 md:h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/80 cursor-pointer hover:bg-blue-50/50 transition-colors group">
                    <img id="imgManager" src="" class="absolute inset-0 w-full h-full object-contain hidden pointer-events-none print-show-img">
                    <button onclick="clearInlineSignature(event, 'manager')" id="btnClearManager" class="absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/90 px-2 py-1 rounded shadow-sm no-print transition-colors hidden z-10">清除</button>
                    <span id="hintManager" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-sm tracking-widest no-print group-hover:text-blue-500 transition-colors print-hide">
                        <svg class="w-5 h-5 mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                        點擊放大簽名
                    </span>
                </div>
                <p class="text-sm font-bold text-gray-700">主管/核實人簽名</p>
                <div class="text-xs text-gray-400 italic mt-1">(Signature of Manager)</div>
            </div>
        </div>

        <div class="mt-12 border border-gray-300 rounded-xl p-4 break-inside-avoid">
            <label for="remarksInput" class="block text-sm font-bold text-gray-700 mb-2">備註事項 (Remarks):</label>
            <textarea id="remarksInput" rows="3" class="w-full border border-gray-200 rounded-lg p-3 text-gray-700 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-y print:border print:border-gray-300 print:bg-white" placeholder="可點擊此處輸入備註，或直接留白列印出來手寫..."></textarea>
        </div>

        <div class="mt-10 flex justify-center space-x-4 no-print relative">
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 md:px-8 rounded-lg shadow transition duration-200 flex items-center text-sm md:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                列印紙本
            </button>
            
            <button id="btnSubmitData" onclick="submitToCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 md:px-8 rounded-lg shadow transition duration-200 flex items-center text-sm md:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                上傳儲存
            </button>

            <button onclick="resetForm()" class="bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 font-bold py-3 px-6 md:px-8 rounded-lg transition duration-200 text-sm md:text-base">
                清除內容
            </button>
        </div>

        <div id="loadingOverlay" class="fixed inset-0 z-[2000] hidden bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-emerald-500 mb-4"></div>
            <p class="text-white font-bold tracking-widest">資料上傳中，請稍候...</p>
        </div>

        <div class="text-[10px] text-gray-400 mt-8 text-center uppercase tracking-widest no-print">
            End of Report
        </div>
    </div>

    <div id="signatureModal" class="fixed inset-0 z-[1000] hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 md:p-8 no-print">
        <div class="bg-white w-full max-w-3xl h-[70vh] md:h-[60vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-5 py-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 id="signatureModalTitle" class="font-bold text-gray-800 text-lg">請簽名</h3>
                <button onclick="closeSignatureModal()" class="text-gray-400 hover:text-gray-700 bg-white rounded-full p-1 shadow-sm border border-gray-200 transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="flex-grow relative bg-white">
                <canvas id="modalCanvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
                <span id="modalSignHint" class="absolute inset-0 flex items-center justify-center text-gray-300 pointer-events-none text-2xl tracking-widest">
                    請在此大面積處簽名
                </span>
            </div>
            
            <div class="px-5 py-3 border-t border-gray-200 bg-gray-50 flex justify-between gap-4">
                <button onclick="clearModalCanvas()" class="px-4 py-2 bg-white border border-gray-300 text-gray-600 rounded-lg font-bold hover:bg-gray-100 transition-colors shadow-sm text-sm">
                    清除重寫
                </button>
                <div class="flex gap-2">
                    <button onclick="closeSignatureModal()" class="px-4 py-2 bg-transparent text-gray-500 rounded-lg font-bold hover:bg-gray-200 transition-colors text-sm">取消</button>
                    <button onclick="saveSignature()" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">完成簽名</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.qty-input');
        const rows = document.querySelectorAll('.cash-row');
        const grandTotalDisplay = document.getElementById('grandTotal');

        function calculate() {
            let total = 0;
            rows.forEach(row => {
                const val = parseInt(row.getAttribute('data-val'));
                const qty = parseInt(row.querySelector('.qty-input').value) || 0;
                const subtotal = val * qty;
                row.querySelector('.subtotal').textContent = subtotal.toLocaleString('zh-TW');
                total += subtotal;
            });
            grandTotalDisplay.textContent = 'NT$ ' + total.toLocaleString('zh-TW');
        }

        inputs.forEach(input => {
            input.addEventListener('input', calculate);
        });

        // 重置表單
        function resetForm() {
            if(confirm('確定要清空所有數量與簽名嗎？')) {
                inputs.forEach(input => input.value = '');
                document.getElementById('reportDate').value = '';
                document.getElementById('remarksInput').value = '';
                
                // 模擬點擊清空按鈕以清空簽名圖片
                const fakeEvent = { stopPropagation: () => {} };
                clearInlineSignature(fakeEvent, 'closer');
                clearInlineSignature(fakeEvent, 'manager');
                
                calculate();
            }
        }

        // ==========================================
        // --- 全域導覽選單功能 ---
        // ==========================================
        function toggleGlobalMenu() {
            document.getElementById('global-nav-menu').classList.toggle('hidden');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('global-nav-menu');
            const btn = document.getElementById('global-nav-btn');
            if (menu && btn && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // ==========================================
        // --- 放大電子簽名板 (Modal) 邏輯 ---
        // ==========================================
        let currentSignRole = ''; // 紀錄現在是誰在簽名 ('closer' 或是 'manager')
        let hasDrawn = false; // 紀錄畫布上是否有字跡
        
        const modal = document.getElementById('signatureModal');
        const canvas = document.getElementById('modalCanvas');
        const ctx = canvas.getContext('2d');
        const modalHint = document.getElementById('modalSignHint');

        // 打開放大畫布
        function openSignatureModal(role, titleText) {
            currentSignRole = role;
            document.getElementById('signatureModalTitle').innerText = titleText;
            
            // 顯示 Modal
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // 防止背景網頁捲動
            
            // 每次打開強制重新設定畫布大小並清空
            resizeCanvas();
            clearModalCanvas();
        }

        // 關閉放大畫布
        function closeSignatureModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = ''; // 恢復背景捲動
        }

        // 確認儲存簽名
        function saveSignature() {
            if (!hasDrawn) {
                alert("您尚未簽名喔！");
                return;
            }
            // 取出畫布圖片資料
            const dataUrl = canvas.toDataURL("image/png");
            
            // 放進原本畫面上的 img 標籤中
            const imgElement = document.getElementById('img' + capitalize(currentSignRole));
            const hintElement = document.getElementById('hint' + capitalize(currentSignRole));
            const btnElement = document.getElementById('btnClear' + capitalize(currentSignRole));

            imgElement.src = dataUrl;
            imgElement.classList.remove('hidden'); // 顯示圖片
            hintElement.classList.add('hidden');   // 隱藏「點擊此處簽名」提示
            btnElement.classList.remove('hidden'); // 顯示內聯的「清除」小按鈕

            closeSignatureModal();
        }

        // 清除主畫面上的已簽名圖檔
        function clearInlineSignature(event, role) {
            event.stopPropagation(); // 防止點擊清除按鈕時，又觸發打開畫布
            
            const imgElement = document.getElementById('img' + capitalize(role));
            const hintElement = document.getElementById('hint' + capitalize(role));
            const btnElement = document.getElementById('btnClear' + capitalize(role));

            imgElement.src = "";
            imgElement.classList.add('hidden');
            hintElement.classList.remove('hidden');
            btnElement.classList.add('hidden');
        }

        // 工具函數：首字母大寫 (closer -> Closer)
        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // === 以下為畫布 (Canvas) 核心繪圖程式碼 ===

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            ctx.lineWidth = 3; // 放大畫布所以畫筆也稍微粗一點
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round'; 
            ctx.strokeStyle = '#1e293b'; 
        }

        // 監聽視窗改變時重設畫布
        window.addEventListener('resize', () => {
            if (!modal.classList.contains('hidden')) resizeCanvas();
        });

        function clearModalCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            modalHint.style.display = 'flex';
            hasDrawn = false;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startPosition(e) {
            isDrawing = true;
            hasDrawn = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            modalHint.style.display = 'none'; // 隱藏中央提示文字
            e.preventDefault(); 
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath(); 
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x;
            lastY = pos.y;
            e.preventDefault(); 
        }

        // 綁定電腦滑鼠事件
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mouseout', endPosition);
        canvas.addEventListener('mousemove', draw);

        // 綁定手機觸控事件
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition, {passive: false});
        canvas.addEventListener('touchcancel', endPosition, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});

        // ！！！請將這段網址替換成你剛剛在 Apps Script 部署拿到的 Web App URL ！！！
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvxtZPmYJD5EmPxAGQnfRmoZrODO3tx_26OWFY20_3ASmUb2ejmkudcPvB-G65cA5VAA/exec";

        // 上傳資料到雲端
        async function submitToCloud() {
            const dateVal = document.getElementById('reportDate').value.trim();
            if (!dateVal) {
                alert("請先填寫「結算日期」喔！");
                document.getElementById('reportDate').focus();
                return;
            }

            // 取得各面額的數量
            const getQty = (val) => document.querySelector(`tr[data-val="${val}"] .qty-input`).value || "0";
            
            // 取得總金額 (過濾掉 "NT$ " 與逗號)
            const totalText = document.getElementById('grandTotal').innerText;
            const totalVal = totalText.replace(/[^\d]/g, ''); 

            // 取得簽名檔的 Base64 字串 (如果 img 的 src 有東西，就是有簽名)
            const closerImgSrc = document.getElementById('imgCloser').getAttribute('src');
            const managerImgSrc = document.getElementById('imgManager').getAttribute('src');

            // 整理要傳送的資料包
            const payload = {
                date: dateVal,
                cash1000: getQty(1000),
                cash500: getQty(500),
                cash100: getQty(100),
                coin50: getQty(50),
                coin10: getQty(10),
                coin5: getQty(5),
                total: totalVal,
                remarks: document.getElementById('remarksInput').value,
                closerSign: closerImgSrc || "",
                managerSign: managerImgSrc || ""
            };

            // 顯示 Loading 畫面
            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    // 因為跨域問題，使用 text/plain 送出
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✅ 結算資料與簽名已成功上傳至雲端！");
                    // 上傳成功後自動清空表單
                    const fakeEvent = { stopPropagation: () => {} };
                    inputs.forEach(input => input.value = '');
                    document.getElementById('reportDate').value = '';
                    document.getElementById('remarksInput').value = '';
                    clearInlineSignature(fakeEvent, 'closer');
                    clearInlineSignature(fakeEvent, 'manager');
                    calculate();
                } else {
                    alert("❌ 上傳失敗：" + result.message);
                }
            } catch (error) {
                alert("❌ 網路連線錯誤，請檢查網路狀態或網址設定。");
                console.error(error);
            } finally {
                // 隱藏 Loading 畫面
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
