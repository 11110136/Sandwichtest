<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>員工績效評分系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    :root {
      --sage: #6C8673;
      --sage-light: #8FA192;
      --sage-pale: #F0F4F1;
      --olive: #5A705F;
      --cream: #F6F7F2;
      --warm-white: #ffffff;
      --ink: #2D3A31;
      --ink-soft: #4F6354;
      --ink-muted: #8FA192;
      --accent-red: #c0392b;
      --border: #E5EBE6;
      --border-dark: #D4DCD5;
    }
    body {
      background-color: var(--cream);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .topbar {
      background: var(--sage); color: #fff; padding: 0 16px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; margin: 0; padding-left: 4px; }
    .nav-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; background: transparent; border: none; outline: none;
      cursor: pointer; color: white; transition: all 0.2s;
    }
    .nav-btn:hover { color: rgba(255,255,255,0.8); transform: scale(1.05); }
    .nav-btn:active { transform: scale(0.95); }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: #6C8673; cursor: pointer; margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px; cursor: pointer; background: #D4DCD5; border-radius: 4px;
    }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .star-rating { display: flex; gap: 6px; }
    .star-btn {
      cursor: pointer; color: #D4DCD5;
      transition: color 0.15s, transform 0.1s;
      background: none; border: none; padding: 0;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      font-weight: 700; font-size: 14px; letter-spacing: 0.05em;
    }
    .grade-O { background: #fef9c3; color: #854d0e; }
    .grade-A { background: #dcfce7; color: #166534; }
    .grade-B { background: #dbeafe; color: #1e40af; }
    .grade-C { background: #f3e8ff; color: #6b21a8; }
    .grade-D { background: #fee2e2; color: #991b1b; }
    .station-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1.5px solid #D4DCD5;
      background: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      font-size: 14px; font-weight: 600; color: #4F6354; letter-spacing: 0.025em;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .station-btn:hover { border-color:#A3B4A5; background:#F8FAF8; transform:translateY(-1px); box-shadow:0 4px 6px rgba(0,0,0,0.05); }
    .station-btn.active { border-color:#6C8673; background:#6C8673; color:white; box-shadow:0 4px 12px rgba(108,134,115,0.2); }
    .station-btn .icon-wrapper {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%; background: #F0F4F1; transition: all 0.2s;
    }
    .station-btn.active .icon-wrapper { background: white; }
    dialog { border: none; background: white; margin: auto; max-height: 90dvh; }
    dialog::backdrop { background: rgba(45,58,49,0.5); }

  </style>
</head>
<body class="min-h-screen text-[#2D3A31] selection:bg-[#D4DCD5]">

  <!-- 載入動畫遮罩：頁面初始化時顯示，資料讀取與渲染完成後淡出 -->
  <div id="app-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F0F4EE;transition:opacity .4s ease;">
    <div style="width:52px;height:52px;border:5px solid rgba(0,0,0,0.08);border-top-color:#6B8E5A;border-radius:50%;animation:appspin 0.8s linear infinite;"></div>
    <div style="font-size:15px;font-weight:700;color:#4A5443;letter-spacing:1px;">載入中…</div>
  </div>
  <style>
  @keyframes appspin { to { transform: rotate(360deg); } }
  #app-loader.loaded { opacity:0; pointer-events:none; }
  </style>

  <nav class="sticky top-0 z-50 flex flex-col shadow-sm">
    <div class="topbar no-print">
      <div class="topbar-left relative">
        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="nav-btn">
          <i data-lucide="menu" class="w-6 h-6 stroke-[2.5]"></i>
        </button>
        <div class="flex items-center space-x-2 select-none ml-1">
          <i data-lucide="clipboard-list" class="w-5 h-5 md:w-6 md:h-6 text-white stroke-[2.2]"></i>
          <h1 class="text-base md:text-xl font-bold tracking-widest text-white uppercase">績效評分系統</h1>
        </div>
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-3 w-52 bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-[var(--border)] overflow-hidden transition-all origin-top-left z-[1000]">
          <div class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-muted)] border-b border-[var(--border)] opacity-45 cursor-not-allowed select-none"><i data-lucide="calendar" class="w-4 h-4"></i> 值班系統<span class="ml-auto text-[10px] font-medium bg-[var(--border)] text-[var(--ink-muted)] px-1.5 py-0.5 rounded">尚未開放</span></div>
          <div class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-muted)] border-b border-[var(--border)] opacity-45 cursor-not-allowed select-none"><i data-lucide="circle-dollar-sign" class="w-4 h-4"></i> 每週金庫結算<span class="ml-auto text-[10px] font-medium bg-[var(--border)] text-[var(--ink-muted)] px-1.5 py-0.5 rounded">尚未開放</span></div>
          <div class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-muted)] border-b border-[var(--border)] opacity-45 cursor-not-allowed select-none"><i data-lucide="package" class="w-4 h-4"></i> 庫存盤點<span class="ml-auto text-[10px] font-medium bg-[var(--border)] text-[var(--ink-muted)] px-1.5 py-0.5 rounded">尚未開放</span></div>
          <a href="clean.html"       class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] border-b border-[var(--border)] transition-colors"><i data-lucide="sparkles"          class="w-4 h-4 text-[var(--ink-muted)]"></i> 清潔與值班管理</a>
          <a href="performance.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] transition-colors">                                  <i data-lucide="clipboard-list"   class="w-4 h-4 text-[var(--ink-muted)]"></i> 績效評估系統</a>
        </div>
      </div>
    </div>

    <div class="bg-white border-b border-[#D4DCD5]">
      <div class="max-w-6xl mx-auto px-4 md:px-6 relative">
        <div class="relative flex w-full" id="tab-container">
          <button id="tab-evaluate" onclick="switchTab('evaluate')" class="flex-1 py-3 text-sm md:text-base font-medium flex justify-center items-center transition-all duration-300 text-[#2D3A31]">
            <i data-lucide="clipboard-edit" class="w-4 h-4 mr-1.5 opacity-80"></i> 店長評分
          </button>
          <button id="tab-cleaning" onclick="switchTab('cleaning')" class="flex-1 py-3 text-sm md:text-base font-medium flex justify-center items-center transition-all duration-300 text-[#8FA192] hover:text-[#4F6354]">
            <i data-lucide="sparkles" class="w-4 h-4 mr-1.5 opacity-80"></i> 清潔評分
          </button>
          <div id="tab-indicator" class="absolute bottom-0 left-0 h-[3px] bg-[#6C8673] rounded-t-full transition-all duration-300 ease-out z-10 opacity-0" style="width:0;transform:translateX(0);"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-12">

    <div id="section-evaluate" class="block">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8">
        <div class="md:col-span-4 lg:col-span-3 space-y-2 md:space-y-4">
          <h2 class="text-xs md:text-sm font-semibold text-[#8FA192] tracking-widest uppercase mb-2 md:mb-4 pl-1">當天值班人員</h2>
          <div id="employee-list" class="flex overflow-x-auto md:flex-col gap-2 md:gap-3 pb-3 md:pb-0 hide-scrollbar snap-x"></div>
        </div>
        <div class="md:col-span-8 lg:col-span-9" id="evaluate-content">
          <div class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] p-5 md:p-10">
            <div class="flex flex-col sm:flex-row justify-between sm:items-start gap-4 mb-6 md:mb-8 border-b border-[#E5EBE6] pb-5 md:pb-6">
              <div class="flex-1">
                <h2 class="text-2xl md:text-3xl font-light text-[#2D3A31] tracking-wide mb-1 md:mb-2 flex items-center gap-2">
                  <span id="current-emp-name" class="font-medium"></span>
                  <span class="text-[#8FA192] text-lg md:text-2xl">的績效評估</span>
                </h2>
                <p class="text-[#687A6B] text-xs md:text-sm mb-3">請選擇今日工作崗位，再進行 1-10 分評分</p>
                <div id="seniority-suggestion"></div>
              </div>
              <div class="text-left sm:text-right bg-[#F0F4F1] sm:bg-transparent p-4 sm:p-0 rounded-2xl sm:rounded-none flex-shrink-0">
                <p class="text-[10px] md:text-xs font-semibold text-[#8FA192] uppercase tracking-widest mb-1">今日總分</p>
                <p id="current-total-score" class="text-3xl md:text-4xl font-light text-[#2D3A31]">0.0</p>
              </div>
            </div>
            <div class="mb-6 md:mb-8">
              <p class="text-xs font-semibold text-[#8FA192] tracking-widest uppercase mb-3">今日工作崗位</p>
              <div class="flex gap-2 flex-wrap" id="station-selector"></div>
            </div>
            <div id="criteria-form" class="space-y-4 md:space-y-6"></div>
            <div class="mt-8 md:mt-10 flex justify-end">
              <button onclick="saveData()" class="w-full sm:w-auto flex items-center justify-center px-8 py-3.5 bg-[#6C8673] hover:bg-[#5A705F] text-white rounded-xl shadow-lg shadow-[#6C8673]/20 transition-all active:scale-95 font-medium tracking-wide">
                <i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存今日評定紀錄
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="section-cleaning" class="hidden space-y-6 animate-[fadeIn_0.5s_ease-out]">
      <div class="text-center mb-6 md:mb-10">
        <h2 class="text-2xl md:text-3xl font-light text-[#2D3A31] tracking-wide mb-2 md:mb-3">今日例行清潔評分</h2>
        <p class="text-xs md:text-sm text-[#687A6B]">獨立紀錄清潔人員的表現，與工作崗位評分分開計算</p>
      </div>
      <div class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] p-6 md:p-10 max-w-2xl mx-auto">
        <div class="mb-8">
          <label class="block text-xs font-semibold text-[#8FA192] tracking-widest uppercase mb-3">今日例行清潔人員 (全體名單)</label>
          <div class="flex flex-wrap gap-2" id="cleaning-emp-selector"></div>
        </div>
        <div id="cleaning-selected-list" class="space-y-4"></div>
        <div class="mt-8 flex justify-end">
          <button onclick="saveCleaningData()" class="w-full sm:w-auto flex items-center justify-center px-8 py-3.5 bg-[#6C8673] hover:bg-[#5A705F] text-white rounded-xl shadow-lg shadow-[#6C8673]/20 transition-all active:scale-95 font-medium tracking-wide">
            <i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存清潔評分
          </button>
        </div>
      </div>
    </div>

    <dialog id="status-modal" class="backdrop:bg-[#2D3A31]/50 backdrop:backdrop-blur-sm p-0 rounded-3xl shadow-2xl border border-[#E5EBE6] w-[90%] max-w-sm">
      <div class="p-8 text-center">
        <div id="modal-loading" class="hidden">
          <div class="w-16 h-16 border-4 border-[#D4DCD5] border-t-[#6C8673] rounded-full animate-spin mx-auto mb-4"></div>
          <h3 class="text-xl font-bold text-[#2D3A31] mb-2">同步中</h3>
          <p class="text-[#687A6B] text-sm">正在將資料傳送至雲端，請稍候...</p>
        </div>
        <div id="modal-success" class="hidden">
          <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="check" class="w-8 h-8 text-emerald-600"></i>
          </div>
          <h3 class="text-xl font-bold text-[#2D3A31] mb-2">儲存成功</h3>
          <p class="text-[#687A6B] text-sm mb-6">今日的評定紀錄已成功上傳。</p>
          <button onclick="document.getElementById('status-modal').close()"
            class="w-full py-3 bg-[#6C8673] text-white rounded-xl font-medium hover:bg-[#5A705F] transition-all">確認</button>
        </div>
      </div>
    </dialog>
  </main>

  <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-[#3F5144]/95 backdrop-blur text-white px-6 py-2.5 rounded-full shadow-xl flex items-center space-x-2 transition-all duration-300 opacity-0 -translate-y-6 pointer-events-none z-[1000]">
    <i data-lucide="check-circle" class="w-4 h-4 text-[#A3B4A5] flex-shrink-0"></i>
    <span id="toast-msg" class="font-medium tracking-wide text-sm">今日評分已成功儲存</span>
  </div>

  <script>
    // ── 雲端設定 ──
    const LIFF_ID = '2010172685-ojhA52eN';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxW1YFhFSaKmGFmdsL2bXm3ntApxvprsd7yPskUHLLZ8J2-lCUoX3mZJFHaQnK0bleEBg/exec';
    // ── 排班讀取改用 Railway 後端（績效/清潔紀錄仍走上方 GAS_API_URL，維持不變）──
    const API_BASE = 'https://food-stand-backend-production.up.railway.app/api';
    async function apiGet(path) {
      const res = await fetch(`${API_BASE}${path}`);
      if (!res.ok) throw new Error(`GET ${path} 失敗 (${res.status})`);
      const json = await res.json();
      return json.data ?? [];
    }

    // ── 員工與崗位資料 ──
    const ALL_EMPLOYEES = [
      { name: '小郭', joinDate: '2022-06-15', gradeTier: 'C' },
      { name: '菟菟', joinDate: '2023-01-10', gradeTier: 'B' },
      { name: '林宣', joinDate: '2020-09-01', gradeTier: 'B' },
      { name: '若菱', joinDate: '2024-02-20', gradeTier: 'A' },

      { name: 'Sam',  joinDate: '2021-08-15', gradeTier: 'D' },
      { name: '翠翠', joinDate: '2022-11-01', gradeTier: 'C' },
      { name: '偲璇', joinDate: '2024-05-01', gradeTier: 'A' },
      { name: '若薇', joinDate: '2026-01-01', gradeTier: 'A' },
    ];
    let EMPLOYEES = [];

    const STATIONS = [
      { id:'fryer',         name:'油鍋',      icon:'flame',              color:'text-orange-500',
        criteria:[
          { id:'speed',     name:'速度',     desc:'讓做餐人員等候的時間長短',                                           weight:0.30 },
          { id:'fry',       name:'油炸狀態', desc:'是否過深/過淺、顏色均勻度',                                          weight:0.25 },
          { id:'technique', name:'手法',     desc:'三明治剪開深淺、是否筆直居中',                                        weight:0.25 },

        ]},
      { id:'sandwich_main', name:'三明治主手', icon:'sandwich',          color:'text-amber-500',
        criteria:[
          { id:'teamwork',  name:'協作',     desc:'是否協同副手作餐、確認應做的餐點數量',                               weight:0.25 },
          { id:'filling',   name:'內餡擺放', desc:'美乃滋無收乾淨、魯蛋及番茄的擺放、火腿花有無散開',                   weight:0.30 },

          { id:'quality',   name:'品質把關', desc:'確認成品外觀、內餡是否完整正確',                                     weight:0.20 },
        ]},
      { id:'sandwich_sub',  name:'三明治副手', icon:'users',             color:'text-blue-500',
        criteria:[
          { id:'order',     name:'確認訂單', desc:'核對訂單內容出餐，出餐時客人是否方便帶走',                           weight:0.25 },
          { id:'clean',     name:'環境整潔', desc:'工作環境是否隨時保持整潔',                                           weight:0.25 },
          { id:'filling',   name:'內餡擺放', desc:'美乃滋無收乾淨、魯蛋及番茄的擺放、火腿花有無散開',                   weight:0.25 },
          { id:'speed',     name:'速度配合', desc:'有無配合現場訂單視情況，整併數量出餐',                               weight:0.25 },
        ]},
      { id:'cashier',       name:'結帳',      icon:'circle-dollar-sign', color:'text-emerald-500',

        ]},
      { id:'side_dish',     name:'附餐',      icon:'utensils-crossed',   color:'text-rose-500',
        criteria:[

          { id:'quality',   name:'品質控管', desc:'附餐口味、溫度與包裝正確性',                                        weight:0.40 },
          { id:'clean',     name:'環境整潔', desc:'工作區域與器具的清潔程度',                                          weight:0.30 },

    ];

    const GRADE_COLORS = {
      O:{ bg:'#fef9c3', text:'#854d0e', border:'#fde68a' },
      A:{ bg:'#dcfce7', text:'#166534', border:'#bbf7d0' },
      B:{ bg:'#dbeafe', text:'#1e40af', border:'#bfdbfe' },
      C:{ bg:'#f3e8ff', text:'#6b21a8', border:'#e9d5ff' },
      D:{ bg:'#fee2e2', text:'#991b1b', border:'#fecaca' },
    };
    const GRADE_TABLE = {
      '到職1年以內':{ over90:'O', over80:'O', over70:'A', over60:'B', under60:'C' },
      '到職1~3年':  { over90:'O', over80:'A', over70:'B', over60:'C', under60:'D' },
      '到職3~5年':  { over90:'O', over80:'A', over70:'B', over60:'C', under60:'D' },
      '到職5~8年':  { over90:'O', over80:'A', over70:'B', over60:'C', under60:'D' },
    };
    const GRADE_SCORES = { O:100, A:90, B:80, C:70, D:60 };
    const GRADE_LIMITS = { O: 1, A: 2, B: 4, C: 3, D: 2 }; // 加入等級人數上限

    let currentEvalData = {}, cleaningData = {};
    let currentSelectedEmp = '', currentStation = STATIONS[0].id;
    let todayString = new Date().toLocaleDateString('sv-SE',{ timeZone:'Asia/Taipei' });


    // ══════════════════════════════════════════════
    // 安全性輔助函式：清洗 / 轉義字串
    // ══════════════════════════════════════════════
    // 移除字串中的任何 HTML 標籤（用於清洗從資料庫/試算表讀進來的原始資料，
    // 例如班表姓名可能被 Google 試算表的文字顏色格式包成 <span style="...">姓名</span>）
    function stripHtml(str) {
      return String(str ?? '').replace(/<[^>]*>/g, '').trim();
    }
    // 將字串中會破壞 HTML 屬性/結構的特殊字元轉成安全的 HTML 實體，
    // 用於任何要插入 innerHTML 或 HTML 屬性中的動態文字（姓名、備註、AI 理由、事件描述等）
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    // ══════════════════════════════════════════════
    // 初始化
    // ══════════════════════════════════════════════
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          showToast(`歡迎回來，${profile.displayName}`);
        }
      } catch(e){ console.error('LIFF 初始化失敗:',e); }
    }

    async function fetchTodayShift() {
      const today = new Date();
      try {
        // 後端 /shifts?year= 回傳整年資料，前端再過濾出今天那一列
        const rows = await apiGet(`/shifts?year=${today.getFullYear()}`);
        const data = rows.find(r =>
          r.month === today.getMonth()+1 && r.day === today.getDate()
        );
        if (data) {
          let allPeople = [];
          // ── 先用 stripHtml 清掉可能混入的 <span style="..."> 等格式標籤，
          //    再取姓名文字，避免髒資料帶著 HTML 進入 EMPLOYEES ──
          if (data.open)  allPeople.push(...data.open.split('、').map(n=>stripHtml(n)));
          if (data.shift) allPeople.push(...data.shift.split('、').map(n=>stripHtml(n)));

          const names = [...new Set(allPeople.filter(n=>n&&n!=='X'&&n!==''&&n!=='可柔'))];
          EMPLOYEES = ALL_EMPLOYEES.filter(e=>names.includes(e.name));
          names.forEach(n=>{
            if(!EMPLOYEES.find(e=>e.name===n))
              EMPLOYEES.push({ name:n, joinDate:new Date().toISOString().split('T')[0] });
          });
          renderEmployeeList();
        }
      } catch(e){ console.error('取得班表失敗:',e); }
    }

    async function initApp() {
      await fetchTodayShift();
      if (EMPLOYEES.length === 0) {
        document.getElementById('employee-list').innerHTML =
          '<p class="text-[#8FA192] text-sm p-4 text-center border-2 border-dashed border-[#D4DCD5] rounded-2xl">今日查無班表</p>';
        document.getElementById('evaluate-content').innerHTML =
          '<div class="h-64 flex items-center justify-center text-[#8FA192]">目前沒有人員可以評分</div>';
        return;
      }
      currentSelectedEmp = EMPLOYEES[0].name;
      await fetchTodayHistory();
      loadDataFromStorage();
      renderEmployeeList();
      selectEmployee(currentSelectedEmp);
      renderStationSelector();
      renderCleaningModule();
      lucide.createIcons();
      setTimeout(()=>{
        const hidden = document.getElementById('section-cleaning').classList.contains('hidden');
        switchTab(hidden ? 'evaluate' : 'cleaning');
      }, 150);
    }

    // ══════════════════════════════════════════════
    // 資料管理
    // ══════════════════════════════════════════════
    function generateDefaultEval(s=5) {
      let d={};
      EMPLOYEES.forEach(emp=>{
        d[emp.name]={ station:STATIONS[0].id, grade:'' };
        STATIONS.forEach(st=>{
          d[emp.name][st.id]={};
          st.criteria.forEach(c=>{ d[emp.name][st.id][c.id]={ score:s, note:'' }; });
        });
      });
      return d;
    }
    function generateDefaultCleaning() {
      let d={};
      ALL_EMPLOYEES.forEach(emp=>{ d[emp.name]={ selected:false, stars:0 }; });
      return d;
    }
    function loadDataFromStorage() {
      let s = JSON.parse(localStorage.getItem('EvalSystemDB_v2'));
      if (!s) {
        s = { lastDate:todayString, current:generateDefaultEval(), currentCleaning:generateDefaultCleaning(), history:{}, historyCleaning:{} };
      } else if (s.lastDate !== todayString) {
        s.history[s.lastDate]         = s.current;
        s.historyCleaning[s.lastDate] = s.currentCleaning;
        s.current         = generateDefaultEval();
        s.currentCleaning = generateDefaultCleaning();
        s.lastDate        = todayString;
      }
      if(!s.current)         s.current={};
      if(!s.currentCleaning) s.currentCleaning={};
      EMPLOYEES.forEach(emp=>{
        if(!s.current[emp.name]){
          s.current[emp.name]={ station:STATIONS[0].id, grade:'' };
          STATIONS.forEach(st=>{ s.current[emp.name][st.id]={}; st.criteria.forEach(c=>{ s.current[emp.name][st.id][c.id]={ score:5, note:'' }; }); });
        }
      });
      ALL_EMPLOYEES.forEach(emp=>{ if(!s.currentCleaning[emp.name]) s.currentCleaning[emp.name]={ selected:false, stars:0 }; });
      currentEvalData = s.current;
      cleaningData    = s.currentCleaning;
      localStorage.setItem('EvalSystemDB_v2', JSON.stringify(s));
    }

    function getGradeTableKey(tier) {
      return { A:'到職1年以內', B:'到職1~3年', C:'到職3~5年', D:'到職5~8年' }[tier] || '到職1年以內';
    }
    function getSuggestedGrade(name, score) {
      const emp = EMPLOYEES.find(e=>e.name===name);
      if (!emp) return null;
      const label = getGradeTableKey(emp.gradeTier);
      const t = GRADE_TABLE[label];
      const s = parseFloat(score);
      let grade = s>=90?t.over90 : s>=80?t.over80 : s>=70?t.over70 : s>=60?t.over60 : t.under60;
      return { grade, seniorityLabel:label };
    }
    function calculateScore(data, name) {
      if (data[name]?.precalculatedScore !== undefined) return data[name].precalculatedScore;
      const stId = data[name].station || STATIONS[0].id;
      const st   = STATIONS.find(s=>s.id===stId) || STATIONS[0];
      let total  = 0;
      st.criteria.forEach(c=>{ const d=data[name][stId]; if(d&&d[c.id]) total+=(d[c.id].score*10)*c.weight; });
      return total.toFixed(1);
    }

    // ══════════════════════════════════════════════
    // 渲染
    // ══════════════════════════════════════════════
    function renderStationSelector() {
      document.getElementById('station-selector').innerHTML = STATIONS.map(st=>`
        <button class="station-btn ${currentEvalData[currentSelectedEmp]?.station===st.id?'active':''}"
          onclick="selectStation('${st.id}')" id="station-btn-${st.id}">
          <div class="icon-wrapper"><i data-lucide="${st.icon}" class="w-4 h-4 ${st.color}"></i></div>
          <span>${st.name}</span>
        </button>`).join('');
      lucide.createIcons();
    }
    function selectStation(id) {
      currentEvalData[currentSelectedEmp].station = id; currentStation = id;
      STATIONS.forEach(st=>{ const b=document.getElementById(`station-btn-${st.id}`); if(b) b.className=`station-btn ${id===st.id?'active':''}`; });
      renderEvaluationForm(); updateTotalAndSuggestion();
    }
    function renderEmployeeList() {
      document.getElementById('employee-list').innerHTML = EMPLOYEES.map(emp=>{
        const grade=currentEvalData[emp.name]?.grade, gc=grade?GRADE_COLORS[grade]:null, done=!!grade;
        const safeName = escapeHtml(emp.name);
        let btnC="snap-start flex-shrink-0 flex items-center justify-between p-3 md:p-4 rounded-xl md:rounded-2xl transition-all border ";
        let icoC="w-8 h-8 rounded-full flex items-center justify-center transition-colors ";
        if(emp.name===currentSelectedEmp){ btnC+="bg-[#6C8673] text-white border-[#6C8673] shadow-lg shadow-[#6C8673]/20"; icoC+="bg-[#5A705F]"; }
        else if(done){ btnC+="bg-[#EAF0EB] text-[#2D3A31] border-[#D4DCD5] hover:bg-[#DDE3DE] hover:shadow-sm"; icoC+="bg-[#D4DCD5]/60"; }
        else { btnC+="bg-white text-[#4F6354] border-[#D4DCD5] hover:bg-[#F8FAF8] hover:shadow-sm"; icoC+="bg-[#F0F4F1]"; }
        return `<button id="btn-emp-${safeName}" onclick="selectEmployee('${safeName}')" class="${btnC}">
          <div class="flex items-center space-x-2 md:space-x-3">
            <div class="${icoC}"><i data-lucide="${done&&emp.name!==currentSelectedEmp?'check':'user'}" class="w-4 h-4"></i></div>
            <span class="font-medium tracking-wide text-sm md:text-base whitespace-nowrap">${safeName}</span>
          </div>
          <span id="grade-badge-${safeName}" class="grade-badge ${grade?'grade-'+grade:'hidden'} ml-2" ${grade?`style="background:${gc.bg};color:${gc.text};"`:''}>${grade||''}</span>
        </button>`;
      }).join('');
      lucide.createIcons();
    }
    function selectEmployee(name) {
      currentSelectedEmp=name; currentStation=currentEvalData[name].station||STATIONS[0].id;
      document.getElementById('current-emp-name').innerText=name;
      renderEmployeeList(); renderStationSelector(); renderEvaluationForm(); updateTotalAndSuggestion();
    }
    function renderEvaluationForm() {
      const stId=currentEvalData[currentSelectedEmp].station||STATIONS[0].id;
      const st=STATIONS.find(s=>s.id===stId)||STATIONS[0];
      const ed=currentEvalData[currentSelectedEmp][stId];
      document.getElementById('criteria-form').innerHTML = st.criteria.map(c=>{
        const d=ed[c.id]||{ score:5, note:'' };
        return `<div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 lg:gap-6 p-5 md:p-6 rounded-2xl bg-[#F8FAF8] border border-[#E5EBE6] hover:bg-white transition-colors">
          <div class="lg:w-1/3">
            <div class="flex items-center space-x-2 mb-1">
              <h3 class="text-base md:text-lg font-medium text-[#2D3A31]">${c.name}</h3>
              <span class="px-2 py-0.5 rounded-full bg-[#E5EBE6] text-[#687A6B] text-[10px] font-medium">${Math.round(c.weight*100)}%</span>
            </div>
            <p class="text-xs md:text-sm text-[#687A6B]">${c.desc}</p>
          </div>
          <div class="lg:w-2/3 space-y-4 mt-2 lg:mt-0">
            <div class="flex items-center space-x-3 md:space-x-4">
              <button onclick="adjustScore('${stId}','${c.id}',-1)" class="w-8 h-8 rounded-full bg-[#D4DCD5] flex items-center justify-center text-[#4F6354] hover:bg-[#C3D0C6] active:scale-95 transition-all">-</button>
              <input type="range" min="1" max="10" value="${d.score}" id="slider-${c.id}" oninput="updateScore('${stId}','${c.id}',this.value)" class="flex-1 h-2 bg-[#D4DCD5] rounded-lg cursor-pointer"/>
              <button onclick="adjustScore('${stId}','${c.id}',1)"  class="w-8 h-8 rounded-full bg-[#D4DCD5] flex items-center justify-center text-[#4F6354] hover:bg-[#C3D0C6] active:scale-95 transition-all">+</button>
              <div id="score-display-${c.id}" class="w-10 h-10 ml-2 flex-shrink-0 flex items-center justify-center bg-[#6C8673] text-white rounded-xl shadow-sm text-lg">${d.score}</div>
            </div>
            <div class="relative">
              <i data-lucide="message-square" class="absolute top-2.5 left-3 w-4 h-4 text-[#8FA192]"></i>
              <input type="text" placeholder="新增備註 (選填)..." value="${escapeHtml(d.note)}" onchange="updateNote('${stId}','${c.id}',this.value)"
                class="w-full pl-9 pr-4 py-2 bg-white border border-[#D4DCD5] rounded-xl text-xs md:text-sm focus:ring-2 focus:ring-[#8FA192]/30 focus:outline-none text-[#2D3A31]"/>
            </div>
          </div>
        </div>`;
      }).join('');
      lucide.createIcons();
    }
    function adjustScore(stId,cId,delta) {
      if(!currentEvalData[currentSelectedEmp][stId]) return;
      delete currentEvalData[currentSelectedEmp].precalculatedScore;
      let s=Math.min(10,Math.max(1,currentEvalData[currentSelectedEmp][stId][cId].score+delta));
      currentEvalData[currentSelectedEmp][stId][cId].score=s;
      document.getElementById(`slider-${cId}`).value=s;
      document.getElementById(`score-display-${cId}`).innerText=s;
      updateTotalAndSuggestion();
    }
    function updateScore(stId,cId,val) {
      if(!currentEvalData[currentSelectedEmp][stId]) return;
      delete currentEvalData[currentSelectedEmp].precalculatedScore;
      currentEvalData[currentSelectedEmp][stId][cId].score=parseInt(val,10);
      document.getElementById(`score-display-${cId}`).innerText=val;
      updateTotalAndSuggestion();
    }
    function updateNote(stId,cId,val) {
      if(currentEvalData[currentSelectedEmp][stId]) currentEvalData[currentSelectedEmp][stId][cId].note=val;
    }
    function updateTotalAndSuggestion() {
      const score=calculateScore(currentEvalData,currentSelectedEmp);
      document.getElementById('current-total-score').innerText=score;
      const sug=getSuggestedGrade(currentSelectedEmp,score);
      const el=document.getElementById('seniority-suggestion');

      // ── 計算目前各級別已使用人數 ──
      let currentCounts = { O: 0, A: 0, B: 0, C: 0, D: 0 };
      EMPLOYEES.forEach(emp => {
        const g = currentEvalData[emp.name]?.grade;
        if (g) currentCounts[g]++;
      });

      let html=`<div class="flex flex-col gap-2 mt-3 p-4 rounded-2xl bg-[#F8FAF8] border border-[#E5EBE6]">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-semibold text-[#8FA192] uppercase tracking-widest">評定今日等級</span>
          ${sug?`<span class="text-[10px] bg-[#E5EBE6] text-[#687A6B] px-2 py-0.5 rounded-full">年資級距: ${sug.seniorityLabel}</span>`:''}
        </div>
        <div class="flex gap-2 sm:gap-3 flex-wrap">`;

      ['O','A','B','C','D'].forEach(g=>{
        const gc=GRADE_COLORS[g];
        const sel=currentEvalData[currentSelectedEmp]?.grade===g;
        
        // 算出剩餘名額 (如果當前員工已經是這個等級，不算佔用額外名額，以便正確呈現他的剩餘配額)
        let used = currentCounts[g] || 0;
        if (sel) used--;
        const remain = Math.max(0, GRADE_LIMITS[g] - used);
        const disabled = !sel && remain <= 0;

        html+=`<button onclick="${disabled ? '' : `applyGrade('${g}')`}"
          class="flex-1 min-w-[40px] h-12 sm:h-14 rounded-xl font-bold transition-all border-2 flex flex-col items-center justify-center
          ${sel?'ring-2 ring-offset-2 ring-[#8FA192] scale-105 shadow-sm': (disabled ? 'bg-[#E5EBE6] text-[#8FA192] border-[#D4DCD5] cursor-not-allowed opacity-50' : 'hover:scale-105 opacity-60 hover:opacity-100')}"
          style="${disabled ? '' : `background:${gc.bg};color:${gc.text};border-color:${sel?gc.text:gc.border};`}">
            <span class="text-sm sm:text-base">${g}</span>
            <span class="text-[10px] font-normal leading-none mt-1 opacity-80">${remain}/${GRADE_LIMITS[g]}</span>
          </button>`;
      });
      html+=`</div></div>`;
      el.innerHTML=html;
    }
    
    function applyGrade(grade) {
      // ── 檢查人數限制 ──
      let count = 0;
      EMPLOYEES.forEach(emp => {
        if (emp.name !== currentSelectedEmp && currentEvalData[emp.name]?.grade === grade) {
          count++;
        }
      });

      if (count >= GRADE_LIMITS[grade]) {
        showToast(`${grade}級名額已達上限！最多只能評價 ${GRADE_LIMITS[grade]} 位`, true);
        return;
      }

      currentEvalData[currentSelectedEmp].grade=grade;
      renderEmployeeList(); updateTotalAndSuggestion();
      showToast(`已評定 ${currentSelectedEmp} 今日等級為 ${grade}`);
    }

    // ══════════════════════════════════════════════
    // 儲存
    // ══════════════════════════════════════════════
    async function saveData() {
      let s=JSON.parse(localStorage.getItem('EvalSystemDB_v2'))||{};
      s.current=currentEvalData;
      localStorage.setItem('EvalSystemDB_v2',JSON.stringify(s));
      let records=[];
      EMPLOYEES.forEach(emp=>{
        const grade=currentEvalData[emp.name]?.grade;
        if(!grade) return;
        const stId=currentEvalData[emp.name]?.station||STATIONS[0].id;
        const stObj=STATIONS.find(s=>s.id===stId);
        const score=calculateScore(currentEvalData,emp.name);
        const details=currentEvalData[emp.name][stId]||{};
        let arr=[];
        if(stObj?.criteria) stObj.criteria.forEach(c=>{ if(details[c.id]){ const n=details[c.id].note?` (備註: ${details[c.id].note})`:''; arr.push(`【${c.name}】${details[c.id].score}分${n}`); } });
        const detailsStr=arr.join('\n');
        const gradeScore=GRADE_SCORES[grade]||0;
        const wt=parseFloat(score);
        records.push({ date:todayString, name:emp.name, station:stObj?.name||stId, score:wt, grade, details:detailsStr, finalScore:parseFloat((wt*0.7+gradeScore*0.3).toFixed(1)) });
      });
      if(!records.length){ showToast('尚未替任何員工設定等級，無資料可儲存'); return; }
      const modal=document.getElementById('status-modal');
      const loading=document.getElementById('modal-loading');
      const success=document.getElementById('modal-success');
      modal.showModal(); loading.classList.remove('hidden'); success.classList.add('hidden');
      try {
        const r=await (await fetch(GAS_API_URL,{ method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ type:'evaluation', date:todayString, records }) })).json();
        loading.classList.add('hidden');
        if(r.status==='success'){ success.classList.remove('hidden'); lucide.createIcons(); }
        else { modal.close(); showToast('雲端同步失敗，但已存在本機'); }
      } catch(e){ loading.classList.add('hidden'); modal.close(); showToast('網路錯誤：雲端同步失敗，已儲存於本機'); }
    }
    async function saveCleaningData() {
      let s=JSON.parse(localStorage.getItem('EvalSystemDB_v2'))||{};
      s.currentCleaning=cleaningData;
      localStorage.setItem('EvalSystemDB_v2',JSON.stringify(s));
      let records=[];
      ALL_EMPLOYEES.forEach(emp=>{ if(cleaningData[emp.name]?.selected) records.push({ name:emp.name, stars:cleaningData[emp.name].stars||0 }); });
      if(!records.length){ showToast('本機儲存成功 (無人參與清潔)'); return; }
      const modal=document.getElementById('status-modal');
      const loading=document.getElementById('modal-loading');
      const success=document.getElementById('modal-success');
      modal.showModal(); loading.classList.remove('hidden'); success.classList.add('hidden');
      try {
        const r=await (await fetch(GAS_API_URL,{ method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ type:'cleaning', date:todayString, records }) })).json();
        loading.classList.add('hidden');
        if(r.status==='success'){ success.classList.remove('hidden'); lucide.createIcons(); }
        else { modal.close(); showToast('雲端同步失敗'); }
      } catch(e){ loading.classList.add('hidden'); modal.close(); showToast('網路錯誤，請檢查連線'); }
    }

    // ══════════════════════════════════════════════
    // 清潔模組
    // ══════════════════════════════════════════════
    function renderCleaningModule() {
      document.getElementById('cleaning-emp-selector').innerHTML = ALL_EMPLOYEES.map(emp=>{
        const sel=cleaningData[emp.name]?.selected;
        const safeName = escapeHtml(emp.name);
        return `<button id="clean-sel-${safeName}" onclick="toggleCleaningEmp('${safeName}')"
          class="px-3 py-1.5 rounded-full text-sm border transition-all ${sel?'bg-[#6C8673] text-white border-[#6C8673]':'bg-white text-[#4F6354] border-[#D4DCD5] hover:border-[#8FA192]'}">${safeName}</button>`;
      }).join('');
      renderCleaningSelectedList();
    }
    function toggleCleaningEmp(name) {
      cleaningData[name].selected=!cleaningData[name].selected;
      if(!cleaningData[name].selected) cleaningData[name].stars=0;
      renderCleaningModule();
    }
    function renderCleaningSelectedList() {
      const sel=ALL_EMPLOYEES.filter(e=>cleaningData[e.name]?.selected);
      const c=document.getElementById('cleaning-selected-list');
      if(!sel.length){ c.innerHTML=`<p class="text-center text-[#8FA192] text-sm py-8">請從上方選擇今日例行清潔人員</p>`; return; }
      c.innerHTML=sel.map(emp=>{
        const stars=cleaningData[emp.name].stars||0;
        const safeName = escapeHtml(emp.name);
        return `<div class="flex items-center justify-between p-4 rounded-2xl bg-[#F8FAF8] border border-[#E5EBE6]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#E5EBE6] flex items-center justify-center text-[#3F5144] font-medium text-sm">${escapeHtml(emp.name.charAt(0))}</div>
            <span class="font-medium text-[#2D3A31]">${safeName}</span>
          </div>
          <div class="star-rating" id="stars-${safeName}">
            ${[1,2,3,4,5].map(n=>`<button class="star-btn ${n<=stars?'active':''}" onclick="setStars('${safeName}',${n})"><i data-lucide="star" class="w-6 h-6 ${n<=stars?'fill-current':''}"></i></button>`).join('')}
          </div>
        </div>`;
      }).join('');

    function setStars(name,n) {
      cleaningData[name].stars=n;
      const c=document.getElementById(`stars-${name}`);
      if(c) c.querySelectorAll('.star-btn').forEach((b,i)=>{ b.classList.toggle('active',i<n); const ic=b.querySelector('svg'); if(ic){ if(i<n) ic.classList.add('fill-current'); else ic.classList.remove('fill-current'); } });
    }

    // ══════════════════════════════════════════════
    // Tab & Nav
    // ══════════════════════════════════════════════
    function toggleGlobalMenu() { document.getElementById('global-nav-menu').classList.toggle('hidden'); }
    function updateTabIndicator() {
      const eb=document.getElementById('tab-evaluate'), cb=document.getElementById('tab-cleaning');
      const ind=document.getElementById('tab-indicator'), sc=document.getElementById('section-cleaning');
      if(!ind||!eb||!cb||!sc) return;
      const act=sc.classList.contains('hidden')?eb:cb;
      if(!act.offsetWidth) return;
      ind.style.width=`${act.offsetWidth}px`; ind.style.transform=`translateX(${act.offsetLeft}px)`;
    }
    window.addEventListener('resize', updateTabIndicator);
    function switchTab(tab) {
      const eb=document.getElementById('tab-evaluate'), cb=document.getElementById('tab-cleaning');
      const se=document.getElementById('section-evaluate'), sc=document.getElementById('section-cleaning');
      const ind=document.getElementById('tab-indicator');
      if(tab==='evaluate'){
        se.classList.remove('hidden'); sc.classList.add('hidden');
        eb.classList.remove('text-[#8FA192]','hover:text-[#4F6354]'); eb.classList.add('text-[#2D3A31]');
        cb.classList.remove('text-[#2D3A31]'); cb.classList.add('text-[#8FA192]','hover:text-[#4F6354]');
      } else {
        se.classList.add('hidden'); sc.classList.remove('hidden');
        cb.classList.remove('text-[#8FA192]','hover:text-[#4F6354]'); cb.classList.add('text-[#2D3A31]');
        eb.classList.remove('text-[#2D3A31]'); eb.classList.add('text-[#8FA192]','hover:text-[#4F6354]');
        renderCleaningModule();
      }
      updateTabIndicator();
      if(ind&&ind.classList.contains('opacity-0')) setTimeout(()=>ind.classList.remove('opacity-0'),50);
    }
    function showToast(msg, warn=false) {
      document.getElementById('toast-msg').innerText=msg;
      const t=document.getElementById('toast');
      if(warn){ t.classList.remove('bg-[#3F5144]/95'); t.classList.add('bg-orange-500/95'); }
      else     { t.classList.add('bg-[#3F5144]/95');   t.classList.remove('bg-orange-500/95'); }
      t.classList.remove('opacity-0','-translate-y-6','pointer-events-none');
      setTimeout(()=>t.classList.add('opacity-0','-translate-y-6','pointer-events-none'),3000);
    }
    async function fetchTodayHistory() {
      try {
        const r=await (await fetch(`${GAS_API_URL}?action=getHistory`)).json();
        if(r.status!=='success') return;
        const te=r.data.history?.[todayString]||{};
        const tc=r.data.historyCleaning?.[todayString]||{};
        Object.keys(te).forEach(name=>{
          if(!currentEvalData[name]) return;
          const rec=te[name], stId=rec.station, st=STATIONS.find(s=>s.id===stId);
          if(!st) return;
          currentEvalData[name].station=stId; currentEvalData[name].grade=rec.grade; currentEvalData[name].precalculatedScore=rec.precalculatedScore;
          if(!currentEvalData[name][stId]) currentEvalData[name][stId]={};
          if(rec.detailsText) st.criteria.forEach(c=>{
            const m=rec.detailsText.match(new RegExp(`【${c.name}】(\\d+)分(?:\\s*\\(備註:\\s*([^)]*)\\))?`));
            if(m) currentEvalData[name][stId][c.id]={ score:parseInt(m[1],10), note:m[2]||'' };
          });
        });
        Object.keys(tc).forEach(name=>{ if(cleaningData[name]){ cleaningData[name].selected=tc[name].selected; cleaningData[name].stars=tc[name].stars; } });
      } catch(e){ console.error('讀取今日雲端紀錄失敗:',e); }
    }
    document.addEventListener('click', e=>{
      const m=document.getElementById('global-nav-menu'), b=document.querySelector('button[onclick="toggleGlobalMenu()"]');
      if(m&&b&&!m.contains(e.target)&&!b.contains(e.target)) m.classList.add('hidden');
    });

    // ── 啟動 ──
    function hideAppLoader(){
      const loader = document.getElementById('app-loader');
      if (loader) { loader.classList.add('loaded'); setTimeout(()=>loader.remove(), 400); }
    }
    window.onload=async()=>{
      try { await Promise.race([initLiff(), new Promise(r=>setTimeout(r,3000))]); await initApp(); }
      catch(e){ console.error('嚴重錯誤:',e); }
      finally { hideAppLoader(); }
    };
  </script>
</body>
</html>
