<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>庫存盤點</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* 系統共用的質感莫蘭迪配色 */
      --sage: #6C8673;        
      --sage-light: #8FA192;  
      --sage-pale: #F0F4F1;   
      --olive: #5A705F;       
      --cream: #F6F7F2;       
      --warm-white: #ffffff;  
      --ink: #2D3A31;         
      --ink-soft: #4F6354;    
      --ink-muted: #8FA192;   
      --accent-red: #c0392b;  
      --border: #E5EBE6;      
      --border-dark: #D4DCD5; 
    }

    body { background: var(--cream); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.2s ease forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .slide-up { animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .card-border-ok   { border-left-color: var(--sage); }
    .card-border-warn { border-left-color: #ef4444; }
    .card-border-new  { border-left-color: var(--border-dark); }
    
    dialog { border: none; background: white; }
    dialog::backdrop { background: rgba(45,58,49,0.5); backdrop-filter: blur(4px); }

    /* ── TOP NAV (全系統通用) ── */
    .topbar {
        background: var(--sage);
        color: #fff;
        padding: 0 16px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; margin: 0; padding-left: 4px;}
    
    .nav-btn {
        display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        background: transparent; border: none; outline: none;
        cursor: pointer; color: white; transition: all 0.2s;
    }
    .nav-btn:hover { color: rgba(255, 255, 255, 0.8); transform: scale(1.05); }
    .nav-btn:active { transform: scale(0.95); }
  </style>
</head>
<body class="min-h-screen text-[#2D3A31]">

<nav class="sticky top-0 z-50 shadow-sm flex flex-col">
  <div class="topbar no-print">
    <div class="topbar-left relative">
        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="nav-btn">
            <i data-lucide="menu" class="w-6 h-6 stroke-[2.5]"></i>
        </button>
        <div class="flex items-center space-x-2 select-none ml-1">
            <i data-lucide="package" class="w-5 h-5 md:w-6 md:h-6 text-white stroke-[2.2]"></i>
            <h1 class="text-base md:text-xl font-bold tracking-widest text-white uppercase">庫存盤點</h1>
        </div>
        
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-3 w-52 bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-[var(--border)] overflow-hidden transition-all origin-top-left z-[1000]">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] border-b border-[var(--border)] transition-colors">
                <i data-lucide="calendar" class="w-4 h-4 text-[var(--ink-muted)]"></i> 值班系統
            </a>
            <a href="cash.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] border-b border-[var(--border)] transition-colors">
                <i data-lucide="circle-dollar-sign" class="w-4 h-4 text-[var(--ink-muted)]"></i> 每週金庫結算
            </a>
            <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] border-b border-[var(--border)] transition-colors">
                <i data-lucide="package" class="w-4 h-4 text-[var(--ink-muted)]"></i> 庫存盤點
            </a>
            <a href="clean.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] border-b border-[var(--border)] transition-colors">
                <i data-lucide="sparkles" class="w-4 h-4 text-[var(--ink-muted)]"></i> 清潔與值班管理
            </a>
            <a href="performance.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] transition-colors">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-[var(--ink-muted)]"></i> 績效評估系統
            </a>
        </div>
    </div>
    
    <div class="ml-auto flex gap-2">
      <button onclick="openRestock()" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
        <i data-lucide="package-plus" class="w-4 h-4"></i>
        進貨
      </button>
      <button onclick="openOrderModal()" class="relative flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
        叫貨
        <span id="order-badge" class="hidden absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#6C8673]">0</span>
      </button>
    </div>
  </div>

  <div class="bg-white border-b border-[var(--border-dark)]">
    <div class="max-w-2xl mx-auto px-4 relative flex">
      <button id="tab-count" onclick="switchTab('count')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[var(--ink)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
        今日盤點
      </button>
      <button id="tab-history" onclick="switchTab('history')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[var(--ink-muted)] hover:text-[var(--ink-soft)] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        歷史記錄
      </button>
      <button id="tab-overview" onclick="switchTab('overview')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[var(--ink-muted)] hover:text-[var(--ink-soft)] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
        總覽
      </button>
      <div id="tab-line" class="absolute bottom-0 left-0 h-[3px] bg-[var(--sage)] rounded-t-full transition-all duration-300 opacity-0" style="width:0"></div>
    </div>
  </div>

  <div id="progress-bar-wrap" class="bg-white border-b border-[var(--border)] hidden">
    <div class="max-w-2xl mx-auto px-4 py-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-[var(--ink-muted)] tracking-widest uppercase">今日盤點進度</span>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1.5 text-xs text-[var(--ink-soft)] font-medium cursor-pointer">
            <input type="checkbox" id="hide-counted-chk" onchange="toggleHideCounted()" class="rounded accent-[var(--sage)] w-3.5 h-3.5">
            隱藏已盤
          </label>
          <span id="progress-label" class="text-xs font-bold text-[var(--sage)]">0 / 0</span>
        </div>
      </div>
      <div class="h-1.5 bg-[var(--border-dark)] rounded-full overflow-hidden">
        <div id="progress-fill" class="h-full bg-[var(--sage)] rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-6 pb-40">

  <div id="section-count">
    <div id="quick-load-wrap" class="mb-6">
      <p class="text-xs font-semibold text-[var(--ink-muted)] tracking-widest uppercase mb-3">選擇今日盤點範圍</p>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="quickLoad('每日')" class="flex flex-col items-start gap-1 p-4 bg-white rounded-2xl border border-[var(--border)] hover:border-[var(--sage)] hover:shadow-md transition-all active:scale-95 shadow-sm">
          <span class="text-lg">☀️</span>
          <span class="font-bold text-[var(--ink)] text-sm">每日盤點</span>
          <span class="text-[11px] text-[var(--ink-muted)]">食材、茶飲、常用品</span>
        </button>
        <button onclick="quickLoad('每周')" class="flex flex-col items-start gap-1 p-4 bg-white rounded-2xl border border-[var(--border)] hover:border-[var(--sage)] hover:shadow-md transition-all active:scale-95 shadow-sm">
          <span class="text-lg">📦</span>
          <span class="font-bold text-[var(--ink)] text-sm">每周盤點</span>
          <span class="text-[11px] text-[var(--ink-muted)]">調味、包材、備品</span>
        </button>
      </div>
    </div>

    <div id="back-to-select-wrap" class="mb-4 hidden fade-in">
      <button onclick="backToSelection()" class="flex items-center justify-center w-full sm:w-auto gap-2 text-sm font-bold text-[var(--ink-soft)] hover:text-[var(--ink)] hover:bg-[var(--sage-pale)] transition-all bg-white px-4 py-3 rounded-xl border border-[var(--border-dark)] shadow-sm active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        返回選擇畫面
      </button>
    </div>
    <div id="item-list" class="space-y-2"></div>

    <div id="save-section" class="mt-8 flex justify-end hidden">
      <button onclick="saveInventoryData()" class="w-full sm:w-auto flex items-center justify-center px-8 py-3.5 bg-[#6C8673] hover:bg-[#5A705F] text-white rounded-xl shadow-lg shadow-[#6C8673]/20 transition-all active:scale-95 font-medium tracking-wide">
        <i data-lucide="save" class="w-5 h-5 mr-2"></i> 儲存盤點紀錄
      </button>
    </div>
  </div>

  <div id="section-history" class="hidden">
    <div id="calendar-wrap" class="bg-white rounded-3xl shadow-sm border border-[var(--border)] p-5 mb-5"></div>
    <div id="history-detail" class="bg-white rounded-3xl shadow-sm border border-[var(--border)] overflow-hidden hidden fade-in">
      <div class="flex justify-between items-center px-5 py-4 border-b border-[var(--border)]">
        <h3 id="history-detail-title" class="font-bold text-[var(--ink)]"></h3>
        <button onclick="document.getElementById('history-detail').classList.add('hidden')" class="text-[var(--ink-muted)] hover:text-[var(--ink-soft)]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="history-detail-body" class="divide-y divide-[var(--border)] max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <div id="section-overview" class="hidden">
    <div class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-1">
      <button onclick="setOverviewFilter('counted')" id="ov-counted" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-[var(--sage)] text-white border-[var(--sage)]">今日已盤</button>
      <button onclick="setOverviewFilter('alert')" id="ov-alert" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-red-600 border-red-200">⚠ 需叫貨</button>
      <button onclick="setOverviewFilter('all')" id="ov-all" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-[var(--ink-soft)] border-[var(--border-dark)]">全部商品</button>
    </div>
    <div class="bg-white rounded-3xl shadow-sm border border-[var(--border)] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[var(--cream)] text-[var(--ink-muted)] text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">
          <tr>
            <th class="px-4 py-3 text-left">品名</th>
            <th class="px-4 py-3 text-right">帳面</th>
            <th class="px-4 py-3 text-right">實盤</th>
            <th class="px-4 py-3 text-right">盤差</th>
            <th class="px-4 py-3 text-center">狀態</th>
          </tr>
        </thead>
        <tbody id="overview-body" class="divide-y divide-[var(--sage-pale)]"></tbody>
      </table>
    </div>

    <div id="restock-log-section" class="mt-5 hidden">
      <p class="text-xs font-semibold text-[var(--ink-muted)] tracking-widest uppercase mb-3 pl-1">📦 今日進貨紀錄</p>
      <div id="restock-log-list" class="bg-white rounded-3xl shadow-sm border border-[var(--border)] divide-y divide-[var(--sage-pale)] overflow-hidden"></div>
    </div>

    <button onclick="exportCSV()" class="mt-4 w-full py-3 bg-white border border-[var(--border-dark)] rounded-2xl text-sm font-semibold text-[var(--ink-soft)] hover:bg-[var(--sage-pale)] transition-all flex items-center justify-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      匯出 CSV 報表
    </button>
  </div>

</main>

<div id="keypad" class="fixed bottom-0 left-0 right-0 z-[90] slide-up hidden">
  <div class="max-w-2xl mx-auto bg-[var(--border)] rounded-t-2xl shadow-2xl border-t border-[var(--sage-light)] overflow-hidden">
    <div class="bg-[var(--cream)] flex items-center justify-between px-4 py-2.5 border-b border-[var(--border-dark)]">
      <div class="flex items-center gap-2">
        <span id="keypad-unit-label" class="text-xs font-bold text-[var(--sage)] bg-[#DCE8DE] px-2.5 py-1 rounded-full">輸入數量</span>
        <span id="keypad-remaining" class="text-xs font-bold text-[var(--ink-soft)] bg-white border border-[var(--border-dark)] px-2 py-0.5 rounded-full">剩 0 項</span>
        <button id="keypad-clear" class="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-lg hover:bg-red-100 transition-all">清空</button>
      </div>
      <div class="flex gap-2">
        <button id="keypad-next" class="text-xs font-bold text-white bg-[var(--sage)] px-3 py-1.5 rounded-lg hover:bg-[var(--olive)] transition-all">下一項 ⏭</button>
        <button id="keypad-close" class="text-xs font-bold text-[var(--ink-soft)] bg-white border border-[var(--border-dark)] px-3 py-1.5 rounded-lg hover:bg-[var(--sage-pale)] transition-all">完成 ✓</button>
      </div>
    </div>
    <div id="keypad-hint" class="hidden text-center text-[11px] text-amber-700 bg-amber-50 border-b border-amber-200 py-1.5 font-medium"></div>
    <div class="grid grid-cols-3 gap-1.5 p-2.5 bg-[var(--border-dark)]">
      </div>
  </div>
</div>

<dialog id="order-modal" class="rounded-3xl shadow-2xl border border-[var(--border)] w-[92%] max-w-sm p-0">
  <div class="bg-red-500 text-white px-5 py-4 flex justify-between items-center">
    <h2 class="font-bold flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      今日需叫貨清單
    </h2>
    <button onclick="document.getElementById('order-modal').close()" class="hover:bg-red-600 p-1 rounded-full transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div id="order-body" class="p-4 max-h-72 overflow-y-auto space-y-2 bg-[var(--cream)]"></div>
  <div class="px-4 pb-4 flex gap-3 bg-[var(--cream)]">
    <button onclick="document.getElementById('order-modal').close()" class="flex-1 py-3 bg-white border-2 border-[var(--border-dark)] text-[var(--ink-soft)] rounded-xl font-semibold hover:bg-[var(--sage-pale)] transition-all">關閉</button>
    <button onclick="copyOrderList()" id="copy-order-btn" class="flex-[2] py-3 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 transition-all flex items-center justify-center gap-2 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      複製並傳 LINE
    </button>
  </div>
</dialog>

<dialog id="restock-modal" class="rounded-3xl shadow-2xl border border-[var(--border)] w-[92%] max-w-sm p-0">
  <div class="bg-[var(--sage)] text-white px-5 py-4 flex justify-between items-center">
    <h2 class="font-bold flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16h6"/><path d="M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 2 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/></svg>
      進貨 / 更新帳面
    </h2>
    <button onclick="document.getElementById('restock-modal').close()" class="hover:bg-[var(--olive)] p-1 rounded-full transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="p-4 space-y-4">
    <input id="restock-search" type="text" placeholder="搜尋品項名稱..." class="w-full px-4 py-2.5 border border-[var(--border-dark)] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[var(--sage)] bg-[var(--cream)]" oninput="filterRestockItems()">
    <div id="restock-list" class="max-h-52 overflow-y-auto space-y-1 rounded-xl border border-[var(--border)] bg-white"></div>
    <div id="restock-form" class="hidden space-y-3">
      <div class="bg-[var(--sage-pale)] rounded-xl p-3 text-sm">
        <div class="flex justify-between"><span class="text-[#687A6B]">品名</span><span id="rs-name" class="font-bold"></span></div>
        <div class="flex justify-between mt-1"><span class="text-[#687A6B]">目前帳面</span><span id="rs-cur" class="font-bold"></span></div>
      </div>
      <div>
        <label id="rs-qty-label" class="block text-xs font-bold text-[var(--ink-muted)] mb-1.5">本次進貨數量</label>
        <input id="rs-qty" type="number" inputmode="decimal" placeholder="輸入數量..." class="w-full px-4 py-3 border border-[var(--border-dark)] rounded-xl text-lg font-bold text-[var(--sage)] text-center focus:outline-none focus:ring-2 focus:ring-[var(--sage)] bg-[var(--sage-pale)]" oninput="updateRsPreview()">
      </div>
      <div id="rs-preview" class="hidden bg-[#DCE8DE] rounded-xl p-3 text-sm text-center text-[#3F5144] font-bold"></div>
      <button onclick="toggleRsMode()" id="rs-mode-toggle" class="text-xs font-semibold text-[var(--ink-muted)] hover:text-[var(--sage)] transition-colors">✎ 帳面數字不對？直接設定正確庫存</button>
    </div>
  </div>
  <div class="px-4 pb-4 flex gap-3">
    <button onclick="document.getElementById('restock-modal').close()" class="flex-1 py-3 bg-white border-2 border-[var(--border-dark)] text-[var(--ink-soft)] rounded-xl font-semibold hover:bg-[var(--sage-pale)] transition-all">取消</button>
    <button onclick="confirmRestock()" id="rs-confirm-btn" class="flex-[2] py-3 bg-[var(--sage)] text-white rounded-xl font-semibold hover:bg-[var(--olive)] transition-all disabled:opacity-40" disabled>確認更新</button>
  </div>
</dialog>

<dialog id="restock-success-modal" class="rounded-3xl shadow-2xl border border-[var(--border)] w-[88%] max-w-xs p-0">

const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
let todayCounts = {}; 
let systemStockMap = {}; 
let historyData = {};   
let activeInputId = null;
let hideCounted = false;
let currentTab = 'count';
let loadedTags = new Set();
let overviewFilter = 'counted';
let todayRestockLogs = []; 

let rsSelectedItem = null, rsMode = 'add';

// ─── INIT ───
async function init() {
  ITEMS.forEach(i => systemStockMap[i.id] = i.sys);

  try {
    const [{ data: records }, { data: overrides }, { data: logs }] = await Promise.all([
      sb.from('inventory_records').select('*'),
      sb.from('system_stock_overrides').select('*'),
      sb.from('restock_logs').select('*').eq('record_date', TODAY).order('created_at', { ascending: true }),
    ]);
    if (overrides) overrides.forEach(o => systemStockMap[o.item_id] = o.stock_value);
    if (records) {
      records.forEach(r => {
        if (!historyData[r.record_date]) historyData[r.record_date] = {};
        historyData[r.record_date][r.item_id] = r.actual_count;
        if (r.record_date === TODAY) todayCounts[r.item_id] = r.actual_count;
      });
    }
    if (logs) todayRestockLogs = logs;
    ITEMS.forEach(i => { if (todayCounts[i.id] !== undefined) loadedTags.add(i.tag); });
  } catch(e) { showToast('無法連線雲端資料庫', true); }

  buildKeypad();
  switchTab('count');
  setTimeout(updateTabLine, 100);
  window.addEventListener('resize', updateTabLine);
  lucide.createIcons();
}

// ─── TAB ───
function switchTab(tab) {
  currentTab = tab;
  ['count','history','overview'].forEach(t => {
    document.getElementById(`section-${t}`).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById(`tab-${t}`);
    if (t === tab) {
      btn.classList.remove('text-[var(--ink-muted)]','hover:text-[var(--ink-soft)]');
      btn.classList.add('text-[var(--ink)]');
    } else {
      btn.classList.add('text-[var(--ink-muted)]','hover:text-[var(--ink-soft)]');
      btn.classList.remove('text-[var(--ink)]');
    }
  });
  document.getElementById('progress-bar-wrap').classList.toggle('hidden', tab !== 'count' || loadedTags.size === 0);
  if (tab === 'count') renderItemList();
  if (tab === 'history') renderCalendar();
  if (tab === 'overview') renderOverview();
  updateTabLine();
  closeKeypad();
}

function updateTabLine() {
  const tabs = ['count','history','overview'];
  const idx = tabs.indexOf(currentTab);
  const btn = document.getElementById(`tab-${currentTab}`);
  const line = document.getElementById('tab-line');
  if (!btn || !line) return;
  line.style.width = btn.offsetWidth + 'px';
  line.style.transform = `translateX(${btn.offsetLeft}px)`;
  line.classList.remove('opacity-0');
}

// ─── QUICK LOAD (載入盤點區域) ───
async function quickLoad(tag) {
  const tagItems = ITEMS.filter(i => i.tag === tag);
  const newIds = tagItems.filter(i => todayCounts[i.id] === undefined).map(i => i.id);
  newIds.forEach(id => { todayCounts[id] = ''; });
  loadedTags.add(tag);

  document.getElementById('quick-load-wrap').classList.add('hidden');
  document.getElementById('back-to-select-wrap').classList.remove('hidden'); // 顯示返回按鈕
  document.getElementById('progress-bar-wrap').classList.remove('hidden');
  
  closeKeypad(); // <--- 新增：確保載入新畫面時鍵盤是關閉的
  renderItemList();
  updateProgress();
}

// ─── 返回選擇畫面 ───
function backToSelection() {
  // 清除尚未盤點（沒輸入數字）的暫存項目，讓使用者可以真正「重新選擇」或「取消」
  Object.keys(todayCounts).forEach(id => {
    if (todayCounts[id] === '') {
      delete todayCounts[id];
    }
  });
  
  // 重新結算目前有載入的 tags
  loadedTags.clear();
  ITEMS.forEach(i => {
    if (todayCounts[i.id] !== undefined && todayCounts[i.id] !== '') {
      loadedTags.add(i.tag);
    }
  });

  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);

  // 切換 UI 狀態
  closeKeypad(); // <--- 新增：返回首頁時強制收起小鍵盤

  // 切換 UI 狀態
  document.getElementById('quick-load-wrap').classList.remove('hidden');
  document.getElementById('back-to-select-wrap').classList.add('hidden');
  document.getElementById('item-list').classList.add('hidden');
  document.getElementById('save-section').classList.add('hidden');
  
  if (loadedItems.length === 0) {
    document.getElementById('progress-bar-wrap').classList.add('hidden');
  } else {
    updateProgress(); 
  }
}

// ─── RENDER ITEM LIST ───
function renderItemList() {
  const container = document.getElementById('item-list');
  container.classList.remove('hidden'); // 確保列表在切換分頁時是顯示的

  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const backWrap = document.getElementById('back-to-select-wrap');

  if (loadedItems.length === 0) {
    document.getElementById('quick-load-wrap').classList.remove('hidden');
    if (backWrap) backWrap.classList.add('hidden');
    container.innerHTML = '';
    
    const saveSection = document.getElementById('save-section');
    if (saveSection) saveSection.classList.add('hidden');
    return;
  }
  
  document.getElementById('quick-load-wrap').classList.add('hidden');
  if (backWrap) backWrap.classList.remove('hidden');

  const groups = {};
  loadedItems.forEach(i => {
    if (!groups[i.tag]) groups[i.tag] = [];
    groups[i.tag].push(i);
  });

  let html = '';
  ['每日','每周'].forEach(tag => {
    if (!groups[tag]) return;
    const items = hideCounted ? groups[tag].filter(i => todayCounts[i.id] === '' || todayCounts[i.id] === null || todayCounts[i.id] === undefined) : groups[tag];
    if (items.length === 0) return;
    html += `<div class="mb-1">
      <div class="sticky top-[${tag==='每日'?'108':'108'}px] z-10 py-2">
        <span class="inline-block px-3 py-1 bg-[var(--sage)] text-white text-xs font-bold rounded-lg shadow-sm">📌 ${tag}</span>
      </div>
      <div class="space-y-2">${items.map(item => renderCard(item)).join('')}</div>
    </div>`;
  });

  container.innerHTML = html || `<div class="text-center py-12 text-[var(--ink-muted)]">🎉 全部品項盤點完成！</div>`;

  const saveSection = document.getElementById('save-section');
  if (saveSection) {
    if (loadedItems.length > 0) {
      saveSection.classList.remove('hidden');
    } else {
      saveSection.classList.add('hidden');
    }
  }
}

function renderCard(item) {
  const raw = todayCounts[item.id];
  const hasCounted = raw !== '' && raw !== null && raw !== undefined;
  const count = parseFloat(raw);
  const sys = systemStockMap[item.id] ?? item.sys;
  const isLow = hasCounted && !isNaN(count) && count < item.alert;
  const isActive = activeInputId === item.id;

  let displayVal = '';
  if (hasCounted && !isNaN(count)) {
    displayVal = item.conv ? String(Math.round(count * item.conv * 100)/100) : String(count);
  }

  let varianceHtml = '';
  if (hasCounted && !isNaN(count)) {
    const v = count - sys;
    const pct = Math.abs(v) / (sys || 1);
    const isAbnormal = pct > 0.05 && sys > 0;
    const vText = v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
    const vColor = isAbnormal ? 'text-orange-600 font-bold' : 'text-[#687A6B]';
    varianceHtml = `<span class="text-xs ${vColor}">盤差 ${vText} ${item.unit}</span>`;
  }

  const borderClass = isLow ? 'card-border-warn' : hasCounted ? 'card-border-ok' : 'card-border-new';

  return `
  <div id="card-${item.id}" class="bg-white rounded-2xl border-l-4 ${borderClass} border border-[var(--border)] p-4 transition-all ${isActive?'ring-2 ring-[var(--sage)]/40 shadow-md':'shadow-sm'}">
    <div class="flex items-start justify-between mb-3">
      <div>
        <h3 class="font-semibold text-[var(--ink)] text-sm">${item.name}</h3>
        <p class="text-[11px] text-[var(--ink-muted)] mt-0.5">${item.spec || '—'} · 安全 ${item.alert} ${item.unit}</p>
      </div>
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${hasCounted ? isLow ? 'bg-red-100 text-red-600' : 'bg-[#DCE8DE] text-[var(--ink-soft)]' : 'bg-[var(--sage-pale)] text-[var(--ink-muted)]'}">
        ${hasCounted ? isLow ? '⚠ 需叫貨' : '✓ 已盤' : '待盤點'}
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="stepCard(${item.id},-1)" class="w-9 h-9 rounded-xl bg-[var(--sage-pale)] text-[var(--ink-soft)] font-bold text-lg flex items-center justify-center hover:bg-[var(--border-dark)] active:scale-95 transition-all">−</button>
      <div onclick="focusCard(${item.id})" class="flex-1 h-10 flex items-center justify-center border-2 rounded-xl cursor-pointer transition-all font-bold text-base ${isActive ? 'border-[var(--sage)] bg-[var(--sage-pale)] text-[var(--ink-soft)]' : displayVal ? 'border-[#A3B4A5] text-[var(--ink)]' : 'border-[var(--border-dark)] text-[#C3D0C6]'}" >
        ${displayVal || '<span class="font-normal text-sm">點擊輸入</span>'}
        ${displayVal ? `<span class="text-xs font-normal text-[var(--ink-muted)] ml-1">${item.conv ? item.subUnit : item.unit}</span>` : ''}
      </div>
      <button onclick="stepCard(${item.id},1)" class="w-9 h-9 rounded-xl bg-[var(--sage-pale)] text-[var(--ink-soft)] font-bold text-lg flex items-center justify-center hover:bg-[var(--border-dark)] active:scale-95 transition-all">＋</button>
    </div>
    <div class="flex justify-between items-center mt-2 text-[11px]">
      <span class="text-[var(--ink-muted)]">帳面 ${sys} ${item.unit}${item.conv ? ` (${Math.round(sys*item.conv)}${item.subUnit})` : ''}</span>
      ${varianceHtml}
    </div>
    ${isLow ? `<div class="mt-2 text-xs text-red-600 font-medium flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>低於安全警戒，需叫貨</div>` : ''}
  </div>`;
}

function stepCard(id, delta) {
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;
  const isSubUnit = item.conv;
  let cur = todayCounts[id];
  let mainVal = (cur === '' || cur === null || cur === undefined) ? 0 : parseFloat(cur);
  if (isNaN(mainVal)) mainVal = 0;
  if (isSubUnit) {
    let subVal = Math.round(mainVal * item.conv * 100) / 100;
    subVal = Math.max(0, subVal + delta);
    mainVal = Math.round(subVal / item.conv * 1000) / 1000;
  } else {
    mainVal = Math.max(0, Math.round((mainVal + delta) * 10) / 10);
  }
  saveCount(id, mainVal);
}

function focusCard(id) {
  activeInputId = id;
  const item = ITEMS.find(i => i.id === id);
  document.getElementById('keypad-unit-label').textContent = `輸入 ${item.conv ? item.subUnit : item.unit}`;
  if (item.conv) {
    document.getElementById('keypad-hint').textContent = `換算提示：輸入【${item.subUnit}】，系統自動換算為【${item.unit}】儲存`;
    document.getElementById('keypad-hint').classList.remove('hidden');
  } else {
    document.getElementById('keypad-hint').classList.add('hidden');
  }
  updateKeypadRemaining();
  document.getElementById('keypad').classList.remove('hidden');
  setTimeout(() => {
    const card = document.getElementById(`card-${id}`);
    if (card) {
      const y = card.getBoundingClientRect().top + window.pageYOffset - 220;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }, 60);
  renderItemList();
}

function closeKeypad() {
  activeInputId = null;
  document.getElementById('keypad').classList.add('hidden');
}

function updateKeypadRemaining() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const remaining = loadedItems.filter(i => {
    const v = todayCounts[i.id];
    return v === '' || v === null || v === undefined;
  }).length;
  document.getElementById('keypad-remaining').textContent = `剩 ${remaining} 項`;
}

// ─── KEYPAD ───
function buildKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  const grid = document.querySelector('#keypad .grid');
  grid.innerHTML = keys.map(k => `
    <button class="kp-key bg-white py-3 text-xl font-bold rounded-xl shadow-sm active:bg-[var(--sage-pale)] active:scale-95 transition-all text-[var(--ink)] flex items-center justify-center">${k}</button>
  `).join('');
  grid.querySelectorAll('.kp-key').forEach(btn => {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); handleKey(btn.textContent.trim()); });
  });
  document.getElementById('keypad-clear').addEventListener('pointerdown', e => { e.preventDefault(); if(activeInputId) saveCount(activeInputId, ''); renderItemList(); });
  document.getElementById('keypad-close').addEventListener('pointerdown', e => { e.preventDefault(); closeKeypad(); renderItemList(); });
  document.getElementById('keypad-next').addEventListener('pointerdown', e => {
    e.preventDefault();
    const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
    const curIdx = loadedItems.findIndex(i => i.id === activeInputId);
    const next = loadedItems.slice(curIdx + 1).find(i => {
      const v = todayCounts[i.id]; return v === '' || v === null || v === undefined;
    });
    if (next) focusCard(next.id); else { closeKeypad(); showToast('所有項目已盤點完成！'); renderItemList(); }
  });
}

function handleKey(k) {
  if (!activeInputId) return;
  const item = ITEMS.find(i => i.id === activeInputId);
  const isSubUnit = item && item.conv;
  let raw = todayCounts[activeInputId];
  let displayStr = '';
  if (raw !== '' && raw !== null && raw !== undefined && !isNaN(parseFloat(raw))) {
    displayStr = isSubUnit ? String(Math.round(parseFloat(raw) * item.conv * 100)/100) : String(raw);
  }
  if (k === '⌫') displayStr = displayStr.slice(0,-1);
  else if (k === '.') { if (!displayStr.includes('.')) displayStr += '.'; }
  else displayStr += k;

  if (displayStr === '') { saveCount(activeInputId, ''); return; }
  let finalVal = parseFloat(displayStr);
  if (!isNaN(finalVal)) {
    if (isSubUnit) finalVal = Math.round(finalVal / item.conv * 1000) / 1000;
    saveCount(activeInputId, finalVal);
  }
}

function saveCount(id, val) {
  todayCounts[id] = val;
  updateProgress();
  updateKeypadRemaining();
  const card = document.getElementById(`card-${id}`);
  if (card) {
    const item = ITEMS.find(i => i.id === id);
    card.outerHTML = renderCard(item);
    if (activeInputId === id) {
      const newCard = document.getElementById(`card-${id}`);
      if (newCard) newCard.classList.add('ring-2','ring-[var(--sage)]/40','shadow-md');
    }
  }
  updateOrderBadge();
  const count = val === '' ? null : parseFloat(val);
}

async function saveInventoryData() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  
  // 組合要上傳的資料
  const records = loadedItems.map(item => {
    const val = todayCounts[item.id];
    const count = (val === '' || val === null || val === undefined) ? null : parseFloat(val);
    return {
      record_date: TODAY,
      item_id: item.id,
      actual_count: isNaN(count) ? null : count
    };
  });

  if (records.length === 0) {
    showToast('目前沒有可儲存的盤點資料');
    return;
  }

  // 叫出彈出視窗與 loading 動畫
  const modal = document.getElementById('status-modal');
  const loading = document.getElementById('modal-loading');
  const success = document.getElementById('modal-success');
  
  modal.showModal();
  loading.classList.remove('hidden');
  success.classList.add('hidden');

  try {
    // 一次性將所有資料送到 Supabase
    const { error } = await sb.from('inventory_records').upsert(records, { onConflict: 'record_date, item_id' });
    if (error) throw error;
    
    // 成功後切換視窗狀態
    loading.classList.add('hidden');
    success.classList.remove('hidden');
    lucide.createIcons(); // 確保成功打勾圖示正確渲染
  } catch (error) {
    loading.classList.add('hidden');
    modal.close();
    showToast('網路連線錯誤，儲存失敗', true);
    console.error('儲存失敗:', error);
  }
}

function updateProgress() {
  const loaded = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const done = loaded.filter(i => { const v = todayCounts[i.id]; return v !== '' && v !== null && v !== undefined; });
  const pct = loaded.length ? Math.round(done.length / loaded.length * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done.length} / ${loaded.length}`;
}

function toggleHideCounted() {
  hideCounted = document.getElementById('hide-counted-chk').checked;
  renderItemList();
}

// ─── ORDER BADGE ───
function updateOrderBadge() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const alertItems = loadedItems.filter(i => {
    const v = todayCounts[i.id];
    if (v === '' || v === null || v === undefined) return false;
    const c = parseFloat(v); return !isNaN(c) && c < i.alert;
  });
  const badge = document.getElementById('order-badge');
  badge.textContent = alertItems.length;
  badge.classList.toggle('hidden', alertItems.length === 0);
}

// ─── ORDER MODAL ───
function openOrderModal() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const alertItems = loadedItems.filter(i => {
    const v = todayCounts[i.id];
    if (v === '' || v === null || v === undefined) return false;
    const c = parseFloat(v); return !isNaN(c) && c < i.alert;
  });
  const body = document.getElementById('order-body');
  if (alertItems.length === 0) {
    body.innerHTML = `<div class="text-center py-8"><div class="text-4xl mb-2">✅</div><p class="font-bold text-[var(--ink)]">庫存都很充足！</p><p class="text-sm text-[var(--ink-muted)] mt-1">已盤品項皆在安全量以上</p></div>`;
    document.getElementById('copy-order-btn').classList.add('hidden');
  } else {
    body.innerHTML = alertItems.map(i => `
      <div class="flex items-center justify-between p-3 bg-[var(--cream)] rounded-xl border border-[var(--border)]">
        <div><p class="font-semibold text-sm text-[var(--ink)]">${i.name}</p><p class="text-[11px] text-[var(--ink-muted)]">${i.spec || '—'}</p></div>
        <div class="text-right bg-red-50 border border-red-200 rounded-lg px-3 py-1.5">
          <p class="font-bold text-red-600 text-sm">剩 ${todayCounts[i.id]} ${i.unit}</p>
          <p class="text-[10px] text-red-400">低於 ${i.alert}</p>
        </div>
      </div>
    `).join('');
    document.getElementById('copy-order-btn').classList.remove('hidden');
  }
  document.getElementById('order-modal').showModal();
}

async function copyOrderList() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const alertItems = loadedItems.filter(i => {
    const v = todayCounts[i.id]; if (v===''||v===null) return false;
    return parseFloat(v) < i.alert;
  });
  let text = `【${TODAY} 叫貨清單】\n\n`;
  alertItems.forEach(i => { text += `▪ ${i.name}：剩 ${todayCounts[i.id]} ${i.unit}\n`; });
  try { await navigator.clipboard.writeText(text); showToast('已複製，可貼至 LINE'); } 
  catch { window.open(`line://msg/text/${encodeURIComponent(text)}`, '_blank'); }
  document.getElementById('order-modal').close();
}

// ─── OVERVIEW ───
function setOverviewFilter(f) {
  overviewFilter = f;
  document.querySelectorAll('.ov-btn').forEach(b => {
    b.classList.remove('bg-[var(--sage)]','text-white','border-[var(--sage)]','bg-red-500','border-red-500');
    if (b.id === 'ov-alert') {
      b.classList.add('bg-white','text-red-600','border-red-200');
    } else {
      b.classList.add('bg-white','text-[var(--ink-soft)]','border-[var(--border-dark)]');
    }
  });
  const btn = document.getElementById(`ov-${f}`);
  btn.classList.remove('bg-white','text-[var(--ink-soft)]','border-[var(--border-dark)]','text-red-600','border-red-200');
  if (f === 'alert') btn.classList.add('bg-red-500','text-white','border-red-500');
  else btn.classList.add('bg-[var(--sage)]','text-white','border-[var(--sage)]');
  renderOverview();
}

function renderOverview() {
  let list = ITEMS;
  let emptyMsg = '無符合條件的品項';

  if (overviewFilter === 'counted') {
    list = list.filter(i => {
      const v = todayCounts[i.id];
      return v !== undefined && v !== '' && v !== null;
    });
    emptyMsg = '今天還沒有盤點任何品項，到「今日盤點」分頁開始吧';
  } else if (overviewFilter === 'alert') {
    list = list.filter(i => {
      const v = todayCounts[i.id]; if (v===''||v===null||v===undefined) return false;
      const c = parseFloat(v); return !isNaN(c) && c < i.alert;
    });
    emptyMsg = '目前沒有低於安全量的品項 🎉';
  }

  const tbody = document.getElementById('overview-body');
  tbody.innerHTML = list.map(item => {
    const sys = systemStockMap[item.id] ?? item.sys;
    const raw = todayCounts[item.id];
    const has = raw !== undefined && raw !== '' && raw !== null;
    const c = parseFloat(raw);
    let vt = '—', badge = `<span class="text-[10px] bg-[var(--sage-pale)] text-[var(--ink-muted)] px-2 py-0.5 rounded-full">未盤</span>`;
    let vColor = 'text-[var(--ink-muted)]';
    if (has && !isNaN(c)) {
      const v = c - sys; const pct = Math.abs(v)/(sys||1);
      vt = v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
      if (c < item.alert) { badge = `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold">缺貨</span>`; vColor='text-red-600 font-bold'; }
      else if (pct > 0.05 && sys > 0) { badge = `<span class="text-[10px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-bold">異常</span>`; vColor='text-orange-600 font-bold'; }
      else { badge = `<span class="text-[10px] bg-[#DCE8DE] text-[var(--ink-soft)] px-2 py-0.5 rounded-full">正常</span>`; }
    }
    return `<tr class="hover:bg-[var(--cream)] transition-colors">
      <td class="px-4 py-3"><p class="font-semibold text-[var(--ink)] text-sm">${item.name}</p><p class="text-[10px] text-[var(--ink-muted)]">${item.unit}</p></td>
      <td class="px-4 py-3 text-right text-[#687A6B] text-sm">${sys}</td>
      <td class="px-4 py-3 text-right font-bold text-[var(--ink)] text-sm">${has && !isNaN(c) ? c : '—'}</td>
      <td class="px-4 py-3 text-right text-sm ${vColor}">${vt}</td>
      <td class="px-4 py-3 text-center">${badge}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="px-4 py-10 text-center text-[var(--ink-muted)] text-sm">${emptyMsg}</td></tr>`;

  renderRestockLog();
}

function renderRestockLog() {
  const section = document.getElementById('restock-log-section');
  const list = document.getElementById('restock-log-list');
  if (!todayRestockLogs || todayRestockLogs.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = todayRestockLogs.map(log => {
    const time = log.created_at ? new Date(log.created_at).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }) : '';
    const qtyText = log.mode === 'add'
      ? `<span class="text-[var(--sage)] font-bold">+${log.qty}</span> ${log.unit}`
      : `<span class="text-[var(--sage)] font-bold">設定為 ${log.after_stock}</span> ${log.unit}`;
    return `
    <div class="flex items-center justify-between px-4 py-3">
      <div>
        <p class="font-semibold text-sm text-[var(--ink)]">${log.item_name}</p>
        <p class="text-[10px] text-[var(--ink-muted)] mt-0.5">${log.before_stock} → ${log.after_stock} ${log.unit}${time ? ` · ${time}` : ''}</p>
      </div>
      <div class="text-right text-sm">${qtyText}</div>
    </div>`;
  }).join('');
}

function exportCSV() {
  let csv = "\uFEFF品名,規格,標籤,帳面庫存,實際盤點,盤差,單位\n";
  ITEMS.forEach(i => {
    const sys = systemStockMap[i.id] ?? i.sys;
    const raw = todayCounts[i.id];
    const has = raw !== undefined && raw !== '' && raw !== null;
    const c = parseFloat(raw);
    const actual = has && !isNaN(c) ? c : '未盤點';
    const v = has && !isNaN(c) ? (c - sys).toFixed(1) : '';
    csv += `${i.name},${i.spec||''},${i.tag},${sys},${actual},${v},${i.unit}\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `庫存總表_${TODAY}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ─── HISTORY CALENDAR ───
let calMonth = new Date();
let selectedHistDate = null;

function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const daysIn = new Date(y,m+1,0).getDate();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysIn; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = historyData[ds] && Object.keys(historyData[ds]).some(k => historyData[ds][k] !== null);
    const isToday = ds === TODAY, isSel = ds === selectedHistDate;
    cells += `<div onclick="${has ? `selectHistDate('${ds}')` : ''}" class="h-10 flex flex-col items-center justify-center rounded-xl transition-all ${has?'cursor-pointer hover:bg-[var(--sage-pale)]':''} ${isSel?'bg-[var(--sage)] text-white':''} ${isToday&&!isSel?'bg-[var(--sage-pale)]':''}">
      <span class="text-sm font-medium ${isToday&&!isSel?'text-[var(--sage)] font-bold':has&&!isSel?'text-[var(--ink)]':'text-[#C3D0C6]'}">${d}</span>
      ${has ? `<div class="w-1.5 h-1.5 rounded-full mt-0.5 ${isSel?'bg-white':'bg-[var(--sage)]'}"></div>` : ''}
    </div>`;
  }
  document.getElementById('calendar-wrap').innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <button onclick="calNavMonth(-1)" class="p-2 rounded-xl hover:bg-[var(--sage-pale)] transition-all text-[var(--ink-soft)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h3 class="font-bold text-[var(--ink)]">${y}年 ${monthNames[m]}</h3>
      <button onclick="calNavMonth(1)" class="p-2 rounded-xl hover:bg-[var(--sage-pale)] transition-all text-[var(--ink-soft)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center mb-2">
      ${['日','一','二','三','四','五','六'].map(d=>`<div class="text-xs font-medium text-[var(--ink-muted)] py-1">${d}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-1">${cells}</div>
    ${!selectedHistDate ? `<p class="text-center text-sm text-[var(--ink-muted)] mt-4">點選有橘點的日期查看明細</p>` : ''}
  `;
}

function calNavMonth(delta) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  renderCalendar();
}

function selectHistDate(ds) {
  selectedHistDate = ds;
  renderCalendar();
  const dayData = historyData[ds] || {};
  const items = ITEMS.filter(i => dayData[i.id] !== undefined && dayData[i.id] !== null);
  document.getElementById('history-detail-title').textContent = `${ds} 盤點明細`;
  document.getElementById('history-detail-body').innerHTML = items.length === 0 
    ? `<p class="px-5 py-6 text-center text-[var(--ink-muted)] text-sm">無盤點資料</p>`
    : items.map(i => {
        const c = parseFloat(dayData[i.id]);
        const isLow = !isNaN(c) && c < i.alert;
        return `<div class="flex justify-between items-center px-5 py-3 hover:bg-[var(--cream)] transition-all">
          <div><p class="font-semibold text-sm text-[var(--ink)]">${i.name}</p><p class="text-[10px] text-[var(--ink-muted)]">安全 ${i.alert} ${i.unit}</p></div>
          <div class="text-right">
            <p class="font-bold ${isLow?'text-red-600':'text-[var(--sage)]'}">${dayData[i.id]} <span class="text-xs font-normal text-[var(--ink-muted)]">${i.unit}</span></p>
            ${isLow?`<p class="text-[10px] text-red-500">需叫貨</p>`:''}
          </div>
        </div>`;
      }).join('');
  document.getElementById('history-detail').classList.remove('hidden');
}

// ─── RESTOCK ───
function openRestock() {
  rsSelectedItem = null; rsMode = 'add';
  document.getElementById('restock-search').value = '';
  document.getElementById('restock-form').classList.add('hidden');
  document.getElementById('rs-confirm-btn').disabled = true;
  document.getElementById('rs-qty').value = '';
  document.getElementById('rs-preview').classList.add('hidden');
  filterRestockItems();
  document.getElementById('restock-modal').showModal();
}

function filterRestockItems() {
  const q = document.getElementById('restock-search').value.toLowerCase();

  if (!q) {
    const alertItems = ITEMS.filter(i => {
      const v = todayCounts[i.id]; if (v===''||v===null||v===undefined) return false;
      const c = parseFloat(v); return !isNaN(c) && c < i.alert;
    });
    const alertIds = new Set(alertItems.map(i => i.id));
    const rest = ITEMS.filter(i => !alertIds.has(i.id));
    const ordered = [...alertItems, ...rest].slice(0, 20);

    document.getElementById('restock-list').innerHTML = ordered.map(i => {
      const isAlert = alertIds.has(i.id);
      return `
      <div onclick="selectRestockItem(${i.id})" class="px-4 py-2.5 hover:bg-[var(--sage-pale)] cursor-pointer flex justify-between items-center transition-all border-b border-[var(--cream)] last:border-0">
        <span class="font-semibold text-sm text-[var(--ink)] flex items-center gap-1.5">${i.name}${isAlert ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full font-bold">需叫貨</span>' : ''}</span>
        <span class="text-xs text-[var(--ink-muted)]">${systemStockMap[i.id] ?? i.sys} ${i.unit}</span>
      </div>`;
    }).join('') || `<p class="px-4 py-4 text-center text-sm text-[var(--ink-muted)]">找不到品項</p>`;
    return;
  }

  const list = ITEMS.filter(i => i.name.toLowerCase().includes(q));
  document.getElementById('restock-list').innerHTML = list.slice(0,20).map(i => `
    <div onclick="selectRestockItem(${i.id})" class="px-4 py-2.5 hover:bg-[var(--sage-pale)] cursor-pointer flex justify-between items-center transition-all border-b border-[var(--cream)] last:border-0">
      <span class="font-semibold text-sm text-[var(--ink)]">${i.name}</span>
      <span class="text-xs text-[var(--ink-muted)]">${systemStockMap[i.id] ?? i.sys} ${i.unit}</span>
    </div>
  `).join('') || `<p class="px-4 py-4 text-center text-sm text-[var(--ink-muted)]">找不到品項</p>`;
}

function selectRestockItem(id) {
  rsSelectedItem = ITEMS.find(i => i.id === id);
  rsMode = 'add';
  document.getElementById('restock-search').value = rsSelectedItem.name;
  document.getElementById('restock-list').innerHTML = '';
  document.getElementById('rs-name').textContent = rsSelectedItem.name;
  document.getElementById('rs-cur').textContent = `${systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys} ${rsSelectedItem.unit}`;
  document.getElementById('rs-qty').value = '';
  document.getElementById('rs-qty-label').textContent = '本次進貨數量';
  document.getElementById('rs-qty').placeholder = '輸入數量...';
  document.getElementById('rs-mode-toggle').textContent = '✎ 帳面數字不對？直接設定正確庫存';
  document.getElementById('rs-preview').classList.add('hidden');
  document.getElementById('restock-form').classList.remove('hidden');
  document.getElementById('rs-confirm-btn').disabled = true;
}

function toggleRsMode() {
  rsMode = rsMode === 'add' ? 'set' : 'add';
  if (rsMode === 'set') {
    document.getElementById('rs-qty-label').textContent = '設定為帳面庫存';
    document.getElementById('rs-qty').placeholder = '輸入正確庫存數量...';
    document.getElementById('rs-mode-toggle').textContent = '← 改回「加入進貨量」';
  } else {
    document.getElementById('rs-qty-label').textContent = '本次進貨數量';
    document.getElementById('rs-qty').placeholder = '輸入數量...';
    document.getElementById('rs-mode-toggle').textContent = '✎ 帳面數字不對？直接設定正確庫存';
  }
  document.getElementById('rs-qty').value = '';
  document.getElementById('rs-preview').classList.add('hidden');
  document.getElementById('rs-confirm-btn').disabled = true;
}

function updateRsPreview() {
  if (!rsSelectedItem) return;
  const cur = systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys;
  const qty = parseFloat(document.getElementById('rs-qty').value);
  if (isNaN(qty)) { document.getElementById('rs-preview').classList.add('hidden'); document.getElementById('rs-confirm-btn').disabled=true; return; }
  const next = rsMode==='add' ? cur + qty : qty;
  document.getElementById('rs-preview').textContent = `更新後：${cur} → ${next.toFixed(2)} ${rsSelectedItem.unit}`;
  document.getElementById('rs-preview').classList.remove('hidden');
  document.getElementById('rs-confirm-btn').disabled = false;
}

async function confirmRestock() {
  if (!rsSelectedItem) return;
  const cur = systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys;
  const qty = parseFloat(document.getElementById('rs-qty').value);
  if (isNaN(qty)) return;
  const next = rsMode==='add' ? parseFloat((cur + qty).toFixed(2)) : qty;
  const itemName = rsSelectedItem.name, itemUnit = rsSelectedItem.unit;
  const nowIso = new Date().toISOString();
  try {
    const { error } = await sb.from('system_stock_overrides').upsert({ item_id: rsSelectedItem.id, stock_value: next, updated_at: nowIso }, { onConflict: 'item_id' });
    if (error) throw error;
    systemStockMap[rsSelectedItem.id] = next;

    const logEntry = {
      record_date: TODAY,
      item_id: rsSelectedItem.id,
      item_name: itemName,
      mode: rsMode,
      qty: rsMode === 'add' ? qty : null,
      before_stock: cur,
      after_stock: next,
      unit: itemUnit,
      created_at: nowIso,
    };
    const { error: logError } = await sb.from('restock_logs').insert(logEntry);
    if (!logError) todayRestockLogs.push(logEntry);

    document.getElementById('restock-modal').close();
    document.getElementById('restock-success-msg').textContent = `「${itemName}」帳面已更新為 ${next} ${itemUnit}`;
    document.getElementById('restock-success-modal').showModal();
    if (currentTab === 'overview') renderOverview();
    if (currentTab === 'count') renderItemList();
  } catch(e) {
    showToast('更新失敗，請稍後再試', true);
  }
}

// ─── MENU ───
function toggleGlobalMenu() { document.getElementById('global-nav-menu').classList.toggle('hidden'); }
document.addEventListener('click', e => {
  const menu = document.getElementById('global-nav-menu');
  const btn = document.getElementById('global-nav-btn');
  if (menu && btn && !menu.contains(e.target) && !btn.contains(event.target)) menu.classList.add('hidden');
});

// ─── TOAST ───
function showToast(msg, isWarn=false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = `fixed top-6 left-1/2 -translate-x-1/2 text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-sm font-medium transition-all duration-300 z-[1000] ${isWarn?'bg-orange-500/95':'bg-[#3F5144]/95'}`;
  t.classList.remove('opacity-0','-translate-y-4','pointer-events-none');
  setTimeout(()=>t.classList.add('opacity-0','-translate-y-4','pointer-events-none'), 3000);
}

// ─── GO ───
init();
</script>
