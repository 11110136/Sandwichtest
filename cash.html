<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每週金庫盤點系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            /* 設定紙張為直向 (Portrait)，保留邊距 */
            @page { size: portrait; margin: 12mm; }
            
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; width: 100%; margin: 0; padding: 0; border: none !important; }
            
            table { width: 100% !important; border-collapse: collapse !important; }
            td, th { border: 1px solid #d1d5db !important; padding: 10px 8px !important; }
            
            input { border: none !important; background: transparent !important; width: 100% !important; text-align: center !important; }
            .date-line { border-bottom: 1px solid black !important; }
            textarea::placeholder { color: transparent !important; }
            .print-show-img { display: block !important; }
            .print-hide { display: none !important; }
            .print\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            
            /* 列印顏色保留 */
            .print-bg-dark { background-color: #1e293b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-gray { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-bg-yellow { background-color: #fefce8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-8 min-h-screen font-sans">

        <button id="global-nav-btn" onclick="toggleGlobalMenu()" class="flex items-center justify-center w-11 h-11 bg-white/90 backdrop-blur border border-gray-200 rounded-xl shadow-sm hover:bg-gray-50 hover:shadow-md transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
        </button>
        <div id="global-nav-menu" class="hidden absolute top-full left-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-100 overflow-hidden transition-all origin-top-left">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 border-b border-gray-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>

            <a href="cash.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>

    <div class="max-w-4xl mx-auto bg-white p-5 md:p-10 rounded-xl shadow-lg container border border-gray-200 pt-16 md:pt-10 mt-12 md:mt-0 relative z-10">
        
        <div class="border-b-2 border-gray-800 pb-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div class="w-full shrink-1">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-wider whitespace-nowrap">每週金庫盤點表</h1>
                <p class="text-xs text-gray-500 uppercase tracking-tighter mt-1">Weekly Cash Inventory Form</p>
            </div>
            <div class="w-full md:w-auto shrink-0 min-w-[260px] text-left md:text-right flex flex-col items-start md:items-end">
                <label class="block text-xs font-bold text-gray-600 mb-1">盤點週別 (日期區間)</label>
                <input type="text" id="reportDate" placeholder="例: 2026/03/16 - 03/22" class="date-line border-b border-gray-300 focus:outline-none focus:border-blue-500 text-left md:text-center py-1 px-2 w-full bg-transparent text-sm md:text-base font-bold text-gray-700">
            </div>
        </div>

        <table class="w-full border-collapse border border-gray-300 mb-8">
            <thead class="bg-slate-800 text-white print-bg-dark">
                <tr>
                    <th class="border border-slate-700 p-3 md:p-4 text-left w-[30%] pl-4 md:pl-6 text-sm md:text-base">面額</th>
                    <th class="border border-slate-700 p-3 md:p-4 text-center w-[35%] text-sm md:text-base">盤點數量 (張/枚)</th>
                    <th class="border border-slate-700 p-3 md:p-4 text-right w-[35%] pr-4 md:pr-6 text-sm md:text-base">小計金額 (元)</th>
                </tr>
            </thead>
            <tbody>
                <tr class="bg-gray-100 print-bg-gray">
                    <td colspan="3" class="border border-gray-300 p-2 md:p-3 font-bold text-gray-700 text-left pl-4 md:pl-6 text-sm">百鈔與大鈔 (Notes)</td>
                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="1000">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">1,000 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="1000">
                    </td>
                    <td class="border border-gray-300 p-3 md:p-4 text-right font-mono text-blue-700 font-bold text-lg pr-4 md:pr-6 subtotal"></td>
                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="500">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">500 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="500">
                    </td>
                    <td class="border border-gray-300 p-3 md:p-4 text-right font-mono text-blue-700 font-bold text-lg pr-4 md:pr-6 subtotal"></td>
                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="100">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">100 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="100">
                    </td>
                    <td class="border border-gray-300 p-3 md:p-4 text-right font-mono text-blue-700 font-bold text-lg pr-4 md:pr-6 subtotal"></td>
                </tr>
                
                <tr class="bg-gray-100 print-bg-gray">
                    <td colspan="3" class="border border-gray-300 p-2 md:p-3 font-bold text-gray-700 text-left pl-4 md:pl-6 text-sm">零錢 (Coins)</td>
                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="50">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">50 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="50">
                    </td>
                    <td class="border border-gray-300 p-3 md:p-4 text-right font-mono text-blue-700 font-bold text-lg pr-4 md:pr-6 subtotal"></td>
                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="10">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">10 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="10">

                </tr>
                <tr class="cash-row hover:bg-gray-50 transition-colors" data-val="5">
                    <td class="border border-gray-300 p-3 md:p-4 text-left font-bold text-lg text-slate-800 pl-4 md:pl-6">5 元</td>
                    <td class="border border-gray-300 p-2 text-center">
                        <input type="number" min="0" class="qty-input w-24 md:w-32 text-center border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent font-bold text-xl text-gray-800 pb-1" data-val="5">
                    </td>
                    <td class="border border-gray-300 p-3 md:p-4 text-right font-mono text-blue-700 font-bold text-lg pr-4 md:pr-6 subtotal"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="border-t-[3px] border-gray-400 bg-yellow-50 print-bg-yellow">
                    <td colspan="2" class="border border-gray-300 p-4 md:p-5 text-right font-bold text-base md:text-lg text-gray-800">金庫盤點總計 (Grand Total):</td>
                    <td class="border border-gray-300 p-4 md:p-5 text-right text-blue-800 font-bold text-xl md:text-2xl text-nowrap pr-4 md:pr-6" id="grandTotal"></td>

            </tfoot>
        </table>

        <div class="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-6 md:gap-8 mt-10 break-inside-avoid">

                <label for="remarksInput" class="block text-sm font-bold text-gray-700 mb-2">盤點備註事項 (Remarks):</label>
                <textarea id="remarksInput" class="w-full flex-grow border border-gray-200 rounded-lg p-3 text-gray-700 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none min-h-[120px] print:border print:border-gray-300 print:bg-white" placeholder="可點擊此處輸入備註，或直接留白列印出來手寫..."></textarea>

            <div class="grid grid-cols-2 gap-4 h-full">
                <div class="text-center flex flex-col items-center justify-end">
                    <div onclick="openSignatureModal('closer', '盤點人簽名')" class="relative w-full h-24 md:h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/80 cursor-pointer hover:bg-blue-50/50 transition-colors group">
                        <img data-sign-role="closer" src="" class="absolute inset-0 w-full h-full object-contain hidden print-show-img">
                        <button onclick="clearInlineSignature(event, 'closer')" class="btn-clear-closer absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/90 px-2 py-1 rounded shadow-sm no-print transition-colors hidden z-10">清除</button>
                        <span class="hint-closer absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-sm tracking-widest no-print group-hover:text-blue-500 transition-colors print-hide">
                            <svg class="w-5 h-5 mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            盤點人簽名
                        </span>
                    </div>
                    <p class="text-sm font-bold text-gray-700">盤點人簽名</p>
                    <div class="text-xs text-gray-400 italic mt-1">(Counter)</div>
                </div>

                <div class="text-center flex flex-col items-center justify-end">
                    <div onclick="openSignatureModal('manager', '主管/核實人簽名')" class="relative w-full h-24 md:h-32 border-b-2 border-gray-800 mb-2 rounded-t-lg bg-gray-50/80 cursor-pointer hover:bg-blue-50/50 transition-colors group">
                        <img data-sign-role="manager" src="" class="absolute inset-0 w-full h-full object-contain hidden print-show-img">
                        <button onclick="clearInlineSignature(event, 'manager')" class="btn-clear-manager absolute top-1 right-1 text-xs text-slate-400 hover:text-red-500 bg-white/90 px-2 py-1 rounded shadow-sm no-print transition-colors hidden z-10">清除</button>
                        <span class="hint-manager absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-sm tracking-widest no-print group-hover:text-blue-500 transition-colors print-hide">
                            <svg class="w-5 h-5 mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            主管簽名
                        </span>
                    </div>
                    <p class="text-sm font-bold text-gray-700">主管/核實人</p>
                    <div class="text-xs text-gray-400 italic mt-1">(Manager)</div>
                </div>
            </div>
            
        </div>

        <div class="mt-12 flex flex-wrap justify-center gap-3 md:gap-4 no-print relative">
            <button onclick="window.print()" class="w-32 md:w-40 flex justify-center items-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200 text-sm md:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                列印紙本
            </button>
            <button id="btnSubmitData" onclick="submitToCloud()" class="w-32 md:w-40 flex justify-center items-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition duration-200 text-sm md:text-base">
                上傳儲存
            </button>
            <button onclick="resetForm()" class="w-32 md:w-40 flex justify-center items-center bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 font-bold py-3 rounded-lg transition duration-200 text-sm md:text-base shadow-sm">
                清除內容
            </button>
        </div>

        <div id="loadingOverlay" class="fixed inset-0 z-[2000] hidden bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-emerald-500 mb-4"></div>
            <p class="text-white font-bold tracking-widest">資料上傳中，請稍候...</p>
        </div>

        <div class="text-[10px] text-gray-400 mt-10 text-center uppercase tracking-widest no-print">
            End of Inventory Report
        </div>
    </div>

    <div id="signatureModal" class="fixed inset-0 z-[1000] hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 md:p-8 no-print">
        <div class="bg-white w-full max-w-3xl h-[70vh] md:h-[60vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-5 py-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 id="signatureModalTitle" class="font-bold text-gray-800 text-lg">請簽名</h3>
                <button onclick="closeSignatureModal()" class="text-gray-400 hover:text-gray-700 bg-white rounded-full p-1 shadow-sm border border-gray-200 transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-grow relative bg-white">
                <canvas id="modalCanvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
                <span id="modalSignHint" class="absolute inset-0 flex items-center justify-center text-gray-300 pointer-events-none text-2xl tracking-widest">請在此大面積處簽名</span>
            </div>
            <div class="px-5 py-3 border-t border-gray-200 bg-gray-50 flex justify-between gap-4">
                <button onclick="clearModalCanvas()" class="px-4 py-2 bg-white border border-gray-300 text-gray-600 rounded-lg font-bold hover:bg-gray-100 transition-colors shadow-sm text-sm">清除重寫</button>
                <div class="flex gap-2">
                    <button onclick="closeSignatureModal()" class="px-4 py-2 bg-transparent text-gray-500 rounded-lg font-bold hover:bg-gray-200 transition-colors text-sm">取消</button>
                    <button onclick="saveSignature()" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">完成簽名</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.qty-input');

        inputs.forEach(input => {
            input.addEventListener('input', calculate);
        });

        // 簡化版的計算邏輯 (一週只有一欄)
        function calculate() {
            let grandTotal = 0;

            document.querySelectorAll('.cash-row').forEach(row => {
                const val = parseInt(row.getAttribute('data-val'));
                const input = row.querySelector('.qty-input');
                const qty = parseInt(input.value) || 0;
                const subtotal = qty * val;
                
                grandTotal += subtotal;

                // 若大於0才顯示數字，否則清空為空白
                row.querySelector('.subtotal').textContent = subtotal > 0 ? subtotal.toLocaleString('zh-TW') : '';
            });

            // 更新總計
            document.getElementById('grandTotal').textContent = grandTotal > 0 ? 'NT$ ' + grandTotal.toLocaleString('zh-TW') : '';
        }

        function resetForm() {
            if(confirm('確定要清空所有數量與簽名嗎？')) {
                inputs.forEach(input => input.value = '');
                document.getElementById('reportDate').value = '';
                document.getElementById('remarksInput').value = '';
                
                const fakeEvent = { stopPropagation: () => {} };
                clearInlineSignature(fakeEvent, 'closer');
                clearInlineSignature(fakeEvent, 'manager');
                
                calculate();
            }
        }

        function toggleGlobalMenu() {
            document.getElementById('global-nav-menu').classList.toggle('hidden');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('global-nav-menu');
            const btn = document.getElementById('global-nav-btn');
            if (menu && btn && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        let currentSignRole = ''; 
        let hasDrawn = false; 
        const modal = document.getElementById('signatureModal');
        const canvas = document.getElementById('modalCanvas');
        const ctx = canvas.getContext('2d');
        const modalHint = document.getElementById('modalSignHint');

        function openSignatureModal(role, titleText) {
            currentSignRole = role;
            document.getElementById('signatureModalTitle').innerText = titleText;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
            resizeCanvas();
            clearModalCanvas();
        }

        function closeSignatureModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = ''; 
        }

        function saveSignature() {
            if (!hasDrawn) {
                alert("您尚未簽名喔！");
                return;
            }
            const dataUrl = canvas.toDataURL("image/png");
            
            document.querySelectorAll(`img[data-sign-role="${currentSignRole}"]`).forEach(img => {
                img.src = dataUrl;
                img.classList.remove('hidden');
            });
            document.querySelectorAll(`.hint-${currentSignRole}`).forEach(el => el.classList.add('hidden'));
            document.querySelectorAll(`.btn-clear-${currentSignRole}`).forEach(el => el.classList.remove('hidden'));

            closeSignatureModal();
        }

        function clearInlineSignature(event, role) {
            event.stopPropagation(); 
            document.querySelectorAll(`img[data-sign-role="${role}"]`).forEach(img => {
                img.src = "";
                img.classList.add('hidden');
            });
            document.querySelectorAll(`.hint-${role}`).forEach(el => el.classList.remove('hidden'));
            document.querySelectorAll(`.btn-clear-${role}`).forEach(el => el.classList.add('hidden'));
        }

        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        let isDrawing = false;
        let lastX = 0; let lastY = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1e293b'; 
        }

        window.addEventListener('resize', () => { if (!modal.classList.contains('hidden')) resizeCanvas(); });

        function clearModalCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            modalHint.style.display = 'flex';
            hasDrawn = false;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX; let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startPosition(e) {
            isDrawing = true; hasDrawn = true;
            const pos = getPos(e); lastX = pos.x; lastY = pos.y;
            modalHint.style.display = 'none'; e.preventDefault(); 
        }

        function endPosition() { isDrawing = false; ctx.beginPath(); }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            lastX = pos.x; lastY = pos.y; e.preventDefault(); 
        }

        canvas.addEventListener('mousedown', startPosition); canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mouseout', endPosition); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, {passive: false}); canvas.addEventListener('touchend', endPosition, {passive: false});
        canvas.addEventListener('touchcancel', endPosition, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false});

        // ==============================================
        // 後端 Apps Script 上傳邏輯
        // ==============================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvxtZPmYJD5EmPxAGQnfRmoZrODO3tx_26OWFY20_3ASmUb2ejmkudcPvB-G65cA5VAA/exec";

        async function submitToCloud() {
            const dateVal = document.getElementById('reportDate').value.trim();
            if (!dateVal) {
                alert("請先填寫「盤點週別」喔！");
                document.getElementById('reportDate').focus();
                return;
            }

            const getQty = (val) => {
                return document.querySelector(`.qty-input[data-val="${val}"]`).value || "0";
            };
            
            const totalText = document.getElementById('grandTotal').innerText;
            const totalVal = totalText.replace(/[^\d]/g, '') || "0"; 

            // 取得簽名檔
            const closerImg = document.querySelector(`img[data-sign-role="closer"]`);
            const closerImgSrc = closerImg ? closerImg.getAttribute('src') : "";
            
            const managerImg = document.querySelector(`img[data-sign-role="manager"]`);
            const managerImgSrc = managerImg ? managerImg.getAttribute('src') : "";

            // payload 保持原有格式相容性
            const payload = {
                date: dateVal,
                cash1000: getQty(1000),
                cash500: getQty(500),
                cash100: getQty(100),
                coin50: getQty(50),
                coin10: getQty(10),
                coin5: getQty(5),
                total: totalVal, 
                remarks: document.getElementById('remarksInput').value,
                closerSign: closerImgSrc, 
                managerSign: managerImgSrc
            };

            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✅ 盤點資料與簽名已成功上傳至雲端！");
                    const fakeEvent = { stopPropagation: () => {} };
                    inputs.forEach(input => input.value = '');
                    document.getElementById('reportDate').value = '';
                    document.getElementById('remarksInput').value = '';
                    clearInlineSignature(fakeEvent, 'closer');
                    clearInlineSignature(fakeEvent, 'manager');
                    calculate();
                } else {
                    alert("❌ 上傳失敗：" + result.message);
                }
            } catch (error) {
                alert("❌ 網路連線錯誤，請檢查網路狀態或網址設定。");
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
