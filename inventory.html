<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>庫存盤點</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #F6F7F2; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.2s ease forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .slide-up { animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .card-border-ok   { border-left-color: #6C8673; }
    .card-border-warn { border-left-color: #ef4444; }
    .card-border-new  { border-left-color: #D4DCD5; }
    dialog { border: none; background: white; }
    dialog::backdrop { background: rgba(45,58,49,0.5); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="min-h-screen text-[#2D3A31]">

<!-- ─── NAV ─── -->
<nav class="sticky top-0 z-50 shadow-sm">
  <div class="bg-[#6C8673]">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-4">
      <div class="relative">
        <button onclick="toggleMenu()" class="text-white hover:text-white/80 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <div id="nav-menu" class="hidden absolute top-full left-0 mt-3 w-52 bg-white rounded-xl shadow-2xl border border-[#E5EBE6] overflow-hidden z-[999]">
          <a href="index.html"       class="block px-4 py-3 text-sm font-bold text-[#3F5144] hover:bg-[#F0F4F1] border-b border-[#E5EBE6]">值班系統</a>
          <a href="cash.html"        class="block px-4 py-3 text-sm font-bold text-[#3F5144] hover:bg-[#F0F4F1] border-b border-[#E5EBE6]">每週金庫結算</a>
          <a href="inventory.html"   class="block px-4 py-3 text-sm font-bold text-[#3F5144] hover:bg-[#F0F4F1] border-b border-[#E5EBE6]">庫存盤點</a>
          <a href="clean.html"       class="block px-4 py-3 text-sm font-bold text-[#3F5144] hover:bg-[#F0F4F1] border-b border-[#E5EBE6]">清潔與值班管理</a>
          <a href="performance.html" class="block px-4 py-3 text-sm font-bold text-[#3F5144] hover:bg-[#F0F4F1]">績效評估系統</a>
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
        <h1 class="text-base font-bold tracking-widest text-white uppercase">庫存盤點</h1>
      </div>
      <div class="ml-auto flex gap-2">
        <button onclick="openRestock()" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16h6"/><path d="M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 2 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>
          進貨
        </button>
        <button onclick="openOrderModal()" class="relative flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          叫貨
          <span id="order-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="bg-white border-b border-[#D4DCD5]">
    <div class="max-w-2xl mx-auto px-4 relative flex">
      <button id="tab-count" onclick="switchTab('count')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[#2D3A31]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
        今日盤點
      </button>
      <button id="tab-history" onclick="switchTab('history')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[#8FA192] hover:text-[#4F6354]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        歷史記錄
      </button>
      <button id="tab-overview" onclick="switchTab('overview')" class="flex-1 py-3 text-sm font-medium flex justify-center items-center gap-1.5 text-[#8FA192] hover:text-[#4F6354]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
        總覽
      </button>
      <div id="tab-line" class="absolute bottom-0 left-0 h-[3px] bg-[#6C8673] rounded-t-full transition-all duration-300 opacity-0" style="width:0"></div>
    </div>
  </div>

  <!-- Progress bar (only on count tab) -->
  <div id="progress-bar-wrap" class="bg-white border-b border-[#E5EBE6] hidden">
    <div class="max-w-2xl mx-auto px-4 py-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-[#8FA192] tracking-widest uppercase">今日盤點進度</span>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1.5 text-xs text-[#4F6354] font-medium cursor-pointer">
            <input type="checkbox" id="hide-counted-chk" onchange="toggleHideCounted()" class="rounded accent-[#6C8673] w-3.5 h-3.5">
            隱藏已盤
          </label>
          <span id="progress-label" class="text-xs font-bold text-[#6C8673]">0 / 0</span>
        </div>
      </div>
      <div class="h-1.5 bg-[#D4DCD5] rounded-full overflow-hidden">
        <div id="progress-fill" class="h-full bg-[#6C8673] rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
    </div>
  </div>
</nav>

<!-- ─── MAIN ─── -->
<main class="max-w-2xl mx-auto px-4 py-6 pb-40">

  <!-- ══ COUNT TAB ══ -->
  <div id="section-count">
    <!-- Quick load buttons -->
    <div id="quick-load-wrap" class="mb-6">
      <p class="text-xs font-semibold text-[#8FA192] tracking-widest uppercase mb-3">選擇今日盤點範圍</p>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="quickLoad('每日')" class="flex flex-col items-start gap-1 p-4 bg-white rounded-2xl border border-[#E5EBE6] hover:border-[#6C8673] hover:shadow-md transition-all active:scale-95 shadow-sm">
          <span class="text-lg">☀️</span>
          <span class="font-bold text-[#2D3A31] text-sm">每日盤點</span>
          <span class="text-[11px] text-[#8FA192]">食材、茶飲、常用品</span>
        </button>
        <button onclick="quickLoad('每周')" class="flex flex-col items-start gap-1 p-4 bg-white rounded-2xl border border-[#E5EBE6] hover:border-[#6C8673] hover:shadow-md transition-all active:scale-95 shadow-sm">
          <span class="text-lg">📦</span>
          <span class="font-bold text-[#2D3A31] text-sm">每周盤點</span>
          <span class="text-[11px] text-[#8FA192]">調味、包材、備品</span>
        </button>
      </div>
    </div>

    <!-- Item list -->
    <div id="item-list" class="space-y-2"></div>
  </div>

  <!-- ══ HISTORY TAB ══ -->
  <div id="section-history" class="hidden">
    <div id="calendar-wrap" class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] p-5 mb-5"></div>
    <div id="history-detail" class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] overflow-hidden hidden fade-in">
      <div class="flex justify-between items-center px-5 py-4 border-b border-[#E5EBE6]">
        <h3 id="history-detail-title" class="font-bold text-[#2D3A31]"></h3>
        <button onclick="document.getElementById('history-detail').classList.add('hidden')" class="text-[#8FA192] hover:text-[#4F6354]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="history-detail-body" class="divide-y divide-[#E5EBE6] max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- ══ OVERVIEW TAB ══ -->
  <div id="section-overview" class="hidden">
    <div class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-1">
      <button onclick="setOverviewFilter('counted')" id="ov-counted" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-[#6C8673] text-white border-[#6C8673]">今日已盤</button>
      <button onclick="setOverviewFilter('alert')" id="ov-alert" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-red-600 border-red-200">⚠ 需叫貨</button>
      <button onclick="setOverviewFilter('all')" id="ov-all" class="ov-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-[#4F6354] border-[#D4DCD5]">全部商品</button>
    </div>
    <div class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[#F6F7F2] text-[#8FA192] text-xs font-semibold uppercase tracking-wide border-b border-[#E5EBE6]">
          <tr>
            <th class="px-4 py-3 text-left">品名</th>
            <th class="px-4 py-3 text-right">帳面</th>
            <th class="px-4 py-3 text-right">實盤</th>
            <th class="px-4 py-3 text-right">盤差</th>
            <th class="px-4 py-3 text-center">狀態</th>
          </tr>
        </thead>
        <tbody id="overview-body" class="divide-y divide-[#F0F4F1]"></tbody>
      </table>
    </div>

    <div id="restock-log-section" class="mt-5 hidden">
      <p class="text-xs font-semibold text-[#8FA192] tracking-widest uppercase mb-3 pl-1">📦 今日進貨紀錄</p>
      <div id="restock-log-list" class="bg-white rounded-3xl shadow-sm border border-[#E5EBE6] divide-y divide-[#F0F4F1] overflow-hidden"></div>
    </div>

    <button onclick="exportCSV()" class="mt-4 w-full py-3 bg-white border border-[#D4DCD5] rounded-2xl text-sm font-semibold text-[#4F6354] hover:bg-[#F0F4F1] transition-all flex items-center justify-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      匯出 CSV 報表
    </button>
  </div>

</main>

<!-- ─── Custom Keypad ─── -->
<div id="keypad" class="fixed bottom-0 left-0 right-0 z-[90] slide-up hidden">
  <div class="max-w-2xl mx-auto bg-[#E5EBE6] rounded-t-2xl shadow-2xl border-t border-[#C3D0C6] overflow-hidden">
    <!-- top bar -->
    <div class="bg-[#F6F7F2] flex items-center justify-between px-4 py-2.5 border-b border-[#D4DCD5]">
      <div class="flex items-center gap-2">
        <span id="keypad-unit-label" class="text-xs font-bold text-[#6C8673] bg-[#DCE8DE] px-2.5 py-1 rounded-full">輸入數量</span>
        <span id="keypad-remaining" class="text-xs font-bold text-[#4F6354] bg-white border border-[#D4DCD5] px-2 py-0.5 rounded-full">剩 0 項</span>
        <button id="keypad-clear" class="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-lg hover:bg-red-100 transition-all">清空</button>
      </div>
      <div class="flex gap-2">
        <button id="keypad-next" class="text-xs font-bold text-white bg-[#6C8673] px-3 py-1.5 rounded-lg hover:bg-[#5A705F] transition-all">下一項 ⏭</button>
        <button id="keypad-close" class="text-xs font-bold text-[#4F6354] bg-white border border-[#D4DCD5] px-3 py-1.5 rounded-lg hover:bg-[#F0F4F1] transition-all">完成 ✓</button>
      </div>
    </div>
    <div id="keypad-hint" class="hidden text-center text-[11px] text-amber-700 bg-amber-50 border-b border-amber-200 py-1.5 font-medium"></div>
    <!-- keys -->
    <div class="grid grid-cols-3 gap-1.5 p-2.5 bg-[#D4DCD5]">
      <!-- generated by JS -->
    </div>
  </div>
</div>

<!-- ─── ORDER MODAL ─── -->
<dialog id="order-modal" class="rounded-3xl shadow-2xl border border-[#E5EBE6] w-[92%] max-w-sm p-0">
  <div class="bg-red-500 text-white px-5 py-4 flex justify-between items-center">
    <h2 class="font-bold flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      今日需叫貨清單
    </h2>
    <button onclick="document.getElementById('order-modal').close()" class="hover:bg-red-600 p-1 rounded-full transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div id="order-body" class="p-4 max-h-72 overflow-y-auto space-y-2"></div>
  <div class="px-4 pb-4 flex gap-3">
    <button onclick="document.getElementById('order-modal').close()" class="flex-1 py-3 bg-white border-2 border-[#D4DCD5] text-[#4F6354] rounded-xl font-semibold hover:bg-[#F0F4F1] transition-all">關閉</button>
    <button onclick="copyOrderList()" id="copy-order-btn" class="flex-[2] py-3 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 transition-all flex items-center justify-center gap-2 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      複製並傳 LINE
    </button>
  </div>
</dialog>

<!-- ─── RESTOCK MODAL ─── -->
<dialog id="restock-modal" class="rounded-3xl shadow-2xl border border-[#E5EBE6] w-[92%] max-w-sm p-0">
  <div class="bg-[#6C8673] text-white px-5 py-4 flex justify-between items-center">
    <h2 class="font-bold flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16h6"/><path d="M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 2 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/></svg>
      進貨 / 更新帳面
    </h2>
    <button onclick="document.getElementById('restock-modal').close()" class="hover:bg-[#5A705F] p-1 rounded-full transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="p-4 space-y-4">
    <input id="restock-search" type="text" placeholder="搜尋品項名稱..." class="w-full px-4 py-2.5 border border-[#D4DCD5] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#6C8673]/30 bg-[#F6F7F2]" oninput="filterRestockItems()">
    <div id="restock-list" class="max-h-52 overflow-y-auto space-y-1 rounded-xl border border-[#E5EBE6] bg-white"></div>
    <div id="restock-form" class="hidden space-y-3">
      <div class="bg-[#F0F4F1] rounded-xl p-3 text-sm">
        <div class="flex justify-between"><span class="text-[#687A6B]">品名</span><span id="rs-name" class="font-bold"></span></div>
        <div class="flex justify-between mt-1"><span class="text-[#687A6B]">目前帳面</span><span id="rs-cur" class="font-bold"></span></div>
      </div>
      <div>
        <label id="rs-qty-label" class="block text-xs font-bold text-[#8FA192] mb-1.5">本次進貨數量</label>
        <input id="rs-qty" type="number" inputmode="decimal" placeholder="輸入數量..." class="w-full px-4 py-3 border border-[#D4DCD5] rounded-xl text-lg font-bold text-[#6C8673] text-center focus:outline-none focus:ring-2 focus:ring-[#6C8673]/30 bg-[#F0F4F1]" oninput="updateRsPreview()">
      </div>
      <div id="rs-preview" class="hidden bg-[#DCE8DE] rounded-xl p-3 text-sm text-center text-[#3F5144] font-bold"></div>
      <button onclick="toggleRsMode()" id="rs-mode-toggle" class="text-xs font-semibold text-[#8FA192] hover:text-[#6C8673] transition-colors">✎ 帳面數字不對？直接設定正確庫存</button>
    </div>
  </div>
  <div class="px-4 pb-4 flex gap-3">
    <button onclick="document.getElementById('restock-modal').close()" class="flex-1 py-3 bg-white border-2 border-[#D4DCD5] text-[#4F6354] rounded-xl font-semibold hover:bg-[#F0F4F1] transition-all">取消</button>
    <button onclick="confirmRestock()" id="rs-confirm-btn" class="flex-[2] py-3 bg-[#6C8673] text-white rounded-xl font-semibold hover:bg-[#5A705F] transition-all disabled:opacity-40" disabled>確認更新</button>
  </div>
</dialog>

<!-- ─── RESTOCK SUCCESS MODAL ─── -->
<dialog id="restock-success-modal" class="rounded-3xl shadow-2xl border border-[#E5EBE6] w-[88%] max-w-xs p-0">
  <div class="p-8 text-center">
    <div class="w-14 h-14 bg-[#DCE8DE] rounded-full flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#6C8673]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h3 class="text-lg font-bold text-[#2D3A31] mb-1">更新成功</h3>
    <p id="restock-success-msg" class="text-sm text-[#687A6B] mb-5"></p>
    <button onclick="document.getElementById('restock-success-modal').close()" class="w-full py-3 bg-[#6C8673] text-white rounded-xl font-semibold hover:bg-[#5A705F] transition-all">確認</button>
  </div>
</dialog>

<!-- ─── TOAST ─── -->
<div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-[#3F5144]/95 text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-sm font-medium transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none z-[1000]">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#A3B4A5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toast-msg"></span>
</div>

const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();

// ─── INIT ───
async function init() {
  ITEMS.forEach(i => systemStockMap[i.id] = i.sys);

  try {
    const [{ data: records }, { data: overrides }, { data: logs }] = await Promise.all([
      sb.from('inventory_records').select('*'),
      sb.from('system_stock_overrides').select('*'),
      sb.from('restock_logs').select('*').eq('record_date', TODAY).order('created_at', { ascending: true }),
    ]);
    if (overrides) overrides.forEach(o => systemStockMap[o.item_id] = o.stock_value);
    if (records) {
      records.forEach(r => {
        if (!historyData[r.record_date]) historyData[r.record_date] = {};
        historyData[r.record_date][r.item_id] = r.actual_count;
        if (r.record_date === TODAY) todayCounts[r.item_id] = r.actual_count;
      });
    }
    if (logs) todayRestockLogs = logs;
    // Figure out which tags already have items loaded today
    ITEMS.forEach(i => { if (todayCounts[i.id] !== undefined) loadedTags.add(i.tag); });
  } catch(e) { showToast('無法連線雲端資料庫', true); }

  buildKeypad();
  switchTab('count');
  setTimeout(updateTabLine, 100);
  window.addEventListener('resize', updateTabLine);
}

// ─── TAB ───
function switchTab(tab) {
  currentTab = tab;
  ['count','history','overview'].forEach(t => {
    document.getElementById(`section-${t}`).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById(`tab-${t}`);
    if (t === tab) {
      btn.classList.remove('text-[#8FA192]','hover:text-[#4F6354]');
      btn.classList.add('text-[#2D3A31]');
    } else {
      btn.classList.add('text-[#8FA192]','hover:text-[#4F6354]');
      btn.classList.remove('text-[#2D3A31]');
    }
  });
  document.getElementById('progress-bar-wrap').classList.toggle('hidden', tab !== 'count' || loadedTags.size === 0);
  if (tab === 'count') renderItemList();
  if (tab === 'history') renderCalendar();
  if (tab === 'overview') renderOverview();
  updateTabLine();
  closeKeypad();
}

function updateTabLine() {
  const tabs = ['count','history','overview'];
  const idx = tabs.indexOf(currentTab);
  const btn = document.getElementById(`tab-${currentTab}`);
  const line = document.getElementById('tab-line');
  if (!btn || !line) return;
  line.style.width = btn.offsetWidth + 'px';
  line.style.transform = `translateX(${btn.offsetLeft}px)`;
  line.classList.remove('opacity-0');
}

// ─── QUICK LOAD ───
async function quickLoad(tag) {
  const tagItems = ITEMS.filter(i => i.tag === tag);
  const newIds = tagItems.filter(i => todayCounts[i.id] === undefined).map(i => i.id);

  if (loadedTags.has(tag) && newIds.length === 0) {
    showToast(`「${tag}」盤點表已載入`);
    return;
  }

  if (loadedTags.has(tag)) {
    showToast(`補入 ${newIds.length} 項新品項`);
  } else {
    showToast(`已載入「${tag}」盤點表`);
    loadedTags.add(tag);
  }

  newIds.forEach(id => { todayCounts[id] = ''; });

  // upsert nulls so they appear in DB
  if (newIds.length > 0) {
    await sb.from('inventory_records').upsert(
      newIds.map(id => ({ record_date: TODAY, item_id: id, actual_count: null })),
      { onConflict: 'record_date, item_id' }
    );
  }

  document.getElementById('quick-load-wrap').classList.add('hidden');
  document.getElementById('progress-bar-wrap').classList.remove('hidden');
  renderItemList();
  updateProgress();
}

// ─── RENDER ITEM LIST ───
function renderItemList() {
  const container = document.getElementById('item-list');
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);

  if (loadedItems.length === 0) {
    document.getElementById('quick-load-wrap').classList.remove('hidden');
    container.innerHTML = '';
    return;
  }
  document.getElementById('quick-load-wrap').classList.add('hidden');

  const groups = {};
  loadedItems.forEach(i => {
    if (!groups[i.tag]) groups[i.tag] = [];
    groups[i.tag].push(i);
  });

  let html = '';
  ['每日','每周'].forEach(tag => {
    if (!groups[tag]) return;
    const items = hideCounted ? groups[tag].filter(i => todayCounts[i.id] === '' || todayCounts[i.id] === null || todayCounts[i.id] === undefined) : groups[tag];
    if (items.length === 0) return;
    html += `<div class="mb-1">
      <div class="sticky top-[${tag==='每日'?'108':'108'}px] z-10 py-2">
        <span class="inline-block px-3 py-1 bg-[#6C8673] text-white text-xs font-bold rounded-lg">📌 ${tag}</span>
      </div>
      <div class="space-y-2">${items.map(item => renderCard(item)).join('')}</div>
    </div>`;
  });

  container.innerHTML = html || `<div class="text-center py-12 text-[#8FA192]">🎉 全部品項盤點完成！</div>`;
}

function renderCard(item) {
  const raw = todayCounts[item.id];
  const hasCounted = raw !== '' && raw !== null && raw !== undefined;
  const count = parseFloat(raw);
  const sys = systemStockMap[item.id] ?? item.sys;
  const isLow = hasCounted && !isNaN(count) && count < item.alert;
  const isActive = activeInputId === item.id;

  // Display value (sub-unit mode)
  let displayVal = '';
  if (hasCounted && !isNaN(count)) {
    displayVal = item.conv ? String(Math.round(count * item.conv * 100)/100) : String(count);
  }

  // Variance
  let varianceHtml = '';
  if (hasCounted && !isNaN(count)) {
    const v = count - sys;
    const pct = Math.abs(v) / (sys || 1);
    const isAbnormal = pct > 0.05 && sys > 0;
    const vText = v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
    const vColor = isAbnormal ? 'text-orange-600 font-bold' : 'text-[#687A6B]';
    varianceHtml = `<span class="text-xs ${vColor}">盤差 ${vText} ${item.unit}</span>`;
  }

  const borderClass = isLow ? 'card-border-warn' : hasCounted ? 'card-border-ok' : 'card-border-new';

  return `
  <div id="card-${item.id}" class="bg-white rounded-2xl border-l-4 ${borderClass} border border-[#E5EBE6] p-4 transition-all ${isActive?'ring-2 ring-[#6C8673]/40 shadow-md':'shadow-sm'}">
    <div class="flex items-start justify-between mb-3">
      <div>
        <h3 class="font-semibold text-[#2D3A31] text-sm">${item.name}</h3>
        <p class="text-[11px] text-[#8FA192] mt-0.5">${item.spec || '—'} · 安全 ${item.alert} ${item.unit}</p>
      </div>
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${hasCounted ? isLow ? 'bg-red-100 text-red-600' : 'bg-[#DCE8DE] text-[#3F5144]' : 'bg-[#F0F4F1] text-[#8FA192]'}">
        ${hasCounted ? isLow ? '⚠ 需叫貨' : '✓ 已盤' : '待盤點'}
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="stepCard(${item.id},-1)" class="w-9 h-9 rounded-xl bg-[#F0F4F1] text-[#4F6354] font-bold text-lg flex items-center justify-center hover:bg-[#D4DCD5] active:scale-95 transition-all">−</button>
      <div onclick="focusCard(${item.id})" class="flex-1 h-10 flex items-center justify-center border-2 rounded-xl cursor-pointer transition-all font-bold text-base ${isActive ? 'border-[#6C8673] bg-[#F0F4F1] text-[#3F5144]' : displayVal ? 'border-[#A3B4A5] text-[#2D3A31]' : 'border-[#D4DCD5] text-[#C3D0C6]'}" >
        ${displayVal || '<span class="font-normal text-sm">點擊輸入</span>'}
        ${displayVal ? `<span class="text-xs font-normal text-[#8FA192] ml-1">${item.conv ? item.subUnit : item.unit}</span>` : ''}
      </div>
      <button onclick="stepCard(${item.id},1)" class="w-9 h-9 rounded-xl bg-[#F0F4F1] text-[#4F6354] font-bold text-lg flex items-center justify-center hover:bg-[#D4DCD5] active:scale-95 transition-all">＋</button>
    </div>
    <div class="flex justify-between items-center mt-2 text-[11px]">
      <span class="text-[#8FA192]">帳面 ${sys} ${item.unit}${item.conv ? ` (${Math.round(sys*item.conv)}${item.subUnit})` : ''}</span>
      ${varianceHtml}
    </div>
    ${isLow ? `<div class="mt-2 text-xs text-red-600 font-medium flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>低於安全警戒，需叫貨</div>` : ''}
  </div>`;
}

function stepCard(id, delta) {
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;
  const isSubUnit = item.conv;
  let cur = todayCounts[id];
  let mainVal = (cur === '' || cur === null || cur === undefined) ? 0 : parseFloat(cur);
  if (isNaN(mainVal)) mainVal = 0;
  if (isSubUnit) {
    let subVal = Math.round(mainVal * item.conv * 100) / 100;
    subVal = Math.max(0, subVal + delta);
    mainVal = Math.round(subVal / item.conv * 1000) / 1000;
  } else {
    mainVal = Math.max(0, Math.round((mainVal + delta) * 10) / 10);
  }
  saveCount(id, mainVal);
}

function focusCard(id) {
  activeInputId = id;
  const item = ITEMS.find(i => i.id === id);
  // Update keypad label
  document.getElementById('keypad-unit-label').textContent = `輸入 ${item.conv ? item.subUnit : item.unit}`;
  if (item.conv) {
    document.getElementById('keypad-hint').textContent = `換算提示：輸入【${item.subUnit}】，系統自動換算為【${item.unit}】儲存`;
    document.getElementById('keypad-hint').classList.remove('hidden');
  } else {
    document.getElementById('keypad-hint').classList.add('hidden');
  }
  updateKeypadRemaining();
  document.getElementById('keypad').classList.remove('hidden');
  // Scroll card into view
  setTimeout(() => {
    const card = document.getElementById(`card-${id}`);
    if (card) {
      const y = card.getBoundingClientRect().top + window.pageYOffset - 220;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }, 60);
  renderItemList();
}

function closeKeypad() {
  activeInputId = null;
  document.getElementById('keypad').classList.add('hidden');
}

function updateKeypadRemaining() {
  const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const remaining = loadedItems.filter(i => {
    const v = todayCounts[i.id];
    return v === '' || v === null || v === undefined;
  }).length;
  document.getElementById('keypad-remaining').textContent = `剩 ${remaining} 項`;
}

// ─── KEYPAD ───
function buildKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  const grid = document.querySelector('#keypad .grid');
  grid.innerHTML = keys.map(k => `
    <button class="kp-key bg-white py-3 text-xl font-bold rounded-xl shadow-sm active:bg-[#F0F4F1] active:scale-95 transition-all text-[#2D3A31] flex items-center justify-center">${k}</button>
  `).join('');
  grid.querySelectorAll('.kp-key').forEach(btn => {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); handleKey(btn.textContent.trim()); });
  });
  document.getElementById('keypad-clear').addEventListener('pointerdown', e => { e.preventDefault(); if(activeInputId) saveCount(activeInputId, ''); renderItemList(); });
  document.getElementById('keypad-close').addEventListener('pointerdown', e => { e.preventDefault(); closeKeypad(); renderItemList(); });
  document.getElementById('keypad-next').addEventListener('pointerdown', e => {
    e.preventDefault();
    const loadedItems = ITEMS.filter(i => todayCounts[i.id] !== undefined);
    const curIdx = loadedItems.findIndex(i => i.id === activeInputId);
    const next = loadedItems.slice(curIdx + 1).find(i => {
      const v = todayCounts[i.id]; return v === '' || v === null || v === undefined;
    });
    if (next) focusCard(next.id); else { closeKeypad(); showToast('所有項目已盤點完成！'); renderItemList(); }
  });
}

function handleKey(k) {
  if (!activeInputId) return;
  const item = ITEMS.find(i => i.id === activeInputId);
  const isSubUnit = item && item.conv;
  let raw = todayCounts[activeInputId];
  let displayStr = '';
  if (raw !== '' && raw !== null && raw !== undefined && !isNaN(parseFloat(raw))) {
    displayStr = isSubUnit ? String(Math.round(parseFloat(raw) * item.conv * 100)/100) : String(raw);
  }
  if (k === '⌫') displayStr = displayStr.slice(0,-1);
  else if (k === '.') { if (!displayStr.includes('.')) displayStr += '.'; }
  else displayStr += k;

  if (displayStr === '') { saveCount(activeInputId, ''); return; }
  let finalVal = parseFloat(displayStr);
  if (!isNaN(finalVal)) {
    if (isSubUnit) finalVal = Math.round(finalVal / item.conv * 1000) / 1000;
    saveCount(activeInputId, finalVal);
  }
}

async function saveCount(id, val) {
  todayCounts[id] = val;
  updateProgress();
  updateKeypadRemaining();
  // Re-render just this card
  const card = document.getElementById(`card-${id}`);
  if (card) {
    const item = ITEMS.find(i => i.id === id);
    card.outerHTML = renderCard(item);
    if (activeInputId === id) {
      const newCard = document.getElementById(`card-${id}`);
      if (newCard) newCard.classList.add('ring-2','ring-[#6C8673]/40','shadow-md');
    }
  }
  // update order badge
  updateOrderBadge();
  // DB save (debounce light)
  const count = val === '' ? null : parseFloat(val);
  await sb.from('inventory_records').upsert({ record_date: TODAY, item_id: id, actual_count: isNaN(count) ? null : count }, { onConflict: 'record_date, item_id' });
}

function updateProgress() {
  const loaded = ITEMS.filter(i => todayCounts[i.id] !== undefined);
  const done = loaded.filter(i => { const v = todayCounts[i.id]; return v !== '' && v !== null && v !== undefined; });
  const pct = loaded.length ? Math.round(done.length / loaded.length * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done.length} / ${loaded.length}`;
}

function toggleHideCounted() {
  hideCounted = document.getElementById('hide-counted-chk').checked;
  renderItemList();
}

function setOverviewFilter(f) {

  document.querySelectorAll('.ov-btn').forEach(b => {
    b.classList.remove('bg-[#6C8673]','text-white','border-[#6C8673]','bg-red-500','border-red-500');
    if (b.id === 'ov-alert') {
      b.classList.add('bg-white','text-red-600','border-red-200');
    } else {
      b.classList.add('bg-white','text-[#4F6354]','border-[#D4DCD5]');
    }
  });
  const btn = document.getElementById(`ov-${f}`);
  btn.classList.remove('bg-white','text-[#4F6354]','border-[#D4DCD5]','text-red-600','border-red-200');
  if (f === 'alert') btn.classList.add('bg-red-500','text-white','border-red-500');
  else btn.classList.add('bg-[#6C8673]','text-white','border-[#6C8673]');
  renderOverview();
}

function renderOverview() {
  let list = ITEMS;
  let emptyMsg = '無符合條件的品項';

  if (overviewFilter === 'counted') {
    list = list.filter(i => {
      const v = todayCounts[i.id];
      return v !== undefined && v !== '' && v !== null;
    });
    emptyMsg = '今天還沒有盤點任何品項，到「今日盤點」分頁開始吧';
  } else if (overviewFilter === 'alert') {
    list = list.filter(i => {
      const v = todayCounts[i.id]; if (v===''||v===null||v===undefined) return false;
      const c = parseFloat(v); return !isNaN(c) && c < i.alert;
    });
    emptyMsg = '目前沒有低於安全量的品項 🎉';
  }
  // overviewFilter === 'all' → show every item in the master list

  const tbody = document.getElementById('overview-body');
  tbody.innerHTML = list.map(item => {
    const sys = systemStockMap[item.id] ?? item.sys;
    const raw = todayCounts[item.id];
    const has = raw !== undefined && raw !== '' && raw !== null;
    const c = parseFloat(raw);
    let vt = '—', badge = `<span class="text-[10px] bg-[#F0F4F1] text-[#8FA192] px-2 py-0.5 rounded-full">未盤</span>`;
    let vColor = 'text-[#8FA192]';
    if (has && !isNaN(c)) {
      const v = c - sys; const pct = Math.abs(v)/(sys||1);
      vt = v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);
      if (c < item.alert) { badge = `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold">缺貨</span>`; vColor='text-red-600 font-bold'; }
      else if (pct > 0.05 && sys > 0) { badge = `<span class="text-[10px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-bold">異常</span>`; vColor='text-orange-600 font-bold'; }
      else { badge = `<span class="text-[10px] bg-[#DCE8DE] text-[#3F5144] px-2 py-0.5 rounded-full">正常</span>`; }
    }
    return `<tr class="hover:bg-[#F6F7F2] transition-colors">
      <td class="px-4 py-3"><p class="font-semibold text-[#2D3A31] text-sm">${item.name}</p><p class="text-[10px] text-[#8FA192]">${item.unit}</p></td>
      <td class="px-4 py-3 text-right text-[#687A6B] text-sm">${sys}</td>
      <td class="px-4 py-3 text-right font-bold text-[#2D3A31] text-sm">${has && !isNaN(c) ? c : '—'}</td>
      <td class="px-4 py-3 text-right text-sm ${vColor}">${vt}</td>
      <td class="px-4 py-3 text-center">${badge}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="px-4 py-10 text-center text-[#8FA192] text-sm">${emptyMsg}</td></tr>`;

  renderRestockLog();
}

function renderRestockLog() {
  const section = document.getElementById('restock-log-section');
  const list = document.getElementById('restock-log-list');
  if (!todayRestockLogs || todayRestockLogs.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = todayRestockLogs.map(log => {
    const time = log.created_at ? new Date(log.created_at).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }) : '';
    const qtyText = log.mode === 'add'
      ? `<span class="text-[#6C8673] font-bold">+${log.qty}</span> ${log.unit}`
      : `<span class="text-[#6C8673] font-bold">設定為 ${log.after_stock}</span> ${log.unit}`;
    return `
    <div class="flex items-center justify-between px-4 py-3">

        <p class="font-semibold text-sm text-[#2D3A31]">${log.item_name}</p>
        <p class="text-[10px] text-[#8FA192] mt-0.5">${log.before_stock} → ${log.after_stock} ${log.unit}${time ? ` · ${time}` : ''}</p>
      </div>

function exportCSV() {
  let csv = "\uFEFF品名,規格,標籤,帳面庫存,實際盤點,盤差,單位\n";
  ITEMS.forEach(i => {
    const sys = systemStockMap[i.id] ?? i.sys;
    const raw = todayCounts[i.id];
    const has = raw !== undefined && raw !== '' && raw !== null;
    const c = parseFloat(raw);
    const actual = has && !isNaN(c) ? c : '未盤點';
    const v = has && !isNaN(c) ? (c - sys).toFixed(1) : '';
    csv += `${i.name},${i.spec||''},${i.tag},${sys},${actual},${v},${i.unit}\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `庫存總表_${TODAY}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ─── HISTORY CALENDAR ───
let calMonth = new Date();
let selectedHistDate = null;

function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const daysIn = new Date(y,m+1,0).getDate();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysIn; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = historyData[ds] && Object.keys(historyData[ds]).some(k => historyData[ds][k] !== null);
    const isToday = ds === TODAY, isSel = ds === selectedHistDate;
    cells += `<div onclick="${has ? `selectHistDate('${ds}')` : ''}" class="h-10 flex flex-col items-center justify-center rounded-xl transition-all ${has?'cursor-pointer hover:bg-[#F0F4F1]':''} ${isSel?'bg-[#6C8673] text-white':''} ${isToday&&!isSel?'bg-[#F0F4F1]':''}">
      <span class="text-sm font-medium ${isToday&&!isSel?'text-[#6C8673] font-bold':has&&!isSel?'text-[#2D3A31]':'text-[#C3D0C6]'}">${d}</span>
      ${has ? `<div class="w-1.5 h-1.5 rounded-full mt-0.5 ${isSel?'bg-white':'bg-[#6C8673]'}"></div>` : ''}
    </div>`;
  }
  document.getElementById('calendar-wrap').innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <button onclick="calNavMonth(-1)" class="p-2 rounded-xl hover:bg-[#F0F4F1] transition-all text-[#4F6354]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h3 class="font-bold text-[#2D3A31]">${y}年 ${monthNames[m]}</h3>
      <button onclick="calNavMonth(1)" class="p-2 rounded-xl hover:bg-[#F0F4F1] transition-all text-[#4F6354]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center mb-2">
      ${['日','一','二','三','四','五','六'].map(d=>`<div class="text-xs font-medium text-[#8FA192] py-1">${d}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-1">${cells}</div>
    ${!selectedHistDate ? `<p class="text-center text-sm text-[#8FA192] mt-4">點選有橘點的日期查看明細</p>` : ''}
  `;
}

function calNavMonth(delta) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  renderCalendar();
}

function selectHistDate(ds) {
  selectedHistDate = ds;
  renderCalendar();
  const dayData = historyData[ds] || {};
  const items = ITEMS.filter(i => dayData[i.id] !== undefined && dayData[i.id] !== null);
  document.getElementById('history-detail-title').textContent = `${ds} 盤點明細`;
  document.getElementById('history-detail-body').innerHTML = items.length === 0 
    ? `<p class="px-5 py-6 text-center text-[#8FA192] text-sm">無盤點資料</p>`
    : items.map(i => {
        const c = parseFloat(dayData[i.id]);
        const isLow = !isNaN(c) && c < i.alert;
        return `<div class="flex justify-between items-center px-5 py-3 hover:bg-[#F6F7F2] transition-all">
          <div><p class="font-semibold text-sm text-[#2D3A31]">${i.name}</p><p class="text-[10px] text-[#8FA192]">安全 ${i.alert} ${i.unit}</p></div>
          <div class="text-right">
            <p class="font-bold ${isLow?'text-red-600':'text-[#6C8673]'}">${dayData[i.id]} <span class="text-xs font-normal text-[#8FA192]">${i.unit}</span></p>
            ${isLow?`<p class="text-[10px] text-red-500">需叫貨</p>`:''}
          </div>
        </div>`;
      }).join('');
  document.getElementById('history-detail').classList.remove('hidden');
}

function openRestock() {
  rsSelectedItem = null; rsMode = 'add';

function filterRestockItems() {
  const q = document.getElementById('restock-search').value.toLowerCase();

  if (!q) {
    // 預設將「今日需叫貨」品項排在最上方，其餘依原順序接續
    const alertItems = ITEMS.filter(i => {
      const v = todayCounts[i.id]; if (v===''||v===null||v===undefined) return false;
      const c = parseFloat(v); return !isNaN(c) && c < i.alert;
    });
    const alertIds = new Set(alertItems.map(i => i.id));
    const rest = ITEMS.filter(i => !alertIds.has(i.id));
    const ordered = [...alertItems, ...rest].slice(0, 20);

    document.getElementById('restock-list').innerHTML = ordered.map(i => {
      const isAlert = alertIds.has(i.id);
      return `
      <div onclick="selectRestockItem(${i.id})" class="px-4 py-2.5 hover:bg-[#F0F4F1] cursor-pointer flex justify-between items-center transition-all border-b border-[#F6F7F2] last:border-0">
        <span class="font-semibold text-sm text-[#2D3A31] flex items-center gap-1.5">${i.name}${isAlert ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full font-bold">需叫貨</span>' : ''}</span>
        <span class="text-xs text-[#8FA192]">${systemStockMap[i.id] ?? i.sys} ${i.unit}</span>
      </div>`;
    }).join('') || `<p class="px-4 py-4 text-center text-sm text-[#8FA192]">找不到品項</p>`;
    return;
  }

  const list = ITEMS.filter(i => i.name.toLowerCase().includes(q));
  document.getElementById('restock-list').innerHTML = list.slice(0,20).map(i => `
    <div onclick="selectRestockItem(${i.id})" class="px-4 py-2.5 hover:bg-[#F0F4F1] cursor-pointer flex justify-between items-center transition-all border-b border-[#F6F7F2] last:border-0">
      <span class="font-semibold text-sm text-[#2D3A31]">${i.name}</span>
      <span class="text-xs text-[#8FA192]">${systemStockMap[i.id] ?? i.sys} ${i.unit}</span>
    </div>
  `).join('') || `<p class="px-4 py-4 text-center text-sm text-[#8FA192]">找不到品項</p>`;
}

function selectRestockItem(id) {
  rsSelectedItem = ITEMS.find(i => i.id === id);
  rsMode = 'add';
  document.getElementById('restock-search').value = rsSelectedItem.name;
  document.getElementById('restock-list').innerHTML = '';
  document.getElementById('rs-name').textContent = rsSelectedItem.name;
  document.getElementById('rs-cur').textContent = `${systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys} ${rsSelectedItem.unit}`;
  document.getElementById('rs-qty').value = '';
  document.getElementById('rs-qty-label').textContent = '本次進貨數量';
  document.getElementById('rs-qty').placeholder = '輸入數量...';
  document.getElementById('rs-mode-toggle').textContent = '✎ 帳面數字不對？直接設定正確庫存';
  document.getElementById('rs-preview').classList.add('hidden');
  document.getElementById('restock-form').classList.remove('hidden');
  document.getElementById('rs-confirm-btn').disabled = true;
}

function toggleRsMode() {
  rsMode = rsMode === 'add' ? 'set' : 'add';
  if (rsMode === 'set') {
    document.getElementById('rs-qty-label').textContent = '設定為帳面庫存';
    document.getElementById('rs-qty').placeholder = '輸入正確庫存數量...';
    document.getElementById('rs-mode-toggle').textContent = '← 改回「加入進貨量」';
  } else {
    document.getElementById('rs-qty-label').textContent = '本次進貨數量';
    document.getElementById('rs-qty').placeholder = '輸入數量...';
    document.getElementById('rs-mode-toggle').textContent = '✎ 帳面數字不對？直接設定正確庫存';
  }
  document.getElementById('rs-qty').value = '';
  document.getElementById('rs-preview').classList.add('hidden');
  document.getElementById('rs-confirm-btn').disabled = true;
}

function updateRsPreview() {
  if (!rsSelectedItem) return;
  const cur = systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys;
  const qty = parseFloat(document.getElementById('rs-qty').value);
  if (isNaN(qty)) { document.getElementById('rs-preview').classList.add('hidden'); document.getElementById('rs-confirm-btn').disabled=true; return; }
  const next = rsMode==='add' ? cur + qty : qty;
  document.getElementById('rs-preview').textContent = `更新後：${cur} → ${next.toFixed(2)} ${rsSelectedItem.unit}`;
  document.getElementById('rs-preview').classList.remove('hidden');
  document.getElementById('rs-confirm-btn').disabled = false;
}

async function confirmRestock() {
  if (!rsSelectedItem) return;
  const cur = systemStockMap[rsSelectedItem.id] ?? rsSelectedItem.sys;
  const qty = parseFloat(document.getElementById('rs-qty').value);
  if (isNaN(qty)) return;
  const next = rsMode==='add' ? parseFloat((cur + qty).toFixed(2)) : qty;
  const itemName = rsSelectedItem.name, itemUnit = rsSelectedItem.unit;
  const nowIso = new Date().toISOString();
  try {
    const { error } = await sb.from('system_stock_overrides').upsert({ item_id: rsSelectedItem.id, stock_value: next, updated_at: nowIso }, { onConflict: 'item_id' });
    if (error) throw error;
    systemStockMap[rsSelectedItem.id] = next;

    // 寫入進貨紀錄
    const logEntry = {
      record_date: TODAY,
      item_id: rsSelectedItem.id,
      item_name: itemName,
      mode: rsMode,
      qty: rsMode === 'add' ? qty : null,
      before_stock: cur,
      after_stock: next,
      unit: itemUnit,
      created_at: nowIso,
    };
    const { error: logError } = await sb.from('restock_logs').insert(logEntry);
    if (!logError) todayRestockLogs.push(logEntry);

    document.getElementById('restock-modal').close();
    document.getElementById('restock-success-msg').textContent = `「${itemName}」帳面已更新為 ${next} ${itemUnit}`;
    document.getElementById('restock-success-modal').showModal();
    if (currentTab === 'overview') renderOverview();
    if (currentTab === 'count') renderItemList();
  } catch(e) {
    showToast('更新失敗，請稍後再試', true);
  }
}

// ─── MENU ───
function toggleMenu() { document.getElementById('nav-menu').classList.toggle('hidden'); }
document.addEventListener('click', e => {
  const menu = document.getElementById('nav-menu');
  if (!menu.contains(e.target) && !e.target.closest('button[onclick="toggleMenu()"]')) menu.classList.add('hidden');
});

// ─── TOAST ───
function showToast(msg, isWarn=false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = `fixed top-6 left-1/2 -translate-x-1/2 text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-sm font-medium transition-all duration-300 z-[1000] ${isWarn?'bg-orange-500/95':'bg-[#3F5144]/95'}`;
  t.classList.remove('opacity-0','-translate-y-4','pointer-events-none');
  setTimeout(()=>t.classList.add('opacity-0','-translate-y-4','pointer-events-none'), 3000);
}

// ─── GO ───
init();
</script>
</body>
